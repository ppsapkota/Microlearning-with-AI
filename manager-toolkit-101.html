/* Module 1 — Find the Real Problem */
{t:"The 5 Whys",w:"Taiichi Ohno — Toyota Production System",
i:"The simplest root-cause tool ever built: state the problem, ask why it happened, then ask why of that answer — about five times — until you reach a cause in the process, not the person. The machine stopped (why?) — the fuse blew (why?) — the bearing wasn't lubricated (why?) — the pump doesn't reach it (why?) — the pump has no maintenance schedule. Fixing the fifth why prevents the first forever; fixing the first only resets the clock.",
a:"Take your team's most recently recurring problem. Write the symptom, then ask why five times in writing. Verify the chain backwards: each answer should imply the one above it via 'therefore'.",
p:"Stopping at a person ('because Sam forgot'). A name is never a root cause — ask why the system made forgetting possible.",
L:[79,97]},
{t:"The Fishbone Diagram",w:"Kaoru Ishikawa",
i:"When a problem has many possible causes, the fishbone (Ishikawa) diagram organizes the hunt: the problem at the head, major cause categories as bones — classically people, process, equipment, materials, environment, and measurement — with specific candidate causes branching off each. Its power is completeness: the categories force you to look where you weren't looking, and building it with the team surfaces causes no single person can see.",
a:"On a whiteboard, draw the spine and six bones for a current chronic problem. Have the team populate each bone silently on stickies first, then discuss and circle the three likeliest causes to verify with data.",
p:"Treating brainstormed causes as confirmed causes. The fishbone generates suspects; data convicts them.",
L:[79,71]},
{t:"Issue Trees",w:"McKinsey problem-solving canon",
i:"An issue tree decomposes a big question into MECE branches — mutually exclusive, collectively exhaustive — then decomposes each branch again until you reach questions small enough to analyze. 'Why are we missing deadlines?' splits into demand (too much work?) and capacity (too little throughput?); each splits again. The tree turns a swirl of anxiety into an ordered set of testable hypotheses, and each branch can be assigned to a different owner without overlap.",
a:"Take your hardest current question and build a two-level tree: three to four branches, each split once more. Test every level: no overlaps, no gaps. Assign one owner per branch with a date.",
p:"Building the tree to confirm what you already believe. Include the branch you hope is false.",
L:[101,100]},
{t:"Reframe the Problem",w:"Thomas Wedell-Wedellsborg — What's Your Problem?",
i:"Wedell-Wedellsborg's famous example: tenants complain the elevator is slow. Engineers propose a faster motor — expensive. A reframe — the wait is boring — leads to mirrors by the elevator, and complaints vanish. Most managers are excellent at solving problems and mediocre at checking whether it's the right problem. Reframing asks: what else could this be a case of? Whose problem is it? What would make the problem disappear rather than get solved?",
a:"Before your next problem-solving meeting, spend the first ten minutes only on framing: write the problem three different ways, including once from the affected person's point of view. Pick the frame worth solving.",
p:"Reframing forever as a way to avoid deciding. Two or three frames, choose one, move.",
L:[87,35]},
{t:"First-Principles Thinking",w:"Aristotle; popularized by Elon Musk",
i:"Reasoning by analogy copies what exists ('this is how our reports have always worked'); reasoning from first principles decomposes the situation into fundamental truths and rebuilds from there. What is this process actually for? What is physically or logically necessary, and what is merely inherited? Managers drowning in legacy process rarely need more optimization — they need one honest pass asking which parts would survive being designed from scratch today.",
a:"Pick one process your team runs on autopilot. List what it must achieve, then design the lightest possible version from zero. Compare with reality and delete one inherited step this week.",
p:"Using 'first principles' as a slogan for ignoring hard-won experience. Decompose the reasons before discarding the practice.",
L:[2,88]},
{t:"The Iceberg Model",w:"Systems thinking — Peter Senge tradition",
i:"Events are the tip: the missed deadline, the resignation, the outage. Below sit patterns (this happens every quarter-end), beneath them structures (the incentive, the approval chain, the staffing model that produce the pattern), and at the bottom mental models (the beliefs that keep the structure in place). Reacting to events is firefighting; redesigning structures is leadership. The model's discipline: every time something goes wrong, ask what pattern it belongs to before asking whose fault it is.",
a:"Take a recent frustrating event. Write the four layers: event, pattern it belongs to, structure producing the pattern, belief holding the structure. Intervene one layer deeper than you normally would.",
p:"Diagnosing structures you then never change. Insight without a structural experiment is just sophisticated complaining.",
L:[87,88,78]},
{t:"Is / Is Not Analysis",w:"Charles Kepner & Benjamin Tregoe",
i:"Kepner-Tregoe's problem specification bounds a problem with precision before anyone theorizes: what IS affected and what comparable thing IS NOT; where it occurs and where it doesn't; when it started and when it doesn't happen; how big it is and how big it isn't. The 'is not' column is the genius — every candidate cause must explain both columns. A cause that would also affect the unaffected team is eliminated instantly, and the search space collapses.",
a:"For a current puzzle, draw two columns — Is / Is Not — across what, where, when, and extent. Then test each proposed cause: does it explain the boundary? Discard every cause that fails.",
p:"Filling the Is column only. Without the Is Not column, this is just a complaint log.",
L:[25]},
{t:"Pareto Analysis",w:"Vilfredo Pareto; Joseph Juran",
i:"Juran generalized Pareto's observation into the manager's favorite ratio: roughly 80% of effects come from 20% of causes — the vital few versus the useful many. A handful of defect types generate most complaints; a few clients generate most escalations; a couple of process steps generate most delay. The tool is a simple sorted bar chart of causes by frequency or cost — and the discipline is acting only on the tall bars until they shrink.",
a:"Take one messy category — complaints, errors, delays — and tally causes over the last month. Sort descending. Focus the team's entire improvement effort on the top two bars.",
p:"Intuition is a poor Pareto: the loudest cause is often not the largest. Count before you conclude.",
L:[91,89]},
{t:"Go and See (Gemba)",w:"Toyota — genchi genbutsu",
i:"Toyota's rule for managers: go to the actual place, watch the actual work, talk to the actual people — before forming an opinion. Dashboards, reports and second-hand summaries are abstractions with the friction removed; the gemba (the real place) contains the workarounds, interruptions and improvisations that explain the numbers. A manager who diagnoses from their desk is diagnosing a model of the work, not the work.",
a:"Block one hour this week to sit with the actual work behind your worst metric — watch a case handled end-to-end, silently. Write down every workaround you see. Ask about them with curiosity, not correction.",
p:"Turning the visit into an inspection. If people perform for you, you learn nothing — you're there as a student.",
L:[17,21]},
{t:"Gap Analysis",w:"Classic management practice",
i:"Deceptively basic and constantly skipped: define the current state honestly and in measurable terms, define the desired state concretely, and describe the gap between them — then, and only then, generate bridging options. Most failed initiatives skipped one of the three: a fuzzy current state (flattering self-assessment), a vague destination ('be more strategic'), or a leap to solutions before the gap was sized. The gap statement itself often reveals that the problem is smaller, larger, or different than assumed.",
a:"For your team's biggest ambition, write three short paragraphs: where we truly are (with evidence), where we need to be (with a number and date), and the gap. Only then list bridges.",
p:"A dishonest current state ruins everything downstream. Draft it, then ask your bluntest team member to correct it.",

{t:"SWOT — Then TOWS",w:"Albert Humphrey (attrib.); TOWS: Heinz Weihrich",
i:"SWOT lists strengths, weaknesses, opportunities and threats — and usually dies there, as four boxes of bullet points. The TOWS extension makes it a decision tool: pair the boxes into strategies. Strength–Opportunity: where do we attack? Strength–Threat: where do we defend? Weakness–Opportunity: what must we build to catch the wave? Weakness–Threat: what do we exit or urgently fix? The lists are diagnosis; the pairs are choices.",
a:"Run SWOT for your team in 20 minutes — max five items per box, evidence required. Then spend 40 minutes on the four TOWS pairings and leave with one action per pair.",
p:"Wishful strengths and euphemized weaknesses. Every item needs a fact behind it or it comes off the board.",
L:[88]},
{t:"PESTLE Scan",w:"Environmental scanning practice",
i:"PESTLE forces a look outside the building: Political, Economic, Social, Technological, Legal and Environmental forces that will reshape your work whether you watch them or not. For a middle manager it's less about geopolitics and more about anticipation: funding climates, demographic shifts in your users, a technology maturing toward your process, regulation in draft. Teams that scan annually get surprised less — and surprise is the most expensive way to learn.",
a:"Once a quarter, spend 30 team minutes listing the two most consequential shifts in each letter for your unit. Pick the one you're least prepared for and assign a one-page implications memo.",
p:"Scanning without consequence. Every scan must end with at least one change to a plan, or it's a trivia exercise.",
L:[88,84]},
{t:"Porter's Five Forces",w:"Michael Porter — Harvard Business School",
i:"Porter's classic explains why some environments are structurally harder than others: rivalry among existing players, bargaining power of suppliers, power of buyers, threat of new entrants, and threat of substitutes. For internal teams the translation is illuminating: who else could do what your team does (substitutes)? How replaceable are your inputs (supplier power)? How captive are your internal customers (buyer power)? A team that understands its structural position stops mistaking headwinds for underperformance.",
a:"Map the five forces for your team's 'market' — even an internal one. Identify the strongest force working against you and one move that weakens it.",
p:"Treating the analysis as static. Forces shift — the substitute that didn't exist last year may be a pilot project today.",
L:[88]},
{t:"Three Horizons",w:"Baghai, Coley & White — The Alchemy of Growth (McKinsey)",
i:"McKinsey's three horizons discipline: Horizon 1 is the core — today's operation to defend and extend; Horizon 2 is emerging opportunities being scaled; Horizon 3 is options being seeded for the future. The insight is not the categories but the simultaneity: healthy organizations — and teams — invest in all three at once, because horizons can't be visited sequentially. A team that is 100% Horizon 1 is efficient today and obsolete on a schedule.",
a:"Classify your team's current work by horizon. If Horizon 2 plus 3 is under 15% of capacity, deliberately move one person-day per week into building what's next.",

i:"BCG's matrix sorts a portfolio by market growth and relative share: Stars (high/high — invest), Cash Cows (low growth, high share — harvest to fund others), Question Marks (high growth, low share — decide fast), and Dogs (low/low — divest). Managers can apply it to anything portfolio-shaped: products, services, projects, even recurring reports. Its enduring lesson is cross-subsidy: something must fund the future, and something must stop consuming it.",

p:"Sentimentality about dogs. The project someone loves but nobody needs is taxing your stars.",

{t:"The Ansoff Matrix",w:"Igor Ansoff",
i:"Ansoff maps growth options by two questions: existing or new offerings, existing or new audiences. Market penetration (existing/existing) is safest; product development and market development carry moderate risk; diversification (new/new) is the double leap that fails most often. For a team, it disciplines ambition: serving current stakeholders better, taking current services to new stakeholders, or building new services — each quadrant deserves different levels of evidence before you commit.",
a:"Place your team's three growth ideas in the matrix. For any idea two steps from home (new offering AND new audience), demand a small pilot before any real investment.",
p:"Undercounting the risk of diagonal moves. New-to-you offering plus new-to-you audience means you have no compass — test twice as hard.",
L:[96]},
{t:"The Business Model Canvas",w:"Alexander Osterwalder & Yves Pigneur",
i:"One page, nine blocks: customer segments, value propositions, channels, customer relationships, revenue streams (or funding), key resources, key activities, key partnerships, cost structure. Built for startups, it's quietly powerful for any team: forcing yourself to articulate who you serve, what value you create for them, and what it costs to deliver exposes fuzzy assumptions fast. Many internal teams discover they can't fill in 'value proposition' without writing what they do instead of what changes for the customer.",
a:"Sketch the canvas for your own team in 30 minutes. Where the value proposition reads like a task list, rewrite it as the outcome your customers would miss if you vanished.",
p:"Filling the boxes with aspiration instead of evidence. The canvas is a set of hypotheses to test, not a brochure.",
L:[0]},
{t:"VRIO",w:"Jay Barney — resource-based view",
i:"What makes a capability a real advantage? Barney's four tests: is it Valuable (exploits opportunities or neutralizes threats), Rare (competitors lack it), Inimitable (hard to copy or substitute), and is the team Organized to capture it? Skills that pass one test are table stakes; capabilities that pass all four are worth defending fiercely. For a manager it reframes development strategy: which of your team's strengths is genuinely distinctive, and are you organized to actually use it?",
a:"List your team's five main capabilities and run each through V-R-I-O. Take the one that passes furthest and make sure it's central to how your team is deployed and known.",
p:"Confusing 'we're good at this' with 'this is rare'. Most competence is common; distinctiveness is what commands attention and resources.",
L:[36]},
{t:"Scenario Planning",w:"Pierre Wack — Royal Dutch Shell",
i:"Shell's planners under Wack famously prepared the company for the 1973 oil shock not by predicting it, but by rehearsing plausible futures until managers' mental models loosened. Scenario planning builds three or four internally consistent stories about how key uncertainties could unfold — then tests today's plans against each. The output isn't a forecast; it's a strategy robust across futures, plus early-warning signals that tell you which world you're entering.",
a:"Pick your two biggest uncertainties (e.g., funding up/down × demand shifts). Sketch the four combinations as short narratives, and identify one action that makes sense in all four — do that one now.",
p:"Building one 'official future' with cosmetic variations. Scenarios only work when at least one genuinely threatens today's plan.",
L:[87]},
{t:"Blue Ocean: The ERRC Grid",w:"W. Chan Kim & Renée Mauborgne — Blue Ocean Strategy",
i:"Instead of fighting for share in crowded red oceans, Kim and Mauborgne's ERRC grid redesigns the offer: what factors can we Eliminate that the field takes for granted? Reduce well below the standard? Raise well above it? Create that has never been offered? Cirque du Soleil eliminated animals and star performers, raised artistry, created theatrical narrative — and left the circus price war behind. Teams can ERRC their services: stop competing on what everyone does and redefine what 'good' means.",
a:"Run ERRC on one service your team provides. Find one thing to eliminate outright, one to reduce, one to raise, and one to create — and pilot the new shape with one customer.",
p:"Only adding (raise, create) without subtracting. The grid's power is that elimination funds the innovation.",

/* Module 3 — Diagnose People & Performance */
{t:"The Skill–Will Matrix",w:"Max Landsberg — The Tao of Coaching",
i:"Two questions about any person on any task: can they (skill), and do they want to (will)? The four quadrants each demand a different response: high skill/high will — delegate and get out of the way; high skill/low will — diagnose the motivation (often boredom, unfairness, or burnout), don't retrain what isn't broken; low skill/high will — guide and train, protect the enthusiasm; low skill/low will — direct closely and address both honestly. Most management errors are quadrant errors: training a motivation problem, or motivating a skill problem.",
a:"Place each direct report on the matrix for their main current assignment. Check your recent behavior toward each — does your style match their quadrant, or your habit?",
p:"Treating the placement as a personality verdict. It's per task and per moment — the same person moves quadrants weekly.",
L:[37,57]},
{t:"Can't Do — or Won't Do?",w:"Robert Mager & Peter Pipe — Analyzing Performance Problems",
i:"Mager and Pipe's flowchart starts with a razor of a question: could they do it if their life depended on it? If no, it's a genuine skill gap — train, simplify, or provide job aids. If yes, training is a waste; look at the environment: is good performance punished (finish early, get more work)? Is poor performance rewarded? Does performing even matter to them? Most 'performance problems' dissolve under this analysis into badly designed conditions the manager controls.",
a:"For one underperformance case, answer honestly: could they do it if everything depended on it? If yes, list what currently punishes doing it well and what rewards not doing it. Fix one condition before any conversation about attitude.",
p:"Defaulting to training because it feels constructive. Training a won't-do problem insults the person and wastes the budget.",
L:[64,34]},
{t:"The 9-Box Grid",w:"Talent management practice (popularized at GE)",
i:"Performance on one axis, potential on the other, nine cells. Used well, it's a conversation structure: it forces a management team to compare evidence, calibrate standards, and notice who is coasting, who is misplaced, and who is ready before a vacancy forces the question. Used badly, it's a caste system. The map should drive development actions — stretch for high-potentials, re-scoping for solid professionals, honest support for the struggling — not permanent labels.",
a:"Plot your team privately. For every person, write one development action their box implies — then check: have you actually taken it? The grid is only as ethical as the actions it triggers.",
p:"'Potential' quietly becoming 'reminds me of me'. Define potential behaviorally — learning speed, ambition, adaptability — or bias fills the vacuum.",
L:[2,99]},
{t:"RACI",w:"Responsibility charting — classic practice",
i:"For any deliverable, four roles: Responsible (does the work), Accountable (owns the outcome — exactly one person), Consulted (input before), Informed (told after). Most chronic team friction — duplicated work, dropped balls, meddling stakeholders, decisions that unravel — is undiagnosed role ambiguity, and a thirty-minute RACI conversation cures more of it than a year of teambuilding. The A column is where the arguments live, which is exactly why it must be had out loud.",
a:"Take one deliverable that generated friction recently. Build its RACI with everyone involved in the room. Fight until every row has exactly one A. Publish it.",
p:"RACI as wallpaper — built once, never consulted. Revisit it the moment friction reappears; friction means the chart and reality have diverged.",
L:[64,54]},
{t:"The Team Health Check",w:"Lencioni's team assessment; Google re:Work; Spotify model",
i:"Stop guessing how your team is doing — instrument it. A health check is a short recurring survey the team answers honestly (often anonymously): Lencioni's five dysfunctions, Google's five conditions, or Spotify-style traffic lights on dimensions like speed, learning, fun, and mission clarity. The score matters less than the trend and the conversation: reviewing results together, letting the team name the worst dimension, and choosing one experiment converts vague grumbling into shared diagnosis.",
a:"Run a ten-question pulse this month (rate 1–5: trust, conflict quality, clarity, workload, recognition…). Present results unfiltered, let the team pick the worst score, and co-design one experiment for the next month.",
p:"Surveying without acting. One ignored health check teaches the team that honesty is pointless — worse than never asking.",
L:[70,74]},
{t:"The Stay Interview",w:"Retention practice — Beverly Kaye & Sharon Jordan-Evans",
i:"Exit interviews collect the truth when it's too late to use. The stay interview asks it while it still matters: What keeps you here? What would tempt you away? When did you last think about leaving, and what triggered it? What do you want to learn next? What should I do more or less of? Done annually with every team member — separately from performance reviews — it surfaces flight risks, stalled growth, and manager blind spots months before a resignation letter would.",
a:"Schedule 30 minutes with each person this quarter titled honestly: 'a conversation about what keeps you here'. Ask the five questions, take notes, and change one thing per person based on what you hear.",
p:"Getting defensive at the answers. The moment you argue with 'what would tempt you away', the interviews are over — forever.",
L:[63,93]},
{t:"The Johari Window",w:"Joseph Luft & Harrington Ingham",
i:"Four panes of self-knowledge: the Arena (known to me and others), the Blind Spot (others see it, I don't), the Façade (I know, I hide), and the Unknown (nobody yet sees). Leadership growth is enlarging the Arena from two directions — soliciting feedback shrinks the blind spot; judicious disclosure shrinks the façade. For teams, the model explains why feedback-poor, disclosure-poor groups stay strangers: everyone is operating on one small pane of everyone else.",
a:"Ask three colleagues one question this week: 'What is one thing I do that I probably don't see?' Separately, share one working-style truth about yourself the team doesn't know but should.",
p:"Demanding others' disclosure while offering none. The window opens from your side first.",
L:[3,43]},
{t:"The Capacity Heatmap",w:"Workload management practice",
i:"Burnout and bottlenecks hide in averages: the team is 'at 85%' while two people are at 130% and two at 60%. A capacity heatmap makes load visible — people down one axis, weeks across the other, cells colored by committed load versus availability. It converts anecdote ('everyone is slammed') into diagnosis (who, when, why), exposes the hero quietly drowning, and gives you the evidence to rebalance, push back, or hire before something breaks.",
a:"Build the grid for the next six weeks with your team's honest estimates. Color anything over 100% red. For every red cell, decide: move work, move dates, or move it off the list entirely.",
p:"Trusting the plan instead of the person. Ask each person what their real load feels like — heatmaps miss the invisible work.",
L:[4,95,89]},
{t:"The Motivation Audit",w:"Applied from Pink's AMP and Rock's SCARF",
i:"When someone disengages, managers guess — usually wrong, usually 'attitude'. The motivation audit replaces guessing with a structured scan: rate the person's current experience of autonomy, mastery and purpose (Pink), then scan the five SCARF domains — status, certainty, autonomy, relatedness, fairness — for a recent threat: a reorg, a perceived slight, an inequity, an exclusion. Disengagement is data; the audit tells you which lever actually moved, so your intervention matches the cause.",
a:"For one disengaged person, score the three AMP drivers and five SCARF domains from their point of view, with a recent event as evidence for each low score. Address the lowest-scoring domain first — usually within one conversation.",
p:"Auditing without asking. Your inference is a hypothesis; the one-on-one is where it gets tested.",
L:[60,62,63]},
{t:"Network Mapping",w:"Organizational Network Analysis (ONA) — Rob Cross",
i:"The org chart shows who reports to whom; the network map shows how work actually flows — who people go to for information, help, decisions, and energy. Cross's research finds the two diverge dramatically: hidden connectors carry huge invisible load (and burn out or leave, taking the network with them), while some formal roles sit outside the real flow entirely. Even an informal sketch — asking your team 'who do you rely on to get work done?' — reveals overloaded brokers, isolated members, and fragile single points of connection.",
a:"Sketch your team's real network: for each person, draw arrows to whom they depend on weekly. Look for one overloaded hub to relieve and one isolated person to deliberately reconnect.",
p:"Punishing the hub by adding recognition-free load. Connectors need protection and acknowledgment, not more traffic.",
L:[81,83]},
/* Module 4 — Diagnose Process & Flow */
{t:"Value Stream Mapping",w:"Lean — Mike Rother & John Shook, Learning to See",
i:"Follow one piece of work — a request, a case, a document — from first contact to delivered value, mapping every step, queue, and handoff, with two clocks running: touch time (someone actually working on it) and elapsed time. The revelation is almost universal: work is actively touched for a few hours and waits for weeks. The waiting is invisible in everyone's individual view and obvious on the map — and it's where most delivery time actually lives.",
a:"Pick one recent completed request and reconstruct its journey with real dates: every step, every queue. Compute touch time versus total time. Attack the single longest wait, not the busiest step.",
p:"Mapping the official process instead of a real item's actual path. Follow one true story — the workarounds are the diagnosis.",
L:[91]},
{t:"Find the Bottleneck",w:"Eliyahu Goldratt — The Goal (Theory of Constraints)",
i:"Goldratt's law: every system has one constraint, and the system's throughput equals the constraint's throughput — nothing more. Improving anything else is an illusion of progress; an hour lost at the bottleneck is an hour lost forever, while an hour saved elsewhere is a mirage. His five focusing steps: identify the constraint, exploit it fully (no idle time, no low-value work there), subordinate everything else to it, elevate it (add capacity) — then find the new constraint and repeat.",
a:"Ask where work piles up waiting in your team — that queue marks the constraint. This week: strip every low-value task away from that person or step, and make everyone else's schedule serve it.",
p:"Improving where improvement is easy instead of where it matters. Busy non-bottlenecks going faster just makes the pile bigger.",
L:[91,92]},
{t:"SIPOC",w:"Six Sigma practice",
i:"Before diving deep into any process, frame it in one row each: Suppliers (who provides inputs), Inputs, Process (five to seven high-level steps only), Outputs, and Customers (who receives them, and what they require). SIPOC takes an hour and prevents the two classic scoping failures — analyzing a process without agreeing where it starts and ends, and optimizing outputs no customer actually asked for. It's the establishing shot before the close-ups.",
a:"With the people who run it, SIPOC one troubled process on a single page. Then verify the right edge: ask an actual customer whether the outputs listed are the outputs they need.",
p:"Detail creep — twenty process steps and sub-bullets. SIPOC is deliberately shallow; depth comes later, and only where the frame says it's worth it.",
L:[64]},
{t:"The Swimlane Map",w:"Process mapping practice — Geary Rummler tradition",
i:"Draw the process as horizontal lanes — one per role or department — with the work moving between lanes as it progresses. The vertical crossings are the point: every lane change is a handoff, and handoffs are where work waits, mutates, and dies. Rummler's insight was that the biggest performance problems live in the white space between boxes on the org chart — exactly what a swimlane map makes visible and a task list never will.",
a:"Swimlane one cross-team process that frustrates everyone. Count the lane crossings. For the two most failure-prone handoffs, agree an explicit contract: what is passed, in what state, by when, with what notification.",
p:"Optimizing inside lanes when the disease is between them. Fewer, cleaner handoffs beat faster steps almost every time.",
L:[77]},
{t:"Hunt the 8 Wastes",w:"Lean — TIMWOODS",
i:"Lean names eight wastes to hunt in any process: Transport (moving work around), Inventory (piles of unfinished work), Motion (people moving unnecessarily — including digital motion through seven systems), Waiting, Overproduction (making more or earlier than needed), Overprocessing (more polish than the customer values), Defects (rework), and Skills — the eighth waste — talent unused. The list works as a lens: walk any process with these eight words and waste that was furniture becomes visible.",
a:"Take the eight words to one recurring team process and find one concrete example of each — with the team, not for them. Eliminate the easiest two this month; measure the time returned.",
p:"Hunting waste in other teams' processes first. Credibility comes from publicly de-wasting your own meetings and reports.",
L:[36,91]},
{t:"FMEA",w:"Failure Modes & Effects Analysis — aerospace/automotive practice",
i:"Before launch, systematically ask of each component or step: how could this fail (failure modes), what happens if it does (effects), and score each mode on severity, likelihood, and detectability — multiplied into a risk priority number. The genius is detectability: a moderate failure you won't notice for a month often outranks a severe one that alarms instantly. Teams FMEA-ing a launch plan reliably find the quiet killer: the step everyone assumed someone else was watching.",
a:"For your next launch or rollout, list ten ways it could fail. Score each 1–5 on severity, likelihood, and how invisible the failure would be. Multiply, rank, and build mitigations for the top three.",
p:"Scoring theater — precise numbers on wild guesses. The ranking conversation is the value; the arithmetic is just a way to force it.",
L:[98,79]},
{t:"Little's Law & WIP Limits",w:"John Little; kanban practice",
i:"Little's Law is arithmetic with managerial teeth: average cycle time equals work-in-progress divided by throughput. Start more without finishing faster and everything simply takes proportionally longer — the math is merciless. This is why kanban limits WIP: capping how much the team has 'in flight' forces finishing before starting, shrinks context-switching, and makes blocked work scream instead of silently aging. Teams drowning in twenty parallel priorities aren't unproductive; they're over-admitted.",
a:"Count your team's current items in flight. Halve the number as a WIP limit for one month: nothing new starts until something finishes. Watch cycle time drop without anyone working harder.",
p:"Leadership breaking its own limit with 'just this one urgent thing'. Every exception restarts the queue disease.",
L:[95,89]},
{t:"Common Cause or Special Cause?",w:"W. Edwards Deming; Walter Shewhart",
i:"Deming's most protective distinction for teams: common-cause variation is the noise inherent in the system (results bouncing within a normal band), while special-cause variation signals something genuinely changed. Reacting to common-cause noise as if it were signal — interrogating every downtick, celebrating every uptick — is 'tampering', and it adds variation while teaching people to fear numbers. Most monthly fluctuations are common cause; the honest response is to improve the system, not to demand explanations for noise.",
a:"Plot your key metric's last 24 points. Eyeball the normal band. Commit publicly: inside the band, no interrogations — we work on the system; outside it, we investigate immediately.",
p:"Asking 'what happened this week?' about a point inside the band. Every forced explanation of noise is a small tax on your team's honesty.",
L:[79,78]},
{t:"Shadow the Work (DILO)",w:"Day-in-the-Life-Of — operations consulting practice",
i:"Spend a real day — or a disciplined half-day — beside one person doing the work: every task, interruption, system, workaround, and wait, logged as it happens. A DILO reveals what no report can: the eleven logins, the spreadsheet bridging two 'integrated' systems, the hour lost to a meeting that exists because of a mistrust three reorganizations ago. People consistently underestimate their interruptions and overestimate their discretionary time; the shadow log replaces both illusions with footage.",
a:"Shadow one team member for half a day this month (with their consent, as a learner). Log activities in 15-minute blocks. Debrief together: which two frictions surprised you both, and which one will you personally remove?",
p:"Observing the person instead of the system. The moment it feels like surveillance, you'll see a performance — and fix nothing.",
L:[17,21]},
{t:"PDCA",w:"W. Edwards Deming — the Shewhart cycle",
i:"Plan-Do-Check-Act is the smallest complete unit of improvement: plan a change with a prediction, do it small, check results against the prediction, then act — adopt, adjust, or abandon. Its power is the prediction: writing down what you expect before acting converts activity into learning, because surprise becomes measurable. Most teams do Plan-Do-Plan-Do, piling change on change with no check — which is how organizations stay busy for years without learning anything.",
a:"For your next process tweak, write one sentence before starting: 'We predict this change will move X by Y within Z weeks.' Calendar the check now. Hold the review even if — especially if — it worked.",
p:"Skipping Check when results feel good. Unverified success spreads as confidently as verified failure.",
L:[97,2]},
/* Module 5 — Prioritize Ruthlessly */
{t:"The Eisenhower Matrix",w:"Dwight Eisenhower; popularized by Stephen Covey",
i:"Two axes — urgent and important — four fates: important and urgent gets done now; important but not urgent gets scheduled (this is the quadrant where leadership actually lives, and the one that starves); urgent but not important gets delegated; neither gets deleted. Eisenhower's underlying observation still stings: what is important is seldom urgent, and what is urgent is seldom important. The matrix is less a filing system than a daily act of resistance against other people's urgency.",
a:"Sort today's task list into the four boxes in five minutes. Schedule one Quadrant 2 block this week as unmovable, delegate one Quadrant 3 item today, and delete one Quadrant 4 item without ceremony.",
p:"Everything landing in Quadrant 1. If it's all urgent-important, your planning horizon is too short — the matrix is diagnosing procrastination upstream.",
L:[7]},
{t:"The Impact–Effort Matrix",w:"Prioritization practice",
i:"The fastest useful 2×2 in management: plot candidate actions by impact and effort. Quick wins (high impact, low effort) go first; major projects (high/high) get planned properly; fill-ins (low/low) wait for slack; thankless tasks (low impact, high effort) get killed — out loud. Its best use is in groups: the argument about which quadrant something belongs in surfaces buried assumptions about both the value and the cost, which is precisely the conversation most backlogs never have.",
a:"Put your team's current wish list on this grid together in 30 minutes. Start the top quick win this week — and formally cancel one thankless task, announcing why.",
p:"Optimism bias on both axes: everything looks high-impact and low-effort from a distance. Demand one piece of evidence per placement.",
L:[91]},
{t:"MoSCoW",w:"Dai Clegg — DSDM/agile practice",
i:"Must have, Should have, Could have, Won't have (this time). The categories look banal; the discipline isn't. 'Must' means the delivery fails without it — a bar almost nothing truly clears, which is the point. And the W is the tool's soul: a public, explicit list of what will not be done this round, agreed before work starts. Teams without a Won't list still have one — it's just discovered at the deadline, in disappointment, by their stakeholders.",
a:"For your next deliverable, force-rank requirements into the four buckets with stakeholders in the room. Cap Musts at 60% of capacity. Publish the Won't list with the same prominence as the Musts.",
p:"Must-inflation under stakeholder pressure. Every fake Must devalues the real ones and reinvents the overcommitment you bought the tool to cure.",
L:[89]},
{t:"RICE Scoring",w:"Sean McBride — Intercom",
i:"For competing initiatives: score Reach (how many people affected per period), Impact (how much each is affected), Confidence (how sure are you of those estimates — the honesty term), and Effort (person-time), then compute Reach × Impact × Confidence ÷ Effort. The formula won't be right, but it will be consistent — and the confidence factor is quietly profound: it forces pet projects backed by anecdote to declare themselves against smaller bets backed by evidence.",
a:"Score your team's top eight backlog items with RICE in one sitting. Don't obey the ranking blindly — but make anyone who wants to override it say out loud which number they're disputing.",
p:"False precision — debating 4.2 versus 4.5. RICE is for sorting orders of magnitude, not decimals; if two scores are close, they're tied.",
L:[90]},
{t:"The Weighted Decision Matrix",w:"Multi-criteria decision analysis",
i:"When options and criteria both multiply — vendors, candidates, locations, designs — the weighted matrix keeps thinking honest: agree the criteria first, weight them by importance before seeing how options score (the crucial sequencing), then rate each option per criterion and sum. Its real product isn't the winning number; it's the argument structure. Disagreements decompose into 'we weight this differently' or 'we score this differently' — both resolvable — instead of collided gut feelings, which aren't.",
a:"For a live multi-option decision, set five criteria and weights with the group before any scoring. Score independently, then compare. Investigate the biggest scoring gaps — that's where the information is.",
p:"Reverse-engineering weights until the favorite wins. If the result surprises you and you immediately adjust weights, at least say so honestly.",
L:[72]},
{t:"The Kano Model",w:"Noriaki Kano",
i:"Not all improvements are equal, and Kano explains why: Basics are expected — invisible when present, infuriating when absent (no praise for a working login). Performance factors scale satisfaction linearly (faster is better). Delighters surprise — absent without penalty, present with disproportionate joy. The strategic traps are investing past the ceiling on basics, or chasing delighters while a basic is broken. And delighters decay: yesterday's wow is tomorrow's expectation, so the map must be redrawn periodically.",
a:"Sort your service's features into the three types from your customers' view — then verify by asking a few of them. Fix any broken basic before funding any delighter.",
p:"Assuming you know which is which. What your team considers a delighter is often, to users, a basic you're late on.",
L:[66]},
{t:"Cost of Delay",w:"Don Reinertsen — The Principles of Product Development Flow",
i:"Prioritization's missing number: what does waiting cost? Reinertsen argues most organizations quantify effort obsessively and delay not at all — yet delay cost differs across projects by orders of magnitude. Weighted Shortest Job First operationalizes it: prioritize by cost-of-delay divided by duration, which front-loads small, urgent, high-value work and exposes the truth that a 'high-priority' project that can wait six months at no cost isn't high priority — it's just high status.",
a:"For your top five initiatives, estimate roughly what one month of delay costs each (money, users, risk, trust). Divide by duration. Compare the resulting order with your current one — and explain any difference out loud.",
p:"Ignoring nonlinear delay: some items cost little to delay until a date, then everything (deadlines, regulatory windows). Flag those separately.",
L:[92,96]},
{t:"The Opportunity Cost Lens",w:"Economics fundamental",
i:"Every yes silently prices what you gave up: the real cost of any commitment is the best alternative it displaced. Managers who evaluate requests in isolation — is this worthwhile? — say yes to everything mildly useful and wonder why nothing important is finishing. The lens reframes the question permanently: not 'is this worth doing?' but 'is this worth doing instead of the best thing we'd otherwise do with the same people and weeks?' Merely worthwhile is the enemy of essential.",
a:"For the next incoming request, answer in writing before deciding: 'If we do this, the thing we won't do is ___.' If you can't name what it displaces, you don't yet know your priorities well enough to say yes.",
p:"Applying the lens only to new requests. Standing commitments — legacy meetings, reports, rituals — deserve the same audit annually.",
L:[89,91]},
{t:"The 25/5 Exercise",w:"Attributed to Warren Buffett",
i:"The famous discipline (attributed, perhaps apocryphally, to Buffett's advice to his pilot): write your top 25 goals, circle the five that matter most — then treat the other twenty not as a someday list but as an avoid-at-all-costs list, because they are the polished, defensible, attractive distractions most likely to eat the five. Mediocre temptations are easy to refuse; it's the good goals that kill the great ones. The exercise works identically for a team's portfolio.",
a:"Run it for your team: list everything you're trying to do (it will be about 25 things), circle five together, and write the rest on a visible 'not now, on purpose' list. Review quarterly.",
p:"Keeping the twenty 'warm' with a little effort each. A goal on life support still consumes attention — the list only works if the twenty get zero.",
L:[89,92]},
{t:"Calendar Forensics",w:"Time-audit practice — Drucker tradition",
i:"Drucker's starting point for every executive he advised: don't discuss priorities — pull the calendar and count. Two weeks of actual time, categorized honestly (firefighting, meetings attended out of habit, coaching, planning, deep work), is the most confronting diagnostic in management, because the calendar is a ledger of revealed preferences. The gap between what you call important and where your hours went is measurable — and your team reads your calendar, not your speeches, to learn what you truly value.",
a:"Categorize every block of the last two weeks into five buckets. Compute percentages. Pick the worst mismatch with your stated priorities and change next week's calendar structurally — a standing block, a delegated meeting, a hard stop.",
p:"Auditing once and drifting back. Calendars regress to other people's priorities within a month; re-run the audit quarterly.",
L:[7,91]},
/* Module 6 — Core Decision Frameworks */
{t:"Cynefin",w:"Dave Snowden",
i:"Before deciding how to act, decide what kind of situation you're in. Cynefin names four: Clear (best practice exists — apply it), Complicated (expertise can analyze it — get experts, then decide), Complex (cause and effect visible only in hindsight — probe with safe experiments, sense, respond), and Chaotic (act first to establish order). The costliest category error in management is treating complex as complicated: hiring analysis to predict what only experiments can reveal, then blaming the plan when reality declines to cooperate.",
a:"Sort your three thorniest current challenges into the four domains. For anything complex, cancel the master plan and design three small parallel probes instead.",
p:"Everything looking Complicated to a manager who likes analysis. If experts keep being confidently wrong about it, you're in Complex — switch to probes.",
L:[87,88]},
{t:"The OODA Loop",w:"Colonel John Boyd — US Air Force",
i:"Observe, Orient, Decide, Act — then loop. Boyd's insight from aerial combat wasn't the sequence; it was tempo and orientation. Whoever cycles faster operates inside the opponent's loop, acting on fresher reality. And Orient — the filter of experience, assumptions and mental models through which you interpret what you observe — is where loops break: organizations observe plenty and orient poorly, fitting new facts to old maps. For managers: shorten the loop, and audit the lens, not just the data.",
a:"For one fast-moving situation, write the four steps explicitly: what are we actually observing (facts), how are we interpreting (orientation — name the assumptions), what do we decide, when do we re-loop? Schedule the re-loop before acting.",
p:"Fast loops on a stale orientation. Cycling quickly through a wrong mental model just gets you to the wrong place sooner.",
L:[88,96]},
{t:"Decision Trees & Expected Value",w:"Decision analysis — Howard Raiffa tradition",
i:"When choices branch under uncertainty, draw them: decision nodes (squares) for what you control, chance nodes (circles) for what you don't, probabilities and outcomes on the leaves, expected value multiplied back. The numbers are estimates — the value is what the drawing forces: naming the scenarios, admitting probabilities out loud, and discovering dominated options (worse in every branch). Managers who sketch even a crude tree stop comparing a risky option's best case against a safe option's worst case — the most common bad-decision arithmetic there is.",
a:"For one uncertain choice, sketch the tree on one page with rough probabilities and outcomes. Compute expected values — then ask the more important question: can we survive the worst branch of the winner?",
p:"Expected value without ruin-awareness. A positive-EV bet you can't afford to lose is still a bet you can't afford.",

{t:"Second-Order Thinking",w:"Howard Marks — Oaktree Capital",
i:"First-order thinking asks 'what happens?'; second-order thinking asks 'and then what?' Marks's point: first-order conclusions are what everyone reaches, so they're priced in — the edge, and the danger, live in the consequences of consequences. Management is dense with second-order traps: incentives that optimize the metric and corrode the behavior; a bailout that solves today and teaches helplessness; a hiring freeze that saves salary and burns out the people who remain. For every significant move, the discipline is one more question: what does this cause after it works?",
a:"Take your next significant decision and write three columns: immediate effect, effect in six months, effect on what people learn to expect from you. If column three alarms you, redesign now.",
p:"Second-order paralysis — infinite ripple analysis as a reason never to act. Two orders deep is usually enough; decide there.",

{t:"DACI",w:"Intuit; RAPID: Bain & Company",
i:"Decisions stall and unravel for the same reason: nobody agreed who decides. DACI names the roles per decision: one Driver (herds the process), one Approver (makes the call — singular, by design), Contributors (consulted for expertise), Informed (told afterward). Its sibling RAPID separates Recommend from Decide. The framework matters less than the act: naming, before the debate, exactly whose call it is — which converts meetings from ambiguous consensus theater into structured input to a known decider.",
a:"For the three biggest decisions in flight around your team, write the DACI for each and circulate it. Where you can't fill in the single Approver, escalate that ambiguity today — it's the real blocker.",
p:"Two Approvers 'for alignment'. A decision with two owners has zero; the fight you're avoiding now returns later, with interest.",

{t:"How Much Voice?",w:"Victor Vroom & Philip Yetton",
i:"Vroom and Yetton mapped when a leader should decide alone, consult individuals, consult the group, facilitate consensus, or delegate entirely. The variables are unsentimental: decision quality requirements, your information versus theirs, likelihood of commitment without involvement, time pressure, and team alignment. The point isn't the full decision tree — it's the rejection of a signature style. 'I'm collaborative' applied to a fire is abdication; 'I'm decisive' applied to a decision needing buy-in is a slow-motion veto by the uncommitted.",
a:"For your next three decisions, choose the involvement level deliberately and announce it: 'I'll decide after consulting you' / 'this one is the team's call.' Notice which level you were defaulting to regardless of fit.",
p:"Fake consultation — asking for input after deciding. People forgive being told; they don't forgive being polled as decoration.",

{t:"Six Thinking Hats",w:"Edward de Bono",
i:"Groups argue badly because everyone thinks in different modes simultaneously — one person's optimism colliding with another's risk-scan, both mistaking mode for position. De Bono's hats sequence the modes so the whole group does one at a time: White (facts only), Red (feelings, no justification required), Black (risks and flaws), Yellow (benefits and value), Green (alternatives and creativity), Blue (process control). Everyone wears black together, so the skeptic isn't a blocker — they're this segment's whole room.",
a:"Run your next contested proposal through five hats in 25 minutes: facts, feelings, risks, benefits, alternatives — timed, in sequence, everyone in each mode together. Decide after, not during.",
p:"Letting the discussion collapse back into free-for-all mid-hat. The facilitator's only job is defending the current hat.",
L:[71]},
{t:"The Premortem",w:"Gary Klein",
i:"Before committing, gather the team and announce: it is one year from now, and this plan has failed — completely. Now each person writes, silently and independently, the story of why. Klein's research shows this 'prospective hindsight' dramatically improves flaw detection: certainty that failure occurred unlocks causes that optimism-under-politeness suppresses. Crucially, it legitimizes doubt — the premortem makes voicing risk an assignment rather than an act of disloyalty, which is why it belongs before every major commitment.",
a:"At your next launch decision, take ten minutes: everyone writes the failure story independently, then reads it aloud. Cluster the causes, build mitigations for the top three into the plan — visibly.",
p:"Running it after the decision is emotionally sealed. A premortem the leader treats as a formality collects polite fiction.",
L:[10,97]},
{t:"Stakes × Reversibility",w:"Decision-sizing practice — extends Bezos's doors",
i:"Two questions size any decision: how much is at stake, and how reversible is it? Low stakes, reversible: decide now, almost any way — the analysis costs more than an error. High stakes but reversible: decide fast, instrument closely, be ready to reverse. Low stakes, irreversible: pause briefly — irreversibility deserves respect even when cheap. High stakes, irreversible: this is where real process belongs — the premortems, the outside views, the sleep. Most organizations invert this, agonizing over reversible trivia and sleepwalking into one-way doors.",
a:"Write the 2×2 on your whiteboard. Route this week's decisions through it out loud, and delegate everything in the low-stakes/reversible box permanently — with the matrix as the delegation rule.",
p:"Misjudging reversibility. Decisions that touch trust, reputation, or people's careers are one-way more often than they look.",
L:[96,54]},
{t:"Satisfice on Purpose",w:"Herbert Simon; Barry Schwartz",
i:"Simon's Nobel-winning observation: real decision-makers can't maximize — information, time and cognition are bounded — so good ones satisfice: define what 'good enough' means, then take the first option that clears it. Schwartz added the psychology: maximizers, who must examine every alternative, decide slower, regret more, and enjoy their choices less — even when their outcomes are objectively better. The managerial craft is choosing where each mode belongs: satisfice the reversible and the routine; save maximizing for the few one-way doors.",
a:"For your next recurring decision (vendor renewal, meeting format, template), write the good-enough criteria first — three bullet points — and commit to accepting the first option that meets them.",
p:"Satisficing the wrong decisions. 'Good enough' is a strategy for the routine, not for the hire, the safety call, or the one-way door.",

/* Module 7 — Guard Against Bias */
{t:"WRAP",w:"Chip & Dan Heath — Decisive",
i:"The Heaths distilled decision research into four villains and four counters. Narrow framing ('should we do X or not?') — Widen your options: hunt for the third and fourth choice, ask what you'd do if the current options vanished. Confirmation bias — Reality-test your assumptions: run small experiments, ask disconfirming questions. Short-term emotion — Attain distance: 10/10/10, or ask what you'd tell a friend. Overconfidence — Prepare to be wrong: premortems, tripwires. Four moves, applicable to any decision bigger than lunch.",
a:"Before your next significant call, run the four letters as a checklist in writing: What third option exists? What test would disconfirm my favorite? What would I advise a friend? What tripwire tells me I was wrong?",
p:"Using WRAP only on big formal decisions. The villains do their best work in the small daily calls nobody examines.",
L:[32,96]},
{t:"Inversion",w:"Carl Jacobi; Charlie Munger",
i:"Munger's favorite mental habit, borrowed from the mathematician Jacobi: invert, always invert. Instead of asking how to succeed, ask how to guarantee failure — then avoid that. 'How do we make this team great?' produces platitudes; 'how would we reliably destroy this team's morale by June?' produces an uncomfortably specific list, half of which is usually already happening. Avoiding stupidity is more tractable than seeking brilliance, and the failure-framed question slips past the brain's optimism filters.",
a:"With your team, spend fifteen minutes answering: 'How would we guarantee this project fails / our best people leave / our customers stop trusting us?' Then audit the list against current reality and stop the two matches.",
p:"Treating it as a joke exercise. The list is only useful if you genuinely check which failure-guarantees you're currently practicing.",
L:[97]},
{t:"10/10/10",w:"Suzy Welch",
i:"Before a decision made hot, ask how you'll feel about it in ten minutes, ten months, and ten years. The three horizons pull apart what emotion fuses together: the ten-minute self wants relief from the current discomfort; the ten-month self cares about consequences and relationships; the ten-year self cares about character and pattern. Most decisions we regret were optimal for the ten-minute self alone. The tool takes thirty seconds and is most valuable exactly when you least want to use it.",
a:"Next time you're about to send the sharp email, cancel the hard conversation, or cave to pressure — write the three answers down. If the ten-minute self is the only one voting yes, wait a day.",
p:"Only using it for restraint. It cuts both ways: the ten-year view often demands the bold move the ten-minute self is avoiding.",
L:[9]},
{t:"Take the Outside View",w:"Daniel Kahneman; Bent Flyvbjerg",
i:"The inside view builds a forecast from your project's particulars — and inherits your optimism about every one of them. The outside view asks a colder question first: projects like this one — how do they usually go? Kahneman's planning-fallacy research and Flyvbjerg's megaproject data agree: reference-class forecasts beat inside estimates almost everywhere, because your project is less special than it feels. Start with the base rate for similar efforts, then adjust modestly for genuine differences — not the other way around.",
a:"Before committing to your next timeline, find five comparable past efforts (yours or others') and note their actual durations and overruns. Anchor your estimate on that distribution, then justify — in writing — any claim to beat it.",
p:"'But we're different.' Everyone in the reference class believed that too — it's why the class exists.",
L:[97]},
{t:"Red Teaming",w:"Military practice; CIA tradecraft",
i:"Assign people the job of attacking your plan — not inviting criticism (which politeness rations) but tasking it, with permission to be ruthless and a mandate to win. Red teams find what advocates cannot, because advocacy blinds: the planner who built the schedule cannot see its fragility the way someone rewarded for breaking it can. For a middle manager, a red team can be two colleagues and an hour: their only role is to make the strongest case that this will fail, while the plan's authors listen silently.",
a:"Before your next major proposal goes up, give two smart skeptics the deck a week early with one instruction: break it. Present their attack alongside your proposal — decision-makers trust plans that survived contact.",
p:"Red-teaming as ritual after the decision is made. If the attack can't change the outcome, you've built theater, not scrutiny.",
L:[103,71]},
{t:"Steelman, Don't Strawman",w:"Argumentation practice; Rapoport's rules",
i:"Before rejecting a position, state it so well that its holder says 'yes — exactly, I couldn't have put it better.' Rapoport's rules (popularized by Daniel Dennett) demand this before any criticism. The steelman does two jobs: it converts opponents into collaborators, because people can genuinely hear criticism only after being genuinely heard; and it protects you from the most embarrassing failure mode in decision-making — confidently defeating an argument nobody was actually making while the real objection stands untouched.",
a:"In your next disagreement, before stating your case, summarize theirs until they explicitly confirm it's right — then add what's genuinely strong about it. Only then differ. Watch the temperature drop.",
p:"Steelmanning as a debate tactic — setup for the takedown. If your summary is a trap, they'll feel it, and you've spent trust, not built it.",

{t:"Check the Base Rate",w:"Daniel Kahneman & Amos Tversky",
i:"A vivid story walks into the room — the charismatic candidate, the vendor's perfect demo, the turnaround plan with the inspiring narrative — and the first question should be statistical, not narrative: how often does this kind of thing work in general? Kahneman and Tversky showed we systematically ignore base rates when a specific story is available; representativeness beats frequency in the mind every time. The fix is mechanical: look up, or estimate, the boring denominator before the exciting numerator gets to vote.",
a:"For your next seductive proposal, write the base-rate question first: 'Of the last ten similar attempts (here or anywhere), how many worked?' Get an answer — even a rough one — before evaluating this attempt's particulars.",
p:"Base-rate fatalism. A 20% base rate doesn't forbid the attempt — it tells you what evidence of being in the 20% should look like.",
L:[28]},
{t:"Kill Criteria",w:"Annie Duke — Quit",
i:"Sunk cost doesn't feel like bias from inside — it feels like commitment. Duke's countermeasure: decide the exit conditions before you enter. Kill criteria are pre-committed signals, set while you're still objective, that trigger stopping or escalating a rethink: 'if adoption is under X by March', 'if the key sponsor leaves', 'if costs exceed Y'. The person you are at the start — undefended, clear-eyed — writes instructions for the person you'll become: invested, rationalizing, and unable to see the sunk-cost fallacy operating in their own reasoning.",
a:"For every initiative you launch this quarter, write two kill criteria into the kickoff document, with a named review date. When a criterion trips, hold the review — the decision was already made by a smarter you.",
p:"Renegotiating criteria at the moment they trip. Moving the tripwire when it fires defeats the entire mechanism — treat changes as their own formal decision.",
L:[96,89]},
{t:"Regret Minimization",w:"Jeff Bezos",
i:"For life-scale decisions, Bezos's framework replaces spreadsheets with a projection: imagine yourself at eighty, looking back — which choice minimizes regret? He used it to leave a comfortable job for an unproven internet bookstore: at eighty, he reasoned, he wouldn't regret trying and failing, but would never forgive not trying. The frame works because distance neutralizes the short-term costs (awkwardness, risk, others' opinions) that dominate close-up, and elevates the values that actually endure. For managers: use it on career moves, and offer it to people you mentor at their crossroads.",
a:"For the big choice you're circling — role change, hard conversation, bold proposal — write two paragraphs from your eighty-year-old self: one having done it, one having not. Notice which one is harder to read.",
p:"Applying it to everyday calls. Regret minimization is for the handful of authentically life-shaping doors, not for choosing this quarter's KPI.",
L:[0,8]},
{t:"Decision Hygiene",w:"Daniel Kahneman — Noise; HALT practice",
i:"The same manager, same facts, different day — different decision. Kahneman's work on noise shows judgment varies with mood, fatigue, hunger, sequence, even weather, and the variation is invisible from inside. Decision hygiene is the unglamorous countermeasure: never make consequential calls Hungry, Angry, Lonely or Tired (HALT); separate judgments from each other (score candidates dimension by dimension, not gestalt by gestalt); decide important things at your best hour; and when possible, have judgments made independently before they're discussed.",
a:"Audit when your last five significant decisions were made: time of day, your state, straight after what. Institute one rule — e.g., no consequential calls after 5pm, or every hiring score written before discussion.",
p:"Believing your judgment is the exception. Noise research's most robust finding is that everyone believes that, and no one is.",

{t:"The Risk Matrix",w:"Risk management practice",
i:"The workhorse grid: likelihood on one axis, impact on the other, each risk plotted into green, amber, red. Its value is comparative conversation — getting a team to argue about whether a risk is 'likely-moderate' or 'unlikely-severe' surfaces different information each person holds. Its dangers are known: verbal scales hide disagreement ('likely' spans 30–80% across people), and the tidy colors can imply precision that doesn't exist. Used as a structured conversation rather than an answer, it's still the fastest way to make a team's risk picture shared.",
a:"Workshop your project's top ten risks onto the grid — but define the scales numerically first (likely = over 50%; severe = threatens the objective). Assign every red and amber cell an owner and a mitigation.",
p:"The matrix as filing cabinet: risks plotted, colored, and never revisited. An unowned red risk is a decorated surprise.",
L:[96]},
{t:"The Risk Register",w:"Project management practice",
i:"A living table with teeth: each risk described precisely (cause → event → consequence, not 'timeline risk'), scored, and — the part that separates registers that work from registers that decorate — given exactly one owner, a specific mitigation with a date, and a review cadence. The register's real function is anti-diffusion: risk that belongs to everyone belongs to no one. Ten minutes of standing agenda in the team meeting ('what moved on the register?') keeps it alive; anything less lets it fossilize into audit-season paperwork.",
a:"Build a one-page register for your main initiative: max ten risks, each with cause-event-consequence wording, one named owner, one dated action. Review it for ten minutes in every second team meeting.",
p:"Fifty-row registers nobody reads. Cap it at ten; if a new risk enters, an old one must be retired or accepted explicitly.",
L:[94]},
{t:"The Sensitivity Check",w:"Financial modeling practice — tornado analysis",
i:"Every plan rests on assumptions, but not equally: sensitivity analysis asks which assumption, if wrong by a plausible amount, changes the answer most. Vary each key input across its realistic range and watch the outcome swing — the 'tornado' chart ranks the swings. The result is almost always clarifying: two or three assumptions dominate everything, and they deserve the verification budget; the rest can be rough. Managers who skip this defend every number equally — exhausting — or none — dangerous.",
a:"List the five assumptions under your current business case. For each, ask: if this is 30% off, does the conclusion survive? Route your diligence to the one or two where the answer is no.",
p:"Testing assumptions one at a time only. Check the plausible combination — two mildly wrong assumptions together sink more plans than one badly wrong one.",
L:[91]},
{t:"The 40–70 Rule",w:"General Colin Powell",
i:"Powell's formula for timing decisions under uncertainty: act when you have between 40 and 70 percent of the information you wish you had. Below 40, you're gambling — more diligence has high value. Above 70, you've waited too long — the opportunity moved, competitors acted, the team read your delay as indecision. The deeper point: information has a rising cost curve and a falling value curve, and waiting for certainty is itself a decision — usually the worst one, made by default.",
a:"For the decision you've been sitting on, honestly estimate your information percentage. Past 70? Decide today. Below 40? Name precisely which missing fact justifies the delay and set a date to have it.",
p:"Using 'I'm at 40%' as permanent cover. The percentages are a spur to act, not a new way to procrastinate with numbers.",

{t:"Safe-to-Fail Probes",w:"Dave Snowden — complexity practice",
i:"In complex situations — where cause and effect only reveal themselves afterward — analysis cannot substitute for contact with reality. Snowden's prescription: run several small, cheap, parallel experiments, each safe to fail (bounded downside, designed so failure teaches rather than damages), then amplify what shows promise and dampen what doesn't. The parallelism matters: single pilots become political flagships that must succeed; a portfolio of probes keeps everyone honest because some are expected to die.",
a:"For your next complex challenge, replace the master plan with three probes: each under four weeks, each cheap enough to abandon without drama, each with a defined signal to watch. Review all three together, then double down on one.",
p:"Pilots disguised as probes — too big to kill, staffed by advocates, guaranteed to 'succeed'. If no probe can fail, nothing can be learned.",
L:[79,2]},
{t:"If-Then Triggers",w:"Contingency planning; Peter Gollwitzer's implementation intentions",
i:"Plans fail at the moment of surprise, when thinking is worst. The countermeasure is pre-deciding: 'If churn exceeds X, then we activate the retention play. If the vendor slips a second milestone, then we invoke the exit clause. If two team members flag overload, then we cut scope — this scope.' Gollwitzer's research on implementation intentions shows if-then framing dramatically increases follow-through, because the response is retrieved, not invented, under stress. A contingency without a trigger is a hope; a trigger without a pre-agreed response is an alarm nobody answers.",
a:"For your current plan's three biggest risks, write explicit if-then lines — measurable trigger, named response, named owner — and put them in the plan document where everyone sees them.",
p:"Vague triggers ('if things get bad'). If two people could disagree about whether the trigger fired, it isn't a trigger.",

{t:"The 70-20-10 Portfolio",w:"Popularized by Google (Eric Schmidt)",
i:"Google's famous allocation — 70% of effort on the core business, 20% on adjacent opportunities, 10% on transformational bets — is really a discipline for surviving your own success. The core funds everything and deserves most effort; but a team 100% on core has scheduled its own obsolescence, while a team overweight on bets starves the engine that pays for them. The percentages are indicative, not sacred; the practice is auditing the actual split — most teams discover they're at 95-5-0 while believing they innovate.",
a:"Classify last month's team effort into core / adjacent / new. If new is zero — it usually is — carve out one protected half-day per week and give it a name, or the core will silently reclaim it.",
p:"Letting the 10% be whatever's fun. Transformational still means aimed at the mission — bets need a thesis, a signal to watch, and a sunset date.",

{t:"Estimate in Ranges",w:"Three-point estimation — PERT tradition",
i:"A point estimate ('it will take six weeks') smuggles false certainty into every plan built on it. Three-point estimation asks instead for best case, most likely, and worst case — and the conversation about the spread is where the truth lives: a 5–6–8 week answer and a 3–6–16 week answer both 'average' near six, but they are entirely different risks. Wide ranges aren't imprecision; they're honesty about variance, and they tell you exactly where buffers, checkpoints and de-risking effort belong.",
a:"Ban naked point estimates on your team for a month: every estimate arrives as three numbers. When a range comes back wide, don't demand it narrow — ask what makes the worst case possible, and attack that.",
p:"Pressuring ranges into optimism. If people learn wide ranges get negotiated down, they'll give you narrow lies instead.",

{t:"Buy Information First",w:"Real options thinking",
i:"Between deciding now with what you know and deciding blind later, there is almost always a third move: pay a little to know more, then decide. A two-week prototype before the year-long build; a paid pilot before the enterprise contract; one hard reference call before the key hire. Real-options logic prices this formally, but the managerial version is a habit of asking: what is the cheapest fastest test that would meaningfully change this decision — and is the decision's last responsible moment far enough away to run it?",
a:"For your biggest pending decision, name the single assumption you're least sure of, then design the cheapest possible probe of it — a call, a mockup, a one-week trial. Run it before deciding, not after.",
p:"Buying information you won't use — tests run while the decision quietly gets made on politics. If no result would change the call, skip the theater and decide.",

{t:"The Rumsfeld Matrix",w:"Donald Rumsfeld; intelligence analysis tradition",
i:"Mocked at the time, analytically sound: known knowns (facts — verify them anyway), known unknowns (identified gaps — plan to close or hedge them), unknown knowns (what your organization knows but you haven't asked — the cheapest intelligence there is, sitting in your frontline staff, your data, your veterans), and unknown unknowns (the true surprises — addressed not by prediction but by resilience: buffers, reversibility, early-warning tripwires). Each quadrant has a different strategy; most planning treats only the first two.",
a:"For your current initiative, spend fifteen minutes per quadrant. In 'unknown knowns', ask literally: who in this organization has done something like this — and have we talked to them? That quadrant usually pays the whole exercise.",

{t:"The Delphi Method",w:"RAND Corporation — Dalkey & Helmer",
i:"When you need a group's genuine judgment rather than its politics, Delphi structures it: experts answer independently and anonymously, a facilitator summarizes the range and reasoning, everyone revises in a second round after seeing the anonymous distribution, and the process repeats until views stabilize. Anonymity kills the HiPPO effect (highest-paid person's opinion), independence kills anchoring, and iteration lets good arguments — not loud ones — move the group. A lightweight two-round version fits inside a normal week.",
a:"For your next contested estimate or forecast, collect answers by form before any meeting, share the anonymized spread with reasons, then collect round two. Discuss only where views still diverge.",
p:"Skipping the reasons. The distribution alone just breeds convergence to the middle; the anonymous reasoning is what actually improves the answer.",

{t:"Brainwrite Before You Brainstorm",w:"Research consensus — Paulus, Diehl & Stroebe",
i:"Decades of research agree: traditional open brainstorming underperforms — production blocking (one person talks, others wait and forget), evaluation anxiety, and anchoring on early loud ideas all suppress the group's real capacity. Brainwriting fixes it with silence: everyone generates ideas independently in writing first, then ideas are shared, clustered and built on. Same people, same time, reliably more and more-diverse ideas — and the introverts and juniors, whose ideas open brainstorming systematically loses, finally get counted.",
a:"Next ideation session: five minutes of silent individual writing before anyone speaks. Post everything, cluster together, then discuss. Compare the yield with your usual sessions once and you'll never go back.",
p:"The leader writing on the board while others watch. Whoever holds the pen edits the group's thinking — post ideas verbatim.",
L:[24,38]},
{t:"Dot Voting",w:"Facilitation practice",
i:"After diverging comes the converging problem: twenty options, one meeting. Dot voting is the fastest honest filter — everyone gets three to five dots to place on the posted options, all at once, and the cluster pattern speaks. It is deliberately crude: a heat map of group energy, not a decision. Its craft points are real though — vote simultaneously to avoid cascading, give fewer dots than feels comfortable (scarcity forces choice), and let the leader vote last or not at all.",
a:"Next time a list needs shortlisting, post the options, hand out three dots each, vote simultaneously, and discuss only the top three clusters. Total elapsed time: ten minutes.",
p:"Treating the dots as the decision. Popularity filters the list; the decision still needs its owner, its criteria, and its reasoning.",

{t:"Fist to Five",w:"Consensus facilitation practice",
i:"A proposal is on the table; instead of 'any objections?' (silence, ambiguity, resentment), ask for a simultaneous hand signal: fist (I block), one or two fingers (major reservations, need to talk), three (I can live with it), four (I like it), five (I'll champion it). Thirty seconds gives you a temperature map that yes/no hides: a room of threes passes a vote and then under-delivers, because 'can live with it' is not commitment. The twos and ones get heard before the group proceeds — which is where the proposal usually improves.",
a:"Close your next proposal discussion with a fist-to-five. Talk to every one and two before moving on. If the room averages three, ask what would make it a four — then actually amend.",
p:"Punishing low fingers with visible frustration. The first time a two gets steamrolled, your team learns to hold up polite fours forever.",

{t:"The Gradient of Agreement",w:"Sam Kaner — Facilitator's Guide to Participatory Decision-Making",
i:"Kaner's scale replaces binary agree/disagree with eight honest positions, from enthusiastic endorsement through 'agreement with reservations', 'abstain', 'stand aside — I disagree but won't block', up to formal veto. The language matters: 'stand aside' lets a dissenter be honest without forcing a confrontation, and distinguishing 'lukewarm support' from 'endorsement' tells the leader exactly how much implementation energy actually exists. Groups using the gradient stop mistaking the absence of objection for the presence of commitment.",
a:"Introduce the scale before your next significant team decision and have everyone place themselves aloud. Record the distribution in the decision note — it's the most honest forecast of execution you'll get.",
p:"Rushing past the stand-asides. Their dissent, recorded and respected, is your early-warning system; ignored, it's your future 'I told you so'.",
