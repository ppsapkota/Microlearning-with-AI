{t:"Consent, Not Consensus",w:"Sociocracy — Gerard Endenburg",
i:"Consensus asks 'does everyone agree this is best?' — and hands each person a veto, which is why consensus cultures are slow and exhausted. Consent asks a different question: 'does anyone have a paramount objection — a reason this is unsafe to even try?' No objection means proceed, explicitly as an experiment with a review date. The bar drops from 'perfect for all' to 'safe to try', which is where reversible decisions belong. Objections aren't defeats; they're design input that must name the harm, not the preference.",
a:"For your next reversible team decision, ask the consent question verbatim: 'Is this safe to try until our review in six weeks?' Log objections only if they name a concrete harm. Set the review date before closing.",
p:"Using consent for irreversible calls. 'Safe to try' presumes you can course-correct — one-way doors still deserve the slower machinery.",
L:[72,96]},
{t:"1-2-4-All",w:"Liberating Structures — Lipmanowicz & McCandless",
i:"Twelve minutes to hear every voice in any size of group: one minute of silent individual reflection on the question, two minutes comparing in pairs, four minutes converging in foursomes, then each foursome shares one best idea with the whole room. The escalating structure launders out status — by the time an idea reaches the room it belongs to a table, not a title — and nobody can dominate or hide. It works identically for surfacing risks, generating options, or unpacking a failure, and it needs zero preparation.",
a:"Replace one open-discussion agenda item this week with a 1-2-4-All on a single crisp question. Time the segments strictly. Notice who you heard from that you normally don't.",
p:"A mushy prompt. The structure amplifies whatever question you ask — invest the preparation minute in making it specific and honest.",
L:[38,74]},
{t:"Leader Speaks Last",w:"Charlan Nemeth's research; popularized by Simon Sinek",
i:"The moment the boss states a view, the room's information starts dying: subsequent speakers anchor, dissenters recalculate, and the discussion becomes an audition. Nemeth's research on conformity and dissent shows even mild authority signals suppress minority views — the ones that improve decisions. The discipline is mechanical: frame the question, then facilitate — juniors first, your view last, and sometimes never. You already know what you think; the meeting's entire value is finding out what they think before you contaminate it.",
a:"In your next decision meeting, announce the rule: 'I'll share my view at the end.' Call on the most junior or most affected first. Write your own position down beforehand and check how often the room changes it — that delta is the meeting's value.",
p:"Speaking last but telegraphing first — the raised eyebrow, the 'interesting…', the leading question. Your face goes first in every meeting; discipline it too.",
L:[51,103]},
{t:"Keep a Decision Journal",w:"Daniel Kahneman's advice; Michael Mauboussin",
i:"Kahneman, asked what single practice would most improve decisions, answered: a decision journal. At the moment of each significant call, record the situation, the options, what you expect to happen and with what probability, and how you feel. The entry does nothing today — its value matures: reviewed a year later, it defeats hindsight bias (you cannot rewrite what you actually predicted), separates decision quality from outcome luck, and reveals your personal patterns — the over-optimism, the pet weightings, the moods — that no amount of in-the-moment vigilance can see.",
a:"Start today with a simple template: date, decision, options considered, expected outcome with rough probability, feelings. Two minutes per significant decision. Calendar a six-month review of the entries.",
p:"Judging past decisions by outcomes alone. A good decision can lose and a reckless one can win — the journal exists precisely to keep those separate.",

function initGraph(){
  const cv=document.getElementById("gc"), tip=document.getElementById("gtip"), wrap=cv.parentElement;

    const ang=ci/CONCEPTS.length*6.2832;
    nodes.push({t:"c",id:ci,label:c.n,x:W/2+Math.cos(ang)*H*0.3,y:H/2+Math.sin(ang)*H*0.3,vx:0,vy:0,r:9});
  });
  const used=new Set(); CONCEPTS.forEach(c=>c.l.forEach(i=>used.add(i)));
  [...used].sort((a,b)=>a-b).forEach(i=>{
    lmap[i]=nodes.length;
    nodes.push({t:"l",id:i,label:(i+1)+". "+D[i].t,x:W/2+(Math.random()-0.5)*W*0.85,y:H/2+(Math.random()-0.5)*H*0.85,vx:0,vy:0,r:5.5,c:MCOLORS[moduleOf(i)]});
  });

    for(let a=0;a<nodes.length;a++){
      const na=nodes[a];
      na.vx+=(W/2-na.x)*0.0005; na.vy+=(H/2-na.y)*0.0005;
      for(let b=a+1;b<nodes.length;b++){
        const nb=nodes[b];
        let dx=na.x-nb.x,dy=na.y-nb.y,d2=dx*dx+dy*dy;
        if(d2<1)d2=1;
        if(d2<36000){
          const f=((na.t==="c"||nb.t==="c")?850:380)/d2, dd=Math.sqrt(d2);

          na.vx+=dx*f;na.vy+=dy*f;nb.vx-=dx*f;nb.vy-=dy*f;
        }
      }
    }
    edges.forEach(e=>{
      const a=nodes[e[0]],b=nodes[e[1]];
      let dx=b.x-a.x,dy=b.y-a.y;
      const d=Math.sqrt(dx*dx+dy*dy)||1, f=(d-68)*0.012;
      dx/=d;dy/=d;
      a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f;
    });
    nodes.forEach(n=>{
      if(n===dragN)return;
      n.x+=n.vx*alpha;n.y+=n.vy*alpha;n.vx*=0.85;n.vy*=0.85;
    });
  }
  function draw(){
    const ink=getComputedStyle(document.body).color;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    ctx.translate(tx,ty);ctx.scale(scale,scale);
    const dim=selC>=0;
    const selSet=dim?new Set(CONCEPTS[selC].l):null;
    edges.forEach(e=>{
      const a=nodes[e[0]],b=nodes[e[1]];
      const on=!dim||e[0]===selC;
      ctx.strokeStyle="rgba(128,128,128,"+(on?0.35:0.06)+")";
      ctx.lineWidth=(on?1:0.5)/scale;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    });
    ctx.font="600 11px Segoe UI, sans-serif";
    ctx.textAlign="center";
    nodes.forEach(n=>{
      const on=!dim||(n.t==="c"?n.id===selC:selSet.has(n.id));

  function world(ev){const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left-tx)/scale,y:(ev.clientY-r.top-ty)/scale};}
  function pick(p){

  }
  cv.addEventListener("mousedown",ev=>{
    const p=world(ev); dragN=pick(p); panning=!dragN;
    lx=ev.clientX; ly=ev.clientY; moved=0;
  });
  cv.addEventListener("mousemove",ev=>{
    const dx=ev.clientX-lx, dy=ev.clientY-ly;
    if(dragN){const p=world(ev);dragN.x=p.x;dragN.y=p.y;dragN.vx=0;dragN.vy=0;alpha=Math.max(alpha,0.4);moved+=Math.abs(dx)+Math.abs(dy);}
    else if(panning){tx+=dx;ty+=dy;moved+=Math.abs(dx)+Math.abs(dy);}
    else{
      const n=pick(world(ev));
      hoverN=n;
      if(n){
        const wr=wrap.getBoundingClientRect();
        tip.style.display="block";
        tip.textContent=n.t==="c"?(n.label+" — "+CONCEPTS[n.id].l.length+" tools"):(n.label+" · "+MODULES[moduleOf(n.id)].t);
        tip.style.left=Math.min(ev.clientX-wr.left+14,wrap.clientWidth-220)+"px";
        tip.style.top=(ev.clientY-wr.top+14)+"px";
        cv.style.cursor="pointer";
      }else{tip.style.display="none";cv.style.cursor="grab";}
    }
    lx=ev.clientX; ly=ev.clientY;
  });
  window.addEventListener("mouseup",()=>{
    if(current!==-2)return;
    if(moved<5){
      if(dragN&&dragN.t==="l"){show(dragN.id);return;}
      if(dragN&&dragN.t==="c"){selC=(selC===dragN.id?-1:dragN.id);}
    }
    dragN=null;panning=false;
  },{passive:true});
  cv.addEventListener("mouseleave",()=>{tip.style.display="none";hoverN=null;});
  cv.addEventListener("wheel",ev=>{
    ev.preventDefault();
    const r=cv.getBoundingClientRect(), mx=ev.clientX-r.left, my=ev.clientY-r.top;
    const f=ev.deltaY<0?1.12:1/1.12, ns=Math.min(4,Math.max(0.35,scale*f));
    tx=mx-(mx-tx)*(ns/scale); ty=my-(my-ty)*(ns/scale); scale=ns;
  },{passive:false});
  requestAnimationFrame(frame);
}

/* ===== Keyboard ===== */
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(e.key==="ArrowRight"&&current<D.length-1)show(current<0?0:current+1);
  if(e.key==="ArrowLeft"&&current>0)show(current-1);
});

/* ===== Init ===== */
buildNav();
goHome();
const hm=location.hash.match(/^#t(\d+)$/);
if(hm){const n=parseInt(hm[1],10)-1; if(n>=0&&n<D.length)show(n);}
</script>
