  /* ===== Search results ===== */

<script>
"use strict";
const MODULES=[
 {t:"Lead Yourself First",d:"Self-awareness, mindset and habits — the inner work that makes everything else possible."},
 {t:"Trust & Psychological Safety",d:"Build the climate where people speak up, admit mistakes and take smart risks."},
 {t:"Communication That Lands",d:"Listen deeply, speak clearly, and make every conversation count."},
 {t:"Coach Your People",d:"Ask more, tell less — grow capability instead of dependence."},
 {t:"Feedback & Hard Conversations",d:"Say the difficult thing with care, and receive it without armor."},
 {t:"Delegation & Empowerment",d:"Multiply your team's intelligence by giving away real ownership."},
 {t:"Motivation & Engagement",d:"What actually drives people — and what quietly drains them."},
 {t:"Teams That Perform",d:"Conflict, commitment, meetings and norms that turn a group into a team."},
 {t:"Managing Up, Across & Change",d:"Influence without authority and lead people through transitions."},
 {t:"Driving Outcomes",d:"Goals, execution rhythm and accountability that deliver results — and leaders."},
 {t:"Bonus — The McKinsey Lens",d:"Problem-solving and communication disciplines from the firm's playbook."}
];
const D=[
/* Module 1 — Lead Yourself First */
{t:"Start With Why",w:"Simon Sinek — Start With Why",
i:"People don't commit to tasks; they commit to purpose. Sinek's core insight is that inspiring leaders communicate from the inside out: why before how before what. As a middle manager you are the translator — strategy arrives from above as targets, and your job is to hand it to your team as meaning. A team that knows why this week's work matters will out-think and outlast a team that only knows the deadline.",
a:"Open your next team meeting with two minutes on why the current priority matters — to the customer, the mission, or the team — before touching any status item.",
r:"Could every person on your team explain why their current task matters to someone outside the team?"},
{t:"What Got You Here Won't Get You There",w:"Marshall Goldsmith",
i:"The habits that made you a great individual contributor — having the answer, winning the argument, adding your improvement to every idea — quietly become liabilities when you lead. Goldsmith found that successful people cling hardest to the behaviors they should drop, precisely because those behaviors were once rewarded. Leadership is a different game: your output is now what your team produces without you in the room.",
a:"In your next discussion, when you feel the urge to improve someone's idea, hold back. Goldsmith estimates your suggestion adds 5% quality but cuts their ownership by 50%.",
r:"Which habit that earned your promotion is now getting in your team's way?"},
{t:"Lead With a Growth Mindset",w:"Carol Dweck — Mindset",
i:"Dweck's research distinguishes a fixed mindset (talent is static, mistakes prove inadequacy) from a growth mindset (ability grows through effort and feedback). Managers broadcast their mindset constantly: praise talent and people hide mistakes; praise process and people take on harder problems. The most powerful managerial word in her work is 'yet' — reframing 'they can't do this' as 'they can't do this yet' turns a verdict into a development plan.",
a:"Catch yourself labeling a team member today ('she's not strategic'). Rewrite it as a 'yet' statement and identify one experience that would build that muscle.",
r:"Do your people believe you see their ability as fixed — or growable?"},
{t:"Self-Awareness Comes First",w:"Daniel Goleman — Emotional Intelligence",
i:"Goleman's four domains of emotional intelligence — self-awareness, self-management, social awareness, relationship management — build in that order. You cannot manage what you don't notice. Research he cites shows most people overestimate their self-awareness; the gap between how you think you land and how you actually land is where trust quietly erodes. Naming an emotion precisely ('I'm anxious about the deadline') reduces its grip and buys you a choice about what to do next.",
a:"Three times today, pause and name what you're feeling in one specific word before you respond to anything. Notice how naming changes your reaction.",
r:"What emotional state do you most often bring into the room — and would your team agree?"},
{t:"Manage Energy, Not Just Time",w:"Jim Loehr & Tony Schwartz — The Power of Full Engagement",
i:"Loehr and Schwartz argue that energy, not time, is the fundamental currency of high performance. Time is fixed; energy is renewable — but only if you oscillate between spending and recovery, like an athlete. Managers who run flat-out model depletion for their whole team. Full engagement requires tending four energy sources: physical (sleep, movement), emotional (positive relationships), mental (focus), and spiritual (purpose).",
a:"Build one deliberate recovery ritual into today: a real lunch away from the screen, a ten-minute walk between hard meetings, or a hard stop time — and keep it visibly.",
r:"What does your team learn about sustainable performance by watching how you work?"},
{t:"Ask Yourself Daily Active Questions",w:"Marshall Goldsmith — Triggers",
i:"Goldsmith ends every day scoring himself on 'active questions' — not 'Did I have clear goals?' but 'Did I do my best to set clear goals?' The phrasing matters: it shifts accountability from circumstances to effort. He pays someone to call him nightly and take his scores, because even the world's top executive coach knows self-discipline needs structure. For a manager, six daily questions about listening, engaging, and building relationships compound into transformed behavior.",
a:"Write three 'Did I do my best to…' questions that matter for your leadership (e.g., '…to find something to appreciate in each person?'). Score yourself 1–10 tonight.",
r:"Where do you blame circumstances for behavior that is actually a choice?"},
{t:"Your Mood Is Contagious",w:"Daniel Goleman — Primal Leadership",
i:"Goleman's research on 'resonant leadership' shows emotions flow downhill through open loops: the leader's mood is caught by the team within minutes and measurably shifts performance. A tense, irritable manager creates a team that plays defense; a grounded, optimistic one creates a team that explores. This isn't about faking cheerfulness — it's about recognizing that before you say a word in a meeting, your face and posture have already spoken.",
a:"Before entering each meeting today, take three breaths at the door and deliberately choose the emotional tone you want the room to catch.",
r:"If your team's current mood is a mirror, what is it reflecting?"},
{t:"Put First Things First",w:"Stephen Covey — The 7 Habits",
i:"Covey's time matrix separates the urgent from the important. Most managers drown in Quadrant 1 (urgent and important — crises) and Quadrant 3 (urgent, not important — other people's noise), while Quadrant 2 — coaching, planning, relationship-building, prevention — starves. Yet Quadrant 2 is where leadership actually happens, and it's the only quadrant that shrinks the others over time. Nobody will schedule it for you; it must be defended weekly.",
a:"Block ninety minutes this week for one Quadrant 2 activity — a career conversation, process fix, or planning session — and treat it as unmovable.",
r:"What important-but-not-urgent work have you postponed for a month or more?"},
{t:"Act Like a Leader, Then Think Like One",w:"Herminia Ibarra — Act Like a Leader, Think Like a Leader",
i:"Ibarra flips conventional wisdom: insight doesn't precede change — action does. You don't think your way into being a leader; you act your way into a new way of thinking. She calls this 'outsight': stepping into new behaviors, networks, and projects before you feel ready, and letting the experience reshape your identity. Middle managers waiting to feel like leaders before behaving like one are waiting in the wrong order.",
a:"Do one thing today that belongs to the leader you're becoming, not the expert you were — speak first on strategy, host a cross-team conversation, or represent your team upward.",
r:"What leadership behavior are you postponing until you 'feel ready'?"},
{t:"Own the Space Between Stimulus and Response",w:"Viktor Frankl, via Stephen Covey",
i:"Covey built his first habit — proactivity — on Frankl's observation that between stimulus and response there is a space, and in that space lies our freedom to choose. Goldsmith's work on triggers makes it practical: identify the situations that reliably hijack you (being interrupted, being challenged in public, a certain colleague's tone) and pre-decide your response. A manager who reacts is at the mercy of the environment; a manager who chooses shapes it.",
a:"Identify your most reliable trigger at work. Script a two-sentence response for the next time it fires — and rehearse it once out loud.",
r:"When you lost your composure last, what happened in the space — and who was watching?"},
/* Module 2 — Trust & Psychological Safety */
{t:"Make It Safe to Speak Up",w:"Amy Edmondson — The Fearless Organization",
i:"Edmondson defines psychological safety as the belief that you won't be punished or humiliated for speaking up with ideas, questions, concerns, or mistakes. It is not comfort, niceness, or lowered standards — her research shows the best teams pair high safety with high standards. Without safety, you don't hear about problems until they're expensive; your team's silence isn't agreement, it's self-protection. The manager sets this climate more than anyone else.",
a:"In your next meeting, ask 'What are we missing?' — then count silently to ten before speaking. Thank the first person who offers a concern, regardless of its quality.",
r:"When did someone on your team last tell you something you didn't want to hear?"},
{t:"The Trust Equation",w:"David Maister, Charles Green & Robert Galford — The Trusted Advisor",
i:"Trust = (Credibility + Reliability + Intimacy) ÷ Self-orientation. You build the numerator by knowing your stuff, doing what you say, and being safe to confide in. But the denominator is the killer: self-orientation. If people sense your advice serves your agenda — your metrics, your image, your promotion — everything above the line is discounted. The fastest trust-builder is often not competence but visibly putting the other person's interests first.",
a:"In one conversation today, advocate for what's genuinely best for the other person, even if it costs your team something small. Say why.",
r:"Which element — credibility, reliability, intimacy, or low self-orientation — is your weakest?"},
{t:"The Trust Triangle",w:"Frances Frei & Anne Morriss — Unleashed",
i:"Frei's research at Harvard identifies three drivers of trust: authenticity (I experience the real you), logic (I believe your judgment and rigor), and empathy (I believe you care about me). When trust wobbles, it's usually one specific driver — and each has a distinct fix. Empathy wobblers are distracted (put the phone away); logic wobblers bury the lead (start with the point); authenticity wobblers perform a persona (say what you actually think).",
a:"Diagnose your wobble: ask a trusted colleague which of the three drivers you most often shake. Apply that driver's fix in every interaction this week.",
r:"With which team member is your trust weakest — and which side of the triangle is wobbling?"},
{t:"Courage Over Comfort",w:"Brené Brown — Dare to Lead",
i:"Brown's decades of research on vulnerability land on a leadership paradox: the armor we wear to look strong — knowing it all, never admitting doubt, perfectionism — is exactly what blocks trust and innovation. Vulnerability is not oversharing; it's uncertainty, risk, and emotional exposure in service of the work. Saying 'I don't know,' 'I need help,' or 'I got that wrong' doesn't diminish your authority — it gives your team permission to be honest too.",
a:"Say one armored-off truth today: admit a mistake, name an uncertainty, or ask for help with something you'd normally hide.",
r:"What armor do you put on before walking into work — and what does it cost your team?"},
{t:"BRAVING: The Anatomy of Trust",w:"Brené Brown — Dare to Lead",
i:"Brown breaks trust into seven observable behaviors — BRAVING: Boundaries (you respect mine and hold yours), Reliability (you do what you say, repeatedly), Accountability (you own mistakes and amend), Vault (you hold confidences), Integrity (you choose courage over comfort), Non-judgment (we can ask for help without shame), Generosity (you assume the most generous interpretation of my actions). The checklist turns 'I don't trust him' from an accusation into a diagnosable, fixable gap.",
a:"When you feel distrust toward someone this week, run the BRAVING checklist to name the specific breach — then address that behavior, not the person's character.",
r:"Which BRAVING element do you most often break — and which do others break with you?"},
{t:"Trust Is the Foundation of the Pyramid",w:"Patrick Lencioni — The Five Dysfunctions of a Team",
i:"Lencioni's model stacks five layers: trust enables conflict, conflict enables commitment, commitment enables accountability, accountability enables results. The base — vulnerability-based trust — means teammates can admit weakness, ask for help, and own errors without political calculation. Teams without it waste enormous energy on impression management. And it starts with the leader: Lencioni is blunt that the leader must be the first to be vulnerable, because nobody risks more candor than the boss models.",
a:"At your next team meeting, share a genuine recent mistake and what you learned — before asking anyone else to reflect on theirs.",
r:"Does your team debate ideas openly, or do the real conversations happen after the meeting?"},
{t:"Model Fallibility",w:"Amy Edmondson — leader behaviors",
i:"Edmondson prescribes three leader behaviors that create safety: frame work as learning ('we've never done this before; we'll iterate'), acknowledge your own fallibility ('I may miss things — I need to hear from you'), and model curiosity by asking genuine questions. The phrase 'I need your input because I will miss things' is disarming precisely because it's true. When the boss demonstrates imperfection, the team stops spending energy concealing theirs.",
a:"Start one discussion today with: 'Here's my current thinking — and I know there are holes in it. What am I missing?' Mean it.",
r:"Do you present your plans as finished products or as drafts that need your team's eyes?"},
{t:"Ask Humble Questions",w:"Edgar Schein — Humble Inquiry",
i:"Schein argues our culture overvalues telling and undervalues asking. Humble inquiry is asking questions to which you do not already know the answer, from genuine curiosity — not leading questions, rhetorical traps, or interrogation. For managers this is 'here-and-now humility': recognizing that in this moment, the other person knows something you need. Telling subtly puts people down; asking lifts them up and surfaces the truth you'd otherwise never hear.",
a:"In your next one-on-one, ask three questions you genuinely don't know the answer to before offering a single opinion.",
r:"What's your telling-to-asking ratio in a typical day?"},
{t:"Reward the Messenger",w:"Amy Edmondson — The Fearless Organization",
i:"Every organization says it wants bad news early; most punish it subtly — a sigh, a sharper tone, a 'why didn't you catch this sooner?' Edmondson's studies of hospitals and factories show that teams reporting more errors aren't worse — they're safer, because problems surface while they're cheap. Your reaction in the first ten seconds after hearing bad news teaches your team whether to bring you the next problem or bury it.",
a:"Next time someone brings you a problem, make your first sentence gratitude: 'Thank you for flagging this early.' Diagnose later.",
r:"Think of the last bad news you received. What did your face, tone and first words teach the messenger?"},
{t:"Trust Moves at the Speed of Small Promises",w:"Stephen M. R. Covey — The Speed of Trust",
i:"Covey frames trust economically: low trust is a tax on everything (slower decisions, more checking, hidden agendas); high trust is a dividend (speed, energy, candor). The fastest way to build it isn't grand gestures but a relentless pattern of small commitments made and kept — 'I'll get back to you by Thursday' actually happening on Thursday. Each kept promise is a deposit; each slipped one, however tiny, is a withdrawal your team silently records.",
a:"Track every commitment you make today, however small, in one list. Close every loop — or renegotiate explicitly before the deadline, never after.",
r:"What small promises have you let quietly slide — and with whom?"},
/* Module 3 — Communication That Lands */
{t:"Seek First to Understand",w:"Stephen Covey — The 7 Habits",
i:"Covey called it the single most important principle of interpersonal relations: seek first to understand, then to be understood. Most of us listen autobiographically — evaluating, probing, advising, interpreting through our own story — while mentally drafting our reply. Empathic listening means reflecting back both content and feeling until the other person says 'yes, exactly.' Only then have you earned the right to be heard yourself. Diagnosis before prescription; anything else is malpractice.",
a:"In one conversation today, don't state your view until you've summarized the other person's position well enough that they say you've got it right.",
r:"When people talk to you, are they experiencing being heard — or waiting for their turn to lose?"},
{t:"Listen at Level Two",w:"Co-Active Coaching — Kimsey-House, Whitworth et al.",
i:"The Co-Active model names three listening levels. Level 1: internal — you hear the words but relate them to yourself ('that reminds me of when I…'). Level 2: focused — your attention is entirely on the speaker, their words, tone, and what they're not saying. Level 3: global — you also read the room, the energy, the context. Most workplace listening never leaves Level 1. Simply noticing where your attention sits is the beginning of real listening.",
a:"Pick one conversation today to hold Level 2 the whole way: no phone, no rehearsing replies, attention fully out. Notice what you hear that you'd normally miss.",
r:"During today's conversations, where did your attention actually live?"},
{t:"The Conversation Is the Relationship",w:"Susan Scott — Fierce Conversations",
i:"Scott's central claim: our work and our relationships succeed or fail one conversation at a time — gradually, then suddenly. The conversation is not about the relationship; the conversation is the relationship. Every avoided conversation ('I'll mention it when the time is right') is a slow withdrawal from an account you'll one day find empty. Her charge to leaders: come out from behind yourself into the conversation and make it real, because unreal conversations are expensive.",
a:"Name the one conversation you've been avoiding. Schedule it within 48 hours. Open by naming the issue honestly in one sentence.",
r:"What conversation, if you had it well, would most change your team's trajectory?"},
{t:"Clear Is Kind",w:"Brené Brown — Dare to Lead",
i:"Brown's research surfaced a phrase leaders quote back to her more than any other: clear is kind; unclear is unkind. Softening the message to spare feelings — hinting, sandwiching, delaying, telling everyone except the person — is not kindness; it's self-protection dressed as compassion. People can handle direct information about their work and future far better than they can handle ambiguity, gossip, and the discovery that everyone knew but them.",
a:"Find one place where you've been vague to be 'nice' — an expectation, a performance concern, a decision. Deliver the clear version today, with warmth.",
r:"Where is your desire to be liked overriding someone's right to know where they stand?"},
{t:"W.A.I.T. — Why Am I Talking?",w:"Coaching practice — attributed widely",
i:"A deceptively simple acronym used across the coaching profession: before speaking, ask yourself Why Am I Talking? Managers fill silence reflexively — to demonstrate value, relieve discomfort, or regain control. But silence is where thinking happens. Research on 'wait time' in classrooms shows that pausing even three seconds after a question dramatically improves the depth of responses. Your team's best ideas often sit just on the other side of a pause you didn't allow.",
a:"After asking a question today, wait a full five seconds before speaking again — even if it feels endless. Count silently.",
r:"How much of your talking today served the team — and how much served your comfort?"},
{t:"Separate Observation From Evaluation",w:"Marshall Rosenberg — Nonviolent Communication",
i:"Rosenberg taught that mixing observation with evaluation invites defensiveness: 'You're careless with deadlines' is a character verdict; 'The last two reports arrived after the deadline' is a fact. NVC's sequence — observation, feeling, need, request — keeps hard messages hearable: 'When the report arrived Thursday (observation), I was concerned (feeling) because I need reliability toward the client (need). Could we agree on a check-in the day before it's due? (request).' The person can argue with your judgment; they can't argue with the videotape.",
a:"Take one criticism you're carrying and rewrite it as pure observation — something a camera would record — before you say it.",
r:"How much of your feedback is what happened, and how much is your story about what happened?"},
{t:"Label Emotions to Defuse Them",w:"Chris Voss — Never Split the Difference",
i:"The former FBI hostage negotiator's most portable tool is the label: naming the other side's emotion out loud — 'It seems like you're frustrated with how this was decided' — without agreeing or disagreeing. Labeling validates the feeling, lowers its temperature, and often gets the real issue on the table. Paired with the calibrated question ('How am I supposed to do that?' becomes 'What about this is most difficult for you?'), it turns confrontation into collaboration.",
a:"When you sense resistance in a meeting today, name it neutrally: 'It sounds like there are concerns about the timeline.' Then stop and listen.",
r:"What emotion is currently in your team that nobody has named out loud?"},
{t:"You Cannot Overcommunicate",w:"John Kotter — Leading Change",
i:"Kotter found that leaders undercommunicate their most important messages by a factor of ten. You've said the priority so many times you're bored of it — which is roughly when the team is first starting to believe you mean it. Messages compete with hundreds of others; repetition across channels (meetings, one-on-ones, written updates, your own visible behavior) is what turns an announcement into a shared understanding. If you're not slightly embarrassed by how often you repeat the core message, you haven't repeated it enough.",
a:"Identify your team's single most important current priority. Communicate it three separate times this week, in three different formats.",
r:"Could every member of your team state this quarter's top priority in one sentence — the same sentence?"},
{t:"Data Convinces, Story Moves",w:"Nancy Duarte — Resonate",
i:"Duarte's analysis of history's great communicators shows they all travel the same arc: they contrast what is with what could be, again and again, until the audience wants to move. Facts inform, but people decide with emotion and justify with logic. For a middle manager, this means the spreadsheet earns the meeting, but the story — the customer who struggled, the future the team is building — earns the effort. Every change you propose needs both a business case and a narrative.",
a:"Take one message you need to land this week and wrap it in a concrete story: a specific person, a specific struggle, a specific better future.",
r:"When you last asked your team for extra effort, did you give them numbers or a reason to care?"},
{t:"Tame Your Advice Monster",w:"Michael Bungay Stanier — The Advice Trap",
i:"Bungay Stanier names the creature that lives in every manager: the Advice Monster, which leaps in with solutions before the problem is even fully described. It has three personas — Tell-It (I must have the answer), Save-It (I must rescue everyone), and Control-It (I must keep a grip on everything). Advice given too fast is usually solving the wrong problem, mediocre because it lacks context, and quietly teaches your team that thinking is your job, not theirs.",
a:"For one full day, when asked for an answer, respond first with a question. Notice how often the person finds their own way.",
r:"Which advice monster persona — Tell-It, Save-It, Control-It — is yours?"},
/* Module 4 — Coach Your People */
{t:"Stay Curious a Little Longer",w:"Michael Bungay Stanier — The Coaching Habit",
i:"Bungay Stanier's definition of coaching is refreshingly small: can you stay curious a little bit longer, and rush to action and advice a little bit more slowly? Coaching isn't a formal hour with a certified professional — it's a ten-minute habit woven into ordinary conversations. The manager who asks one more question before prescribing builds a team that thinks; the manager who answers instantly builds a queue outside their door.",
a:"In every request for help today, ask at least two questions before offering any direction.",
r:"Is your door a place people come to think — or to collect answers?"},
{t:"Ask: What's on Your Mind?",w:"Michael Bungay Stanier — The Coaching Habit",
i:"The Kickstart Question — 'What's on your mind?' — opens conversations where they actually are, not where the agenda says they should be. It's focused enough to invite the real issue and open enough not to presume it. Bungay Stanier pairs it with the 3P model to focus the answer: is the challenge about a project (the content), a person (the relationships), or a pattern (their own behavior)? The deepest coaching usually lives in the third P.",
a:"Open your next one-on-one with 'What's on your mind?' — and let their answer, not your list, set the agenda.",
r:"Whose agenda do your one-on-ones actually serve?"},
{t:"Ask: And What Else?",w:"Michael Bungay Stanier — The Coaching Habit",
i:"Bungay Stanier calls 'And what else?' the best coaching question in the world, for a simple reason: the first answer is never the only answer, and rarely the best one. Asking it — genuinely, with curiosity — generates more options, and more options produce better decisions. It also buys you time to manage your own Advice Monster. Three or four rounds is usually enough; you'll know you're done when the answer is 'no, that's actually everything.'",
a:"Use 'And what else?' three times in one conversation today before evaluating any of the options raised.",
r:"How often do you settle for the first answer — yours or theirs?"},
{t:"Structure Growth With GROW",w:"Sir John Whitmore — Coaching for Performance",
i:"Whitmore's GROW model remains the backbone of workplace coaching: Goal (what do you want?), Reality (what's actually happening?), Options (what could you do?), Will (what will you do, by when?). Its power is sequence — most managers jump from a fuzzy problem straight to options, skipping the goal and the honest reality check. Ten disciplined minutes through GROW routinely outperforms an hour of unstructured problem-solving, and it leaves the ownership where it belongs.",
a:"Run your next problem-solving conversation through GROW explicitly. Spend the most time on Reality — it's where the insight hides.",
r:"When your team members leave conversations with you, do they carry a plan they own — or instructions they received?"},
{t:"Performance = Potential − Interference",w:"Timothy Gallwey — The Inner Game of Work",
i:"Gallwey, the coach whose tennis books founded the modern coaching movement, offers a formula: performance equals potential minus interference. Most managers try to raise performance by adding — more training, more pressure, more instruction. Gallwey's insight is subtractive: remove interference. The loudest interference is usually internal — self-doubt, fear of judgment, trying too hard — and much of it is manufactured by how the manager watches, corrects, and hovers.",
a:"Pick your most micro-managed person. For one week, replace corrections with one question: 'What are you noticing?' Watch what happens to their performance.",
r:"What interference are you adding to your team's game?"},
{t:"Coach the Person, Not the Problem",w:"Marcia Reynolds — Coach the Person, Not the Problem",
i:"Reynolds, a pioneer of coaching psychology, warns that managers default to solving the presented problem — when the presented problem is rarely the real one. Reflective inquiry means offering back what you hear — their words, emotions, contradictions — so people can examine their own thinking. 'You said this project excites you, but your energy dropped when you described it' does more than ten suggestions. People rarely need your solution; they need to see their own thinking from the outside.",
a:"In one conversation today, reflect back a contradiction or emotional shift you notice — without interpretation — and let them make sense of it.",
r:"Are you solving your people's problems, or helping them see their own thinking?"},
{t:"Make Strengths Productive",w:"Marcus Buckingham — First, Break All the Rules",
i:"Gallup's research on great managers, distilled by Buckingham, found they share one revolutionary belief: people don't change that much — don't waste time putting in what was left out; draw out what was left in. Average managers obsess over weaknesses; great ones cast people into roles where their strengths are used daily and manage around the rest. Engagement data backs it: people who use their strengths every day are far more likely to be engaged and to stay.",
a:"For each team member, write one sentence: 'They are at their best when…' If you can't finish it, that's your next one-on-one topic.",
r:"Does each person on your team get to do what they do best every day?"},
{t:"Match Your Style to Their Stage",w:"Paul Hersey & Ken Blanchard — Situational Leadership",
i:"There is no one right leadership style — only the right style for this person on this task. Hersey and Blanchard's model varies direction and support as competence and commitment develop: high direction for enthusiastic beginners, coaching through the difficult middle, support for the capable-but-cautious, and clean delegation for masters. The classic failure is style mismatch: micro-managing the expert (insulting) or delegating to the novice (abandonment). Diagnose first, then lead.",
a:"Map each direct report's development level on their main current task. Ask yourself honestly: does the style you're using match?",
r:"Who on your team are you over-managing — and who have you abandoned under the banner of 'trust'?"},
{t:"Give People Time to Think",w:"Nancy Kline — Time to Think",
i:"Kline's decades of work rest on one premise: the quality of everything we do depends on the quality of the thinking we do first, and the quality of our thinking depends on how we're treated while doing it. Generative attention — listening without interrupting, without visible judgment, without finishing sentences — is not passive. It actively improves the other person's thinking in real time. Kline's finding is humbling for managers: usually the best help you can offer isn't your ideas; it's your undivided attention.",
a:"Give someone ten uninterrupted minutes today. Your only job: attention, and the question 'What more do you think, or feel, or want to say?'",
r:"Does your presence improve your team's thinking — or replace it?"},
{t:"Ask: How Can I Help?",w:"Michael Bungay Stanier — The Coaching Habit",
i:"Bungay Stanier calls it the Lazy Question, and it does two jobs at once. First, it forces the other person to make a direct, specific request — often clarifying their own thinking in the process. Second, it stops you from assuming you know how to help and diving into rescue mode. Paired with its blunt cousin — 'What do you want from me?' — it replaces guessed-at heroics with contracted support. Lazy, it turns out, is respectful.",
a:"Next time you're about to jump in and save someone, ask 'How can I help?' instead — and do only what they ask.",
r:"How much of your 'helping' was actually requested?"},
/* Module 5 — Feedback & Hard Conversations */
{t:"Care Personally, Challenge Directly",w:"Kim Scott — Radical Candor",
i:"Scott's two-axis framework locates every feedback style. Radical Candor is caring personally while challenging directly. Fail on care and you get Obnoxious Aggression (the brilliant jerk); fail on challenge and you get Ruinous Empathy (nice but useless); fail on both and you get Manipulative Insincerity (politics). The order matters: you earn the right to challenge directly by demonstrating, over time, that you give a damn about the person — their work, their growth, their life beyond the job.",
a:"Pick your most avoided piece of feedback. Deliver it this week — directly, specifically, and with explicit care for the person's success.",
r:"Plot your last five feedback conversations on Scott's grid. Where do you actually live?"},
{t:"Beware Ruinous Empathy",w:"Kim Scott — Radical Candor",
i:"Scott's confession is famous: she once avoided telling a likable employee that his work was sloppy — protecting his feelings, she thought — until she had to fire him. His response: 'Why didn't anyone tell me?' Ruinous Empathy is the most common feedback failure precisely because it feels virtuous. But withholding the truth about someone's performance steals their chance to improve, and the kindness you're protecting is your own comfort, not their career.",
a:"Ask yourself about each direct report: 'Is there something this person doesn't know that is limiting them?' If yes, you owe them a conversation.",
r:"Whose career is currently paying for your niceness?"},
{t:"Describe Situation, Behavior, Impact",w:"Center for Creative Leadership — SBI",
i:"CCL's SBI model strips feedback down to three verifiable parts: the Situation (when and where — 'in Tuesday's client call'), the Behavior (what a camera would capture — 'you interrupted the client three times'), and the Impact ('she stopped sharing her concerns, and we lost information we needed'). No mind-reading, no character verdicts, no 'you always.' SBI works for praise too — and specific praise teaches far more than a generic 'great job.'",
a:"Give two pieces of SBI feedback today: one reinforcing, one corrective. Write them down first; check each part is observable.",
r:"Does your feedback describe behavior — or judge character?"},
{t:"Receive Feedback Like a Pro",w:"Douglas Stone & Sheila Heen — Thanks for the Feedback",
i:"Stone and Heen flip the feedback literature: the receiver, not the giver, controls whether feedback creates change. Three triggers block us: truth triggers ('that's just wrong'), relationship triggers ('you of all people'), and identity triggers ('I'm a failure'). The skill is to separate the trigger from the content and find what's right before litigating what's wrong. Managers who receive feedback badly train their teams to stop offering it — and then lead blind.",
a:"Ask one team member: 'What's one thing I could do differently that would make your work easier?' Respond only with questions and thanks — no defense.",
r:"When you last received hard feedback, which trigger fired — and what useful signal did it drown out?"},
{t:"Every Hard Talk Is Three Conversations",w:"Stone, Patton & Heen — Difficult Conversations",
i:"The Harvard Negotiation Project team found every difficult conversation is actually three: the 'what happened' conversation (where both sides argue their story as truth), the feelings conversation (running underneath, usually unacknowledged), and the identity conversation (what this means about me — am I competent, good, worthy?). Conversations derail when we argue on the surface while the real action is below. Progress starts by shifting from delivering a verdict to exploring both stories — from certainty to curiosity.",
a:"Before your next hard conversation, write three lines: their likely story, the feelings in play (both sides), and what's at stake for each identity.",
r:"In your last conflict, which of the three conversations were you actually having?"},
{t:"Make It Safe First",w:"Patterson, Grenny, McMillan & Switzler — Crucial Conversations",
i:"When a conversation turns crucial — high stakes, strong emotions, opposing views — people move to silence or violence: withdrawing, masking, or forcing. The authors' key insight: people don't get defensive because of the content; they get defensive because they don't feel safe. Safety rests on two conditions — mutual purpose (we're solving this together) and mutual respect. When you see safety collapse, stop the content, restore safety ('I don't want you to hear this as an attack — I want us both to win here'), then step back in.",
a:"In your next tense conversation, watch for silence or aggression. When it appears, pause the topic and restate your shared purpose before continuing.",
r:"When conversations with you get hard, do people push back — or go quiet? What does that tell you?"},
{t:"Master Your Stories",w:"Patterson, Grenny, McMillan & Switzler — Crucial Conversations",
i:"Between what we observe and how we feel, we insert a story — and we tell it so fast we mistake it for fact. He missed the deadline (fact); he doesn't respect my time (story); I'm furious (feeling). The authors' discipline: separate fact from story, then ask 'why would a reasonable, rational, decent person do this?' Not to excuse — to open genuinely plausible alternatives before you act on the worst one. Master your stories or they will master your conversations.",
a:"Take a current frustration with someone. List the raw facts on one side, your story on the other. Generate two alternative stories a reasonable person might fit to the same facts.",
r:"What villain story are you currently telling about a colleague — and what would its retirement cost you?"},
{t:"Catch People Doing Things Right",w:"Ken Blanchard — The One Minute Manager",
i:"Blanchard's most quoted line reverses the default managerial instinct: instead of catching people doing things wrong, catch them doing things right — especially when they're learning. A One Minute Praising is immediate, specific, and says why it matters: not 'good job' but 'the way you pre-briefed the client on the risk yesterday — that's exactly what builds their trust in us.' Behavior that gets specifically noticed gets repeated. What you praise is what you'll see more of.",
a:"Catch three people doing something right today. Praise each within minutes, name the exact behavior, and say the impact it had.",
r:"What's your ratio of corrective to appreciative comments this week — and what behavior is it purchasing?"},
{t:"Redirect in One Minute",w:"Ken Blanchard — The One Minute Manager",
i:"Blanchard's correction formula is fast, clean, and finished: address the mistake as soon as you see it, describe it specifically, say how it affects results, pause to let it land — then, crucially, reaffirm the person: 'You're better than this mistake, and I have full confidence in you.' The redirect targets the behavior, protects the relationship, and ends completely — no replaying it next week, no cold shoulder, no file of grievances. One minute, one behavior, then move forward together.",
a:"Next mistake you must address: correct it same-day, keep it under two minutes, end with genuine confidence in the person — and then genuinely drop it.",
r:"Do your corrections end when the conversation ends — or do people pay interest for days?"},
{t:"Try Feedforward",w:"Marshall Goldsmith — Feedforward",
i:"Goldsmith noticed that feedback has a design flaw: it litigates a past nobody can change, which is why it triggers defensiveness. His alternative, feedforward: pick a behavior you want to improve, ask people for two suggestions for the future, say only 'thank you,' and move on. No critique of history, no debate, no ranking. People give ideas gladly when they aren't judging you, and receive them gladly when they aren't being judged. It works up, down, and sideways — and it's fast.",
a:"Choose one leadership behavior you're working on. Ask three people today: 'Two suggestions for how I could do this better in the future?' Reply only 'thank you.'",
r:"What could you learn if getting better mattered more to you than being right about the past?"},
/* Module 6 — Delegation & Empowerment */
{t:"Be a Multiplier, Not a Diminisher",w:"Liz Wiseman — Multipliers",
i:"Wiseman's research across 150+ executives found that some leaders — Multipliers — get roughly twice the capability from their people as others. Diminishers hoard decisions, dominate discussions, and need to be the smartest in the room; around them, people shrink to compliance. Multipliers ask the questions, extend hard challenges, and expect their people's full intelligence — and get it. The sobering math: most diminishing is done by well-intentioned managers who think they're helping.",
a:"In your next team discussion, set the challenge and ask the questions — but let others own every answer. Track how much airtime you consume.",
r:"Do people leave your meetings feeling smarter and more capable — or corrected and smaller?"},
{t:"Are You an Accidental Diminisher?",w:"Liz Wiseman — Multipliers",
i:"Wiseman's most uncomfortable finding: the worst diminishing comes from good intentions. The Idea Guy sprays so many ideas the team stops generating its own. The Always-On leader's energy exhausts the room. The Rescuer jumps in at the first stumble, teaching helplessness. The Pacesetter runs so far ahead others stop trying to keep up. The Rapid Responder answers everything first, so nobody else bothers. Each believes they're adding value; each is quietly training the team to do less thinking.",
a:"Ask your team — or one brave member — 'When do I unintentionally shut down your thinking?' Listen without defending.",
r:"Which accidental diminisher profile is closest to your default under pressure?"},
{t:"Give Away Your Legos",w:"Molly Graham — scaling wisdom",
i:"Graham, who helped scale culture at Facebook, coined the metaphor for growth's central discomfort: as teams grow, you must hand over the work you love — your legos — to new people. The anxiety is real ('they'll do it differently, maybe worse at first') and irrelevant: clinging to old legos caps your team's growth and your own. The manager's job is to keep giving away work they've mastered to create room — for others to grow into it, and for themselves to take on what's next.",
a:"Identify one task you keep because you like it or you're fastest at it. Hand it to someone this week, with real ownership — not supervision.",
r:"Which legos are you clutching — and who is waiting to build with them?"},
{t:"Delegate Outcomes, Not Methods",w:"Stephen Covey — The 7 Habits",
i:"Covey distinguishes gofer delegation ('do this, then this, report back') from stewardship delegation: agree on desired results, guidelines, resources, accountability, and consequences — then get out of the way of how. Stewardship costs more time up front and repays it a hundredfold, because the person owns the outcome, not just the errand. The test of real delegation is whether you specified the what and the why, and genuinely left the how to them.",
a:"For your next delegation, write down the outcome, the boundaries, and the check-in points — and deliberately say nothing about method.",
r:"When you delegate, are you transferring ownership — or just distributing chores?"},
{t:"Choose Your Level of Delegation",w:"Jurgen Appelo — Management 3.0",
i:"Delegation isn't binary; it's a dial. Appelo names seven levels: Tell (I decide), Sell (I decide and explain), Consult (I ask your input, then decide), Agree (we decide together), Advise (you decide, hearing my view), Inquire (you decide, then tell me), Delegate (fully yours). Most delegation failures are level ambiguity: the manager thought Consult, the report heard Delegate, and both felt betrayed. Naming the level out loud — per decision, per person — prevents the most common trust-damaging surprise in management.",
a:"For three current decisions, tell the owner explicitly which level applies. Watch how much friction the clarity removes.",
r:"Think of your last delegation dispute. Did you ever actually say which level you intended?"},
{t:"Let Them Say 'I Intend To…'",w:"L. David Marquet — Turn the Ship Around!",
i:"Commanding the nuclear submarine Santa Fe, Marquet stopped giving orders. His crew was trained to state intent — 'Captain, I intend to submerge the ship' — with the thinking behind it, and he'd simply say 'very well.' The mechanism moves authority to where the information lives, and transforms passive followers into thinking leaders. The Santa Fe went from the fleet's worst to its best, and produced a record number of officers promoted to command. Don't move information to authority; move authority to information.",
a:"Ban one category of approval-seeking this week. Ask people to bring 'I intend to… because…' statements instead of 'What should I do?' questions.",
r:"How many decisions cross your desk today that someone closer to the facts should own?"},
{t:"Don't Adopt Their Monkeys",w:"William Oncken & Donald Wass — Who's Got the Monkey? (HBR)",
i:"The classic HBR article pictures every problem as a monkey on someone's back. Each time a team member says 'we've got a problem' and you say 'leave it with me,' the monkey leaps onto yours — and they'll be back tomorrow to check how you're doing with their problem. Soon you're working weekends feeding everyone's monkeys while your team waits, idle and disempowered. The rule: conversations end with the next move — the monkey — staying with its owner, perhaps better fed and with a check-in scheduled.",
a:"Today, end every problem conversation with: 'Good — what's your next move, and when will you update me?' Count the monkeys you decline.",
r:"How many of the items on your to-do list are actually someone else's monkey?"},
{t:"Judge Task-Relevant Maturity",w:"Andy Grove — High Output Management",
i:"Intel's legendary CEO cut through the delegation-versus-control debate with one variable: task-relevant maturity. How experienced is this person at this specific task — not in general? Low TRM calls for structure, precision, and frequent monitoring; high TRM calls for objectives and autonomy. The same person can be high TRM on client work and low TRM on budgeting, so oversight must vary by task, not by person. 'Hands-off' and 'micromanager' are both wrong as identities; they're settings, chosen per situation.",
a:"For one direct report, list their three main tasks and rate TRM on each. Adjust your involvement per task — tighter on one, looser on another.",
r:"Where are you applying one management style to a person who needs three?"},
{t:"Push Authority Down With the Why",w:"Jocko Willink & Leif Babin — Extreme Ownership",
i:"The former Navy SEAL commanders teach decentralized command: teams act fast in chaos only when every level understands not just the plan but the intent behind it — the commander's why. Then, when reality breaks the plan (it always does), people improvise toward the goal instead of freezing and escalating. The prerequisite is the leader's own extreme ownership: no blaming subordinates, conditions, or luck. If the team missed the intent, the leader didn't communicate it clearly enough.",
a:"Next time you assign anything, close with: 'Tell me in your words what we're trying to achieve and why.' Refine until the why survives the handoff.",
r:"If plans changed suddenly and you were unreachable, would your team know what outcome to protect?"},
{t:"Use the 70% Rule",w:"Widely used management heuristic",
i:"A rule practiced across well-run companies: if someone can do a task 70% as well as you, delegate it — because the missing 30% is exactly where their growth lives, and your redeployed time is worth more elsewhere. Perfectionist managers run the math backwards, treating their own 100% as the standard and any gap as unacceptable risk. But the team that's never allowed to be at 70% never becomes the team that's at 110% — and the manager who can't accept 70% has capped their organization at the size of one person.",
a:"List three tasks only you currently do. For each, name who could do it at 70% today — and delegate one of them before Friday.",
r:"What is your insistence on 100% actually costing — in your time, and in their growth?"},
/* Module 7 — Motivation & Engagement */
{t:"Autonomy, Mastery, Purpose",w:"Daniel Pink — Drive",
i:"Pink's synthesis of motivation science lands on three drivers for complex, creative work: autonomy (the urge to direct our own lives), mastery (the urge to get better at something that matters), and purpose (the urge to serve something larger than ourselves). Carrot-and-stick incentives work for simple mechanical tasks — and measurably damage performance on cognitive ones. The managerial translation: stop engineering compliance with rewards and pressure; start engineering conditions where these three intrinsic drivers can operate.",
a:"Audit one team member's role against the three drivers: where do they have real choice, visible progress, and a line of sight to purpose? Fix the weakest one.",
r:"Are you managing for compliance — or creating conditions for engagement?"},
{t:"Protect the Progress Principle",w:"Teresa Amabile & Steven Kramer — The Progress Principle",
i:"Analyzing 12,000 daily diary entries from knowledge workers, Amabile found the single biggest driver of motivation, emotion, and creativity was startlingly simple: making progress in meaningful work — even small progress. The biggest de-motivator: setbacks and hindrances, especially those imposed by management (shifting priorities, blocked resources, ignored work). Managers control the two levers: catalysts that enable progress (clear goals, resources, help) and nourishers (respect, encouragement, recognition of the progress itself).",
a:"At today's end, ask each person — or yourself about each person: 'What progress did they make today, and what did I do to enable or block it?'",
r:"What routine management behavior of yours most often erases your team's sense of progress?"},
{t:"Mind the SCARF",w:"David Rock — Your Brain at Work",
i:"Rock's neuroscience-based model identifies five social domains the brain treats like survival threats: Status (relative importance), Certainty (predictability), Autonomy (control), Relatedness (belonging), Fairness. A public correction, a surprise reorganization, a decision made over someone's head, an in-group they're excluded from, an unequal rule — each triggers the same threat circuitry as physical danger, and thinking narrows. Great managers pre-scan their actions for SCARF threats and deliberately create SCARF rewards.",
a:"Before delivering any significant news this week, scan it against the five SCARF domains. Adjust the delivery to reduce the biggest threat you find.",
r:"Which SCARF domain do you most often threaten without noticing?"},
{t:"People Leave Managers",w:"Marcus Buckingham & Curt Coffman — First, Break All the Rules",
i:"Gallup's mammoth study of over a million employees produced the finding every manager should have framed on their wall: people join companies, but they leave managers. The immediate supervisor — not pay, not perks, not the brand — is the strongest factor in engagement and retention. Your relationship with each person on your team is not a soft nicety around the real work; for their experience of the entire organization, you are the company.",
a:"Ask yourself for each direct report: 'If they resigned tomorrow, would I be surprised — and would I know why?' Where you're unsure, schedule the conversation.",
r:"Which of your people, if they left, would honestly be leaving you?"},
{t:"Make Expectations Crystal Clear",w:"Gallup — Q12 research",
i:"Of Gallup's twelve questions that predict team performance, the first is the most basic and the most failed: 'I know what is expected of me at work.' Roughly half of employees can't strongly agree. Expectations decay silently — priorities shift, roles blur, and the manager assumes clarity that was never confirmed. Unclear expectations masquerade as performance problems, motivation problems, and attitude problems. Before diagnosing any of those, verify the person could state, precisely, what excellent looks like in their role right now.",
a:"Ask each direct report to write their top three priorities as they understand them. Compare with yours. Treat every mismatch as your communication gap, not their failure.",
r:"How confident are you that your team's understanding of 'what matters most right now' matches yours?"},
{t:"Speak Their Language of Appreciation",w:"Gary Chapman & Paul White — The 5 Languages of Appreciation",
i:"Chapman and White found that appreciation misses when it's delivered in the giver's preferred language rather than the receiver's. Some people value words of affirmation; others value quality time with the boss, acts of service (help when swamped), or tangible tokens. The manager who praises publicly is baffled that one employee shrinks — because that employee reads appreciation as 'roll up your sleeves and help me,' not applause. Appreciation that doesn't land in the receiver's language barely counts.",
a:"For each team member, identify their likely language — ask directly if unsure: 'When have you felt most valued here?' Deliver this week's appreciation accordingly.",
r:"Are you appreciating people the way they receive it — or the way you like to give it?"},
{t:"Show Them Who Benefits",w:"Adam Grant — outsourcing inspiration",
i:"Grant's famous field experiment: university call-center fundraisers who spent five minutes meeting a single scholarship student their work funded went on to raise dramatically more money — over 400% more in one study — than colleagues who hadn't. The lesson he draws: purpose delivered as a manager's speech is weak; purpose delivered through contact with the actual beneficiary is rocket fuel. Middle managers sit exactly where this connection can be engineered: between the team doing the work and the people the work serves.",
a:"Engineer one direct contact this month between your team and a real beneficiary of their work — a customer, a field colleague, an end user. Let them speak, not you.",
r:"When did your team last see the face of someone their work actually helped?"},
{t:"Design for Flow",w:"Mihaly Csikszentmihalyi — Flow",
i:"Csikszentmihalyi's research on optimal experience found people are happiest and most productive in flow: fully absorbed in a task where challenge slightly exceeds skill, goals are clear, and feedback is immediate. Too much challenge produces anxiety; too little produces boredom — and both masquerade as disengagement. Managers are flow architects whether they know it or not: they set the challenge level, the goal clarity, the feedback loop, and — critically — the protection from the interruptions that shatter deep absorption.",
a:"Identify one person who seems bored and one who seems anxious. Adjust the challenge dial for each: stretch the first, support or re-scope the second.",
r:"When does your team get uninterrupted time in the challenge-skill sweet spot?"},
{t:"Fix Hygiene, Then Fuel Motivators",w:"Frederick Herzberg — Two-Factor Theory",
i:"Herzberg's classic finding still corrects a common managerial error: the factors that create dissatisfaction (bad pay, poor conditions, bureaucracy, bad policies — 'hygiene factors') are different in kind from the factors that create satisfaction (achievement, recognition, responsibility, growth — 'motivators'). Fixing hygiene removes misery but produces only neutrality, never engagement. The error: managers pour effort into perks and process while starving the actual motivators. You can't perk your way to a motivated team.",
a:"List your team's current gripes in two columns: hygiene versus motivator. Fix the loudest hygiene issue — then invest in one genuine motivator: new responsibility, visible growth, real recognition.",
r:"Is your engagement effort removing dissatisfaction — or actually creating motivation?"},
{t:"Let People Craft Their Jobs",w:"Amy Wrzesniewski — Job Crafting",
i:"Wrzesniewski's research on everyone from hospital cleaners to engineers shows people don't just take jobs — they shape them, often invisibly. Job crafting happens on three fronts: task crafting (adjusting what you do and how), relational crafting (changing who you interact with), and cognitive crafting (reframing what the work means — her cleaners who saw themselves as part of patient healing). Managers can suppress this or sponsor it. Sponsored crafting turns generic roles into personal vocations at essentially zero cost.",
a:"Ask one team member: 'If you could shift 10% of your role toward what energizes you, what would you change?' Then find a way to say yes.",
r:"How much room have you left in each role for the person to make it theirs?"},
/* Module 8 — Teams That Perform */
{t:"Climb the Five Dysfunctions Pyramid",w:"Patrick Lencioni — The Five Dysfunctions of a Team",
i:"Lencioni's model reads as five failures that stack: absence of trust (no vulnerability) breeds fear of conflict (artificial harmony), which breeds lack of commitment (ambiguity and false consensus), which breeds avoidance of accountability (low standards tolerated), which breeds inattention to results (ego and individual agendas win). The diagnostic power is the sequence — a 'results problem' is usually a commitment problem, which is usually a conflict problem, which is almost always a trust problem. Treat the layer below the symptom.",
a:"Rate your team honestly, 1–5, on each layer of the pyramid. Identify the lowest layer with a weak score — that's where the work is, whatever the surface symptom.",
r:"Which dysfunction would your team members say is yours — and would you dare ask them?"},
{t:"Mine for Conflict",w:"Patrick Lencioni — The Five Dysfunctions of a Team",
i:"Lencioni distinguishes destructive personal conflict from productive ideological conflict — passionate, unfiltered debate about ideas. Teams that fear the second get artificial harmony: polite meetings, then parking-lot conversations where the real opinions live. He assigns leaders the job of 'mining' for conflict: deliberately unearthing buried disagreements ('Maria, you've been quiet — I suspect you see this differently') and — hardest of all — letting debate run without prematurely rescuing the room from discomfort.",
a:"In your next meeting, find the unspoken disagreement and surface it by name. When debate ignites, resist resolving it for at least ten minutes.",
r:"Is your team's harmony real — or is it the polite silence of people who've stopped fighting for their ideas?"},
{t:"Disagree and Commit",w:"Andy Grove — Intel management practice",
i:"The practice Grove instilled at Intel — later adopted at Amazon — solves a false choice: consensus (slow, lowest-common-denominator) versus command (fast, but breeds sabotage). Disagree and commit separates two moments: in the debate, full-throated disagreement is a duty — hedging is disloyalty to the decision quality. After the decision, full commitment is a duty — relitigating in the hallway is disloyalty to the team. The formula only works when both halves are enforced: real debate first, real commitment after.",
a:"At your next contested decision, close explicitly: 'The debate was real, the decision is made — can everyone commit outside this room?' Get a verbal yes from each person.",
r:"Does your team disagree openly then commit fully — or agree politely then resist quietly?"},
{t:"Expect the Storm",w:"Bruce Tuckman — stages of group development",
i:"Tuckman's classic sequence — forming, storming, norming, performing — carries one deeply reassuring insight: storming is not failure; it's a developmental stage. New teams (and old teams with new members, new mandates, or new managers) must pass through friction over roles, status, and ways of working before real norms form. Managers who panic at storming and suppress it freeze the team in permanent politeness — forever forming, never performing. The job is to hold steady, keep conflict about the work, and steer the storm toward explicit norms.",
a:"If your team is in friction, name the stage openly: 'This is normal storming — let's use it to decide how we want to work together.' Turn one recurring clash into a written norm.",
r:"Is your team performing — or stuck in a stage you haven't helped it through?"},
{t:"What Google Learned About Teams",w:"Google — Project Aristotle",
i:"Google studied 180 of its own teams expecting to find the perfect mix of skills and personalities. Instead they found who is on the team matters far less than how the team works together. The top factor by a wide margin: psychological safety. Then dependability (things get done on time, to standard), structure and clarity (clear roles, plans, goals), meaning (the work matters personally), and impact (the work matters beyond us). For managers, the finding is liberating — you can't always pick your players, but all five conditions are buildable.",
a:"Run a quick pulse: ask your team to rate the five factors anonymously, 1–5. Discuss the lowest score openly at your next meeting.",
r:"You inherited your team's talent — but its dynamics are yours. Which of the five conditions needs you most?"},
{t:"Kill the Boring Meeting",w:"Patrick Lencioni — Death by Meeting",
i:"Lencioni's provocation: meetings are boring not because they're meetings but because we've removed the two things that make anything engaging — conflict and stakes — and blended every purpose into one gray weekly slush. His prescription separates meeting types: a quick daily or twice-weekly check-in for logistics, a weekly tactical for progress against goals, a monthly strategic with real debate on one or two big topics, and occasional off-sites. And the leader's counterintuitive job in each: find the conflict and put it on the table, like a movie director planting the hook in the first ten minutes.",
a:"Audit your recurring team meeting: what is its single purpose? Strip everything else out, and open the next one with the most contentious question on the topic.",
r:"If attendance at your meetings were optional, who would come?"},
{t:"Never Start With Logistics",w:"Priya Parker — The Art of Gathering",
i:"Parker's rule for any gathering — meetings included — is that purpose comes before everything: a meeting is not its agenda, its room, or its slide deck; it's a group of people gathered to do something together that they couldn't do apart. Most meetings skip the why and open with housekeeping, which tells everyone this hour is a ritual, not a decision. Her craft points travel well: name the real purpose, invite only those the purpose needs, open with intention rather than logistics, and actually close — don't just let time expire.",
a:"For your next meeting, write its purpose as a one-sentence outcome ('By the end we will have decided X'). Open by saying it, and cut anyone or anything the purpose doesn't need.",
r:"If you couldn't state a meeting's purpose in one sentence, why is it on nine people's calendars?"},
{t:"Write Your Working Agreements",w:"Team charter practice — agile & team-effectiveness canon",
i:"Every team runs on norms; the only question is whether they were chosen or just accumulated. Unwritten rules — who speaks, how decisions get made, how fast messages get answered, what happens when deadlines slip — are learned by newcomers through embarrassment. High-performing teams make them explicit in working agreements: a short, living list the team writes together, covering how we decide, how we disagree, how we communicate, and what we do when someone breaks the agreement. The act of writing them is itself a team intervention; the document is almost a byproduct.",
a:"Run a 45-minute session: 'What agreements would make us better?' Capture five to seven, post them visibly, and pick one to actively enforce this month.",
r:"What norms is your team currently running on that nobody ever actually agreed to?"},
{t:"What You Tolerate, You Teach",w:"Steve Gruenert & Todd Whitaker",
i:"Gruenert and Whitaker's line has become a leadership proverb: the culture of any organization is shaped by the worst behavior the leader is willing to tolerate. Values statements set the ceiling; tolerated behavior sets the floor — and teams live on the floor. Every time the chronic interrupter goes unchecked, the missed commitment slides, or the brilliant jerk gets a pass because of their numbers, the team updates its understanding of the real rules. Culture isn't what you preach; it's what you permit.",
a:"Name the worst recurring behavior you're currently tolerating on your team. Address it this week — privately, directly, and with a clear boundary.",
r:"What is your team learning about your real values from what you let slide?"},
{t:"Fail Intelligently, Learn Blamelessly",w:"Amy Edmondson — Right Kind of Wrong",
i:"Edmondson distinguishes failure types: preventable failures in known territory (deviations from process — reduce these), complex failures from many small factors aligning (learn from these), and intelligent failures — thoughtful experiments in new territory that didn't pan out (celebrate these; they're how discovery works). The blameless review, borrowed from aviation and high-reliability engineering, operationalizes it: after any failure, ask what happened and why the actions made sense at the time — not who's at fault. Blame optimizes for concealment; blamelessness optimizes for truth.",
a:"After your team's next setback, run a 30-minute blameless review: timeline, contributing factors, one process change. Explicitly rule out naming culprits.",
r:"When something breaks on your team, is the first question 'who' — or 'what' and 'why'?"},
/* Module 9 — Managing Up, Across & Change */
{t:"Manage Your Boss — It's Part of the Job",w:"John Gabarro & John Kotter — Managing Your Boss (HBR)",
i:"Gabarro and Kotter's classic reframes 'managing up' from politics to professional duty: you and your boss are mutually dependent, and the relationship is yours to manage as deliberately as any other. That means understanding their world — their goals, pressures, strengths, blind spots, and preferred working style (readers want memos; listeners want conversation) — and being scrupulously reliable with information: no surprises, no overpromising, honest early warnings. A middle manager who leaves this relationship on autopilot has left their team's resources, air cover, and reputation to chance.",
a:"Write down your manager's top three pressures this quarter and their preferred way of receiving information. Adjust your next update to match both.",
r:"Do you know what keeps your boss up at night — and does your work visibly help with it?"},
{t:"Influence Through Exchange",w:"Allan Cohen & David Bradford — Influence Without Authority",
i:"Cohen and Bradford's model treats influence across departments as fair exchange between allies: everyone values certain 'currencies' — recognition, resources, information, faster turnaround, visibility with seniors, gratitude, a returned favor. To move a peer you don't control, stop pushing your priority and start asking what they value that you can offer. The prerequisite mindset: assume the other party is a potential ally, not an obstacle. Most cross-team friction is two people demanding payment in currencies the other doesn't trade in.",
a:"Pick the peer whose cooperation you most need. List three currencies you hold that they'd value — and open your next conversation with an offer, not a request.",
r:"What do you have that your most difficult stakeholder actually wants?"},
{t:"Use the Science of Persuasion",w:"Robert Cialdini — Influence",
i:"Cialdini's six principles are the physics of everyday persuasion: reciprocity (people repay favors), commitment and consistency (people honor what they've said publicly), social proof (people follow peers), liking (people say yes to those they like and who like them), authority (people defer to credible expertise), and scarcity (people value what's limited). For managers, the ethical application is arranging the truth effectively: let the team hear that three other units adopted the practice (proof), invite people to voice their own commitment (consistency), give help before you need any (reciprocity).",
a:"Take one proposal you're pushing uphill. Redesign the pitch using two principles — e.g., cite respected peers already doing it, and ask people to state their own next step aloud.",
r:"Are you persuading by pressure — or by arranging legitimate evidence the way minds actually process it?"},
{t:"Map Your Stakeholders",w:"Stakeholder analysis — power–interest grid",
i:"The power–interest grid, a staple of change and project practice, sorts stakeholders into four boxes: high power and high interest (manage closely — these make or break you), high power, low interest (keep satisfied — don't spam them, don't surprise them), low power, high interest (keep informed — often your best allies and early warning system), and low power, low interest (monitor). The discipline isn't the grid; it's doing the mapping before you need people, and investing in relationships when you have nothing to ask.",
a:"Map the ten stakeholders around your current biggest initiative on the grid. Identify the one high-power person you've been neglecting — and get coffee scheduled.",
r:"Which relationship are you building only when you need something — and how do you think that reads?"},
{t:"Urgency First, Then a Coalition",w:"John Kotter — Leading Change",
i:"Kotter's eight-step model begins where most change efforts die: without a genuine sense of urgency (step 1), people politely wait out the initiative; without a guiding coalition (step 2) — a group with enough position, credibility, and relationships to carry it — the change belongs to one person and dies with their attention span. Middle managers rarely launch enterprise change, but every team-level change obeys the same law: name the burning reason honestly, and recruit two or three respected voices before the kickoff meeting, not after the resistance starts.",
a:"For your next change, however small, recruit two respected team members as co-owners before announcing anything. Let them shape it enough to mean it.",
r:"Does your team feel the reason for the change — or are they just complying until it blows over?"},
{t:"Direct the Rider, Motivate the Elephant",w:"Chip & Dan Heath — Switch",
i:"The Heath brothers picture change as a rider (our rational mind) on an elephant (our emotional mind) walking a path (the environment). Change fails when we lecture the rider while the elephant refuses to move. Their formula: direct the rider with crystal-clear behavior — not 'be more collaborative' but 'post your work-in-progress every Friday'; motivate the elephant with feeling — show the customer complaint, celebrate the early win; and shape the path — change defaults, checklists, and room layouts so the right behavior is the easy one. What looks like resistance is often exhaustion, and what looks like a people problem is often a path problem.",
a:"Take a change your team is 'resisting.' Script one specific behavior, one emotional reason to care, and one friction you can remove from the path this week.",
r:"Are you giving your team more analysis — when what they need is clearer moves and an easier path?"},
{t:"Manage the Transition, Not Just the Change",w:"William Bridges — Managing Transitions",
i:"Bridges' crucial distinction: change is the external event (the reorg, the new system, the new boss); transition is the internal psychological journey — and it's the transition that derails changes. It has three phases: the ending (people must let go of something, and loss deserves acknowledgment, not cheerleading), the neutral zone (the confusing in-between where old ways are gone and new ones aren't natural yet — also the most creative phase), and the new beginning. Managers who announce a change and expect instant new behavior have skipped two-thirds of the human process.",
a:"For a change your team is living through, name explicitly what people are losing — out loud, without minimizing. Then define what is definitely not changing, as an anchor.",
r:"Where is your team in the transition — and are you leading the phase they're actually in?"},
{t:"Is It Technical or Adaptive?",w:"Ronald Heifetz — Leadership Without Easy Answers",
i:"Heifetz's most valuable diagnostic: technical problems have known solutions that expertise can apply (fix the server, redesign the form); adaptive challenges require the people themselves to change — their values, habits, loyalties, or priorities (silos, quality culture, ownership). The classic leadership failure is treating adaptive challenges as technical ones: buying a tool to fix a collaboration problem, restructuring to fix a trust problem. Technical fixes for adaptive challenges fail with great precision. Adaptive work can't be done for people — only with them, at a pace they can absorb.",
a:"Take your team's most stubborn recurring problem. Ask: has every technical fix failed? Then name what people — including you — would have to change about themselves, and start that conversation.",
r:"Which problem do you keep 'solving' that keeps coming back — and what does its persistence tell you?"},
{t:"Get on the Balcony",w:"Ronald Heifetz & Marty Linsky — Leadership on the Line",
i:"Heifetz and Linsky's signature image: leadership requires moving between the dance floor — where you're in the action, reacting — and the balcony, where you can see the patterns: who allies with whom, what topics the team keeps avoiding, how your own behavior feeds the system. Managers trapped on the dance floor mistake activity for progress and treat each conflict as an isolated event rather than a pattern. The skill is oscillation: step up, read the system, then return to the floor and intervene where the pattern — not the latest incident — says to.",
a:"Block thirty minutes this week purely for balcony time: no doing, just diagnosing. Write down three patterns you see in your team that daily firefighting hides.",
r:"When did you last watch your team's dynamics instead of dancing in them?"},
{t:"Say No Gracefully",w:"Greg McKeown — Essentialism",
i:"McKeown's discipline of 'less but better' turns on a hard truth: if you don't prioritize your team's life, someone else will. Every unconsidered yes to a stakeholder request is a silent no to the team's core mission — and middle managers are the choke point where organizational overload either gets filtered or gets passed straight down. The graceful no separates the relationship from the request: 'I'd love to help, and to do this well I'd need to drop X — which would you prefer?' Essentialists earn respect precisely because their yes means something.",
a:"Surface the trade-off on the next incoming request: respond with what it would displace and ask the requester to choose. Practice one graceful no this week.",
r:"What has your team's real priority list gained — and lost — from the requests you didn't filter?"},
/* Module 10 — Driving Outcomes */
{t:"Measure What Matters",w:"John Doerr — Measure What Matters (OKRs)",
i:"Doerr brought Andy Grove's OKR system from Intel to Google: Objectives (what we want to achieve — significant, concrete, inspirational) paired with 3–5 Key Results (how we'll know — specific, measurable, verifiable: you either hit the number or you don't). Done right, OKRs deliver focus (few things, ruthlessly chosen), alignment (everyone can see how their goals ladder up), tracking, and stretch. Done wrong, they're a compliance ritual. The middle manager's version: your team should have no more than three objectives, each with results a stranger could score.",
a:"Draft one objective for your team this quarter with three measurable key results. Test each KR: could an outsider verify it was met, yes or no?",
r:"If you asked three team members your top goal this quarter, would you get one answer — or three?"},
{t:"Maximize Your Leverage",w:"Andy Grove — High Output Management",
i:"Grove's foundational equation: a manager's output is not their own work — it's the output of their team plus the teams they influence. Therefore the master variable is leverage: activities that multiply across many people's output. High-leverage acts: training (Grove considered it the highest-leverage thing a manager does), clear decisions made early, information that unblocks many people at once. Negative leverage exists too: indecision that stalls a whole team, meddling that teaches passivity, a manager's bad mood cascading. Ask of every hour: how many people's output does this affect, and for how long?",
a:"Review yesterday's calendar. Label each block high-leverage, low-leverage, or negative-leverage. Redesign next week to double the first category.",
r:"What did you do last week that will still be raising your team's output in six months?"},
{t:"Execute With Four Disciplines",w:"McChesney, Covey & Huling — The 4 Disciplines of Execution",
i:"4DX answers the question that kills most strategies: how do we execute amid the whirlwind of daily urgency? Discipline 1: focus on one or two Wildly Important Goals — not ten. Discipline 2: act on lead measures — the predictive, influenceable behaviors (calls made, reviews done) rather than the lag measures you can only mourn (quarterly numbers). Discipline 3: keep a compelling scoreboard the team can read in five seconds. Discipline 4: a weekly cadence of accountability where each person commits to specific actions and reports on last week's. The whirlwind will take everything you don't deliberately protect.",
a:"Choose your team's single wildly important goal. Identify one lead measure everyone can influence weekly — and start a 20-minute weekly cadence meeting around it.",
r:"Is your team busy with the whirlwind — or moving the one number that matters most?"},
{t:"Hold Sacred One-on-Ones",w:"Andy Grove — High Output Management",
i:"Grove considered the regular one-on-one the highest-leverage meeting in management — ninety minutes of his time could enhance two weeks of a subordinate's work. His rules endure: it is the employee's meeting, with their agenda; the manager's job is to listen, learn, and coach — Grove's ratio was the employee talking 90% of the time; and it must cover more than status (which email can handle): obstacles, morale, growth, and the things too uncomfortable for the team meeting. Cancelling one-on-ones when busy sends the clearest possible message about what — and who — actually matters.",
a:"Audit your one-on-ones: Do they happen reliably? Whose agenda? Who talks more? Fix the worst gap starting with this week's meetings.",
r:"Would your people call their one-on-one with you the most valuable meeting of their week — or a status report with eye contact?"},
{t:"Turn Up the Accountability Dial",w:"Jonathan Raymond — Good Authority",
