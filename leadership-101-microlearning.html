i:"Raymond replaces the accountability ambush — silence, silence, silence, explosion — with a graduated dial of five conversations: the Mention (a casual, low-stakes observation in the moment: 'hey, noticed the report slipped again'); the Invitation (a private conversation connecting the pattern to their growth); the Conversation (a serious sit-down: the pattern is now affecting the team); the Boundary (explicit consequences); and the Limit (final stage — the role may not be the fit). Most managers skip the first two entirely, then feel unjust delivering the fourth. Accountability done early, at low intensity, is a gift; done late, it's a verdict.",
a:"Deliver one 'Mention' today — a small, kind, in-the-moment naming of a pattern you've been silently tracking. Ten seconds, no ceremony.",
r:"What pattern have you watched in silence so long that addressing it now will feel like an ambush?"},
{t:"Protect Maker Time",w:"Paul Graham — Maker's Schedule, Manager's Schedule",
i:"Graham's essay names a collision middle managers referee daily: managers run on hour-sized calendar blocks, but makers — engineers, writers, analysts, anyone doing deep work — produce in half-day units, and a single meeting planted mid-morning can destroy an entire block of creative output. The cost is invisible on the calendar and enormous in reality. Cal Newport's deep-work research reinforces it: fragmented attention cannot do cognitively demanding work. The manager's job is to be the team's attention guardian — batching interruptions, clustering meetings, and defending long, unbroken stretches as fiercely as any deadline.",
a:"Establish one team-wide maker window this week — a half-day with no meetings, no pings expected. Defend it against the first three encroachments personally.",
r:"Look at your team's shared calendar: where can four consecutive hours of thought actually happen?"},
{t:"One-Way and Two-Way Doors",w:"Jeff Bezos — decision-making doctrine",
i:"Bezos sorts decisions into two types: one-way doors — consequential and irreversible or nearly so (key hires, public commitments, major architecture) — deserve slow, deliberate, well-informed process; two-way doors — reversible with modest cost — should be made quickly, by the people closest to the work, with about 70% of the information you wish you had. The signature failure of maturing organizations is applying heavyweight one-way-door process to two-way doors, strangling speed. Waiting for 90% certainty usually means being slow; if you can correct course cheaply, deciding fast is the rigorous choice.",
a:"Sort your five pending decisions into one-way and two-way doors. Make every two-way door decision by end of day tomorrow — and delegate at least one entirely.",
r:"Which reversible decisions are you treating as irreversible — and what is the delay costing?"},
{t:"Run After-Action Reviews",w:"U.S. Army — AAR practice",
i:"The After-Action Review, developed by the U.S. Army and adopted across high-performing organizations, is the simplest reliable learning machine ever designed. Four questions, asked promptly and without hierarchy: What did we expect to happen? What actually happened? Why the difference? What will we sustain or change next time? The rules are the mechanism: everyone speaks, rank is left at the door, and the goal is learning, not grading. Teams that AAR routinely — after successes as well as failures — compound experience into capability; teams that don't relive the same lessons annually.",
a:"After your team's next milestone — hit or missed — run a 30-minute AAR on the four questions. Capture one 'sustain' and one 'change,' and apply them visibly.",
r:"Is your team accumulating twenty years of experience — or one year of experience twenty times?"},
{t:"Use a Checklist",w:"Atul Gawande — The Checklist Manifesto",
i:"Gawande, a surgeon, showed that a humble checklist cut major surgical complications by a third — not because surgeons lack skill, but because complexity defeats memory, and under pressure even experts skip steps. The lesson for managers: recurring, failure-prone processes (launches, releases, onboarding, handovers, escalations) deserve short, sharp checklists of the killer items — the steps that are both easy to miss and expensive to miss. A good checklist is not bureaucracy; it's a discipline that frees expert attention for the judgment calls machines can't make. Pride says 'we don't need one'; the data says otherwise.",
a:"Pick your team's most error-prone recurring process. Write a checklist of nine items or fewer with the team — then actually use it on the next run.",
r:"Which recurring mistakes on your team are memory failures wearing the costume of competence failures?"},
{t:"Leaders Create Leaders",w:"John Maxwell — The 5 Levels of Leadership",
i:"Maxwell's five levels chart a leader's ascent: Position (people follow because they must), Permission (they follow because they want to), Production (because of what you've done for the organization), People Development (because of what you've done for them), and the Pinnacle (because of who you are and what you represent). The turning point is level four: the deliberate shift from producing results through people to producing leaders — hiring people better than yourself, giving away credit, and building a team that thrives without you. That is the final lesson of these hundred: your legacy is not what you achieved. It's who you grew — and what they go on to build.",
a:"Name your team's next leader. Write three experiences — not courses — that would stretch them toward readiness, and put the first one in motion this month.",
r:"If you left tomorrow, what would remain: a gap — or leaders you built?"},
/* Bonus Module 11 — The McKinsey Lens */
{t:"Answer First: The Pyramid Principle",w:"Barbara Minto — The Pyramid Principle (McKinsey)",
i:"Minto, McKinsey's first female consultant, codified how the firm communicates: start with the governing thought — the answer — then support it with a small set of grouped arguments, each backed by evidence. Most managers write and speak in the order they thought: background, analysis, options, and finally (if time allows) a conclusion. Senior audiences experience this as suspense they didn't ask for. Her SCQA opening — Situation, Complication, Question, Answer — earns attention in four sentences, and the pyramid beneath it means any level of detail is available on demand without being inflicted by default.",
a:"Take the next update you owe upward. Rewrite it answer-first: one governing sentence, then exactly three supporting points. Cut everything the answer doesn't need.",
r:"Do your updates deliver the answer in the first sentence — or make your boss excavate for it?"},
{t:"Think MECE",w:"McKinsey problem-solving canon",
i:"MECE — mutually exclusive, collectively exhaustive — is the firm's discipline for decomposing problems: break any issue into buckets that don't overlap (so no work is double-counted and no two people unknowingly solve the same slice) and that together cover the whole space (so nothing falls between the chairs). Applied as an issue tree, it turns a vague worry ('revenue is down') into ownable branches (price, volume; volume into new versus existing customers…). For a middle manager, MECE is less about consulting polish than about clean delegation: every branch has one owner, and the sum of branches is the whole problem.",
a:"Take your team's current messiest problem and draw a three-to-four-branch issue tree. Test it: any overlaps? Any gaps? Then assign one owner per branch.",
r:"In your current plan, where could two people be duplicating effort while a third slice of the problem goes unowned?"},
{t:"Align the Seven S's",w:"Waterman, Peters & Phillips — McKinsey 7-S Framework",
i:"The 7-S framework, developed at McKinsey, maps organizational effectiveness across seven interdependent elements: three hard S's — strategy, structure, systems — and four soft ones — shared values (at the center), skills, style, and staff. Its enduring insight: change efforts fail when leaders redesign the hard S's and assume the soft ones will follow. A new structure with the old leadership style, or a new strategy the team lacks skills to execute, produces expensive disappointment. The elements are a web; pull one and the others must move or the web pulls it back.",
a:"Audit your current change initiative against all seven S's in one column each. Circle the misaligned soft S — style, skills, staff, or values — and make it this month's focus.",
r:"Which soft S is quietly working against the hard-S change you're pushing?"},
{t:"The Obligation to Dissent",w:"McKinsey & Company — firm value",
i:"One of McKinsey's stated values is that every consultant — including the most junior analyst in the room — has an obligation, not merely permission, to dissent when they believe the team is wrong. The reframe is powerful: psychological safety initiatives make speaking up allowed; obligation makes silence a professional failure. It converts candor from a personality trait into a duty of the role, protecting the team from its most dangerous moments — when everyone senior agrees and everyone junior sees the flaw. Pairs directly with Edmondson's safety work: the duty only functions where dissent is received with gratitude.",
a:"At your next significant decision, announce the rule: 'Everyone here has an obligation to dissent.' Then ask the most junior person for their view first.",
r:"On your team, is dissent a right people may exercise — or a duty they owe the outcome?"},
{t:"Lead From the Center",w:"Joanna Barsh — Centered Leadership (McKinsey)",
i:"Barsh's multi-year McKinsey research project on remarkable leaders distilled five capabilities that distinguish those who thrive under pressure: meaning (anchoring in purpose and strengths — the master capability that powers the rest), positive framing (reframing setbacks to sustain agency), connecting (building reciprocal relationships and sponsorship networks), engaging (stepping toward risk and opportunity with presence and voice), and energizing (managing personal energy deliberately for the long haul). The finding echoes across this whole course: sustainable leadership of others begins with deliberate leadership of yourself.",
a:"Rate yourself 1–10 on each of the five capabilities. Choose the lowest and commit to one weekly practice that builds it — starting this week.",
r:"Which of the five capabilities carries you on good days — and which one goes missing under pressure?"},
];

const X=[
["The Golden Circle: Why at the center (your purpose or belief), How in the middle (your distinctive way), What on the outside (tasks and products). Most teams communicate outside-in; inspiring leaders speak from the center out.",
"Sinek grounds it in biology: the neocortex handles language and analysis (the what), while the limbic brain drives trust and decisions — and has no capacity for language. Purpose is felt before it is reasoned.",
"For a middle manager the model is a translation device: strategy arrives as targets (whats); restore the why before passing them down — and keep it specific: 'field officers never wait for data' beats 'operational excellence'."],
["The book catalogs 20 habits of successful people — adding too much value, passing judgment, starting sentences with 'no', 'but' or 'however', claiming credit, not listening — flaws that persist precisely because success keeps rewarding their owner.",
"The math of adding value: your improvement may add 5% to the idea's quality but cuts the person's ownership of it by 50% — a terrible trade for a leader.",
"Goldsmith's change method is behavioral, not analytical: pick one habit, apologize to those affected, advertise that you're working on it, and follow up monthly — because perception lags changed behavior by a year or more."],
["Fixed mindset: ability is a static trait, so effort signals inadequacy and mistakes must be hidden. Growth mindset: ability grows with effort and feedback, so challenge is opportunity and error is information.",
"Dweck's studies found children praised for intelligence chose easier tasks and collapsed after failure; children praised for process chose harder tasks and improved — the same praise dynamics operate in your team meetings.",
"Beware 'false growth mindset': it is not relentless positivity. It pairs belief in development with honest feedback and real support — 'not yet' plus a plan, not 'not yet' as a slogan."],
["Goleman's model has four domains — self-awareness, self-management, social awareness, relationship management — spanning twelve competencies; the first domain is the gateway, because you cannot manage a state you never notice.",
"His research argument: for leadership roles, emotional intelligence matters roughly twice as much as technical skill and IQ combined — and its weight grows with seniority.",
"Neuroscience supports the naming practice: affect labeling — putting a feeling into a precise word — measurably dampens amygdala activation, converting reaction into choice."],
["Four energy sources, each needing its own renewal: physical (sleep, movement, nutrition), emotional (positive relationships), mental (focus), and spiritual (alignment with purpose).",
"The core principle is oscillation: high performance is rhythmic spending and renewal of energy, like interval training. Linear expenditure — always on — produces the flat exhaustion many managers call normal.",
"Rituals beat willpower: recovery that is scheduled and automatic (a hard stop, a walking meeting, a real lunch) survives busy weeks; recovery that depends on remembering never happens."],
["Active phrasing is the engine: 'Did I do my best to…' measures effort you control, not outcomes the environment controls — removing the excuse layer between you and your behavior.",
"Goldsmith scores himself nightly on around twenty questions and pays someone to call and collect the numbers — his point being that structure and follow-up, not character, are what make change stick.",
"Start with six questions that matter to your leadership — set clear goals, make progress, find meaning, build relationships, be fully engaged — and score yourself 1–10 nightly for two weeks."],

"The practical unit is the entrance: teams read the leader's face and posture in the first seconds of every interaction and calibrate their risk-taking accordingly."],

"Scott's starting move: solicit before you give — 'What could I do or stop doing that would make it easier to work with me?' — and reward the answer visibly."],
["Scott calls Ruinous Empathy the quadrant where the vast majority of management mistakes live — it feels virtuous from the inside, which is what makes it durable.",
"Her defining story: 'Bob', a likable underperformer she never corrected — until she had to fire him. His question — 'why didn't anyone tell me?' — is the cost of niceness, itemized.",
"The self-test: is this kindness for them, or comfort for me? Withholding the truth about performance is self-protection wearing kindness's clothes."],
["Three parts, strictly observable: Situation anchors the memory ('in Tuesday's client call'), Behavior is what a camera would record, Impact is the effect — which is yours to own honestly.",
"It works identically for praise, and specific praise outperforms generic praise at teaching people what to repeat.",
"Close the loop with intent: after delivering SBI, ask 'what was going on for you?' — behavior you observed and intent you assumed are frequently different things."],
["Three triggers block learning from feedback: truth triggers (that's just wrong), relationship triggers (you, of all people), identity triggers (this means I'm a failure).",
"Feedback comes in three kinds — appreciation, coaching, evaluation — and misery follows when you need one and receive another. Name which kind is on the table.",
"Their discipline: find the 3% — even badly delivered, largely wrong feedback usually contains a usable signal, and the receiver who finds it wins twice."],
["The three layers: the 'what happened' conversation (both stories are partial), the feelings conversation (running underneath, usually unacknowledged), and the identity conversation (what this says about me).",
"The stance shift that changes everything: from certainty ('I know what happened') to curiosity ('how do they see it?').",
"Open with the third story: describe the gap between your stories the way a neutral mediator would — 'we seem to see the deadline differently' — before advocating your own."],
["Watch for the two safety alarms: silence (masking, avoiding, withdrawing) and violence (controlling, labeling, attacking). Either means safety, not content, needs attention.",
"Safety repairs: a sincere apology where warranted; contrasting ('I don't mean X — I do mean Y'); and re-anchoring in mutual purpose.",
"Start with heart: before the conversation, answer — what do I really want for me, for them, for the relationship? Under stress the goal silently degrades into winning."],
["The path to action: we see and hear facts, tell ourselves a story about them, feel the emotion the story generates, then act. The story — not the fact — is the choice point.",
"Three villain-story genres: victim ('it's not my fault'), villain ('it's all their fault'), helpless ('there's nothing I can do'). All three excuse us from our contribution.",
"The humanizing question: why would a reasonable, rational, decent person do this? Not to excuse — to generate plausible stories you can actually test."],
["The One Minute Praising: deliver it immediately, name the specific behavior, state its impact and your genuine reaction, and encourage more of the same.",
"It's most powerful with people learning something new: early, specific praise shapes the behavior while it's still forming.",
"The ratio is the environment: teams flourish where positive interactions substantially outnumber corrective ones — praise is not decoration, it's climate."],
["The redirect sequence: correct promptly, describe the mistake specifically, share its impact, pause to let it land — then reaffirm the person: 'you're better than this mistake, and I have confidence in you.'",
"It ends completely: no grudges, no replaying it next week, no file of grievances. The correction targets one behavior and then closes.",
"Blanchard updated the original 'reprimand' to 'redirect' in The New One Minute Manager — recognizing that in fast-changing work, most errors are learning events, not discipline events."],
["The exercise: name one behavior you want to improve, ask each person for two suggestions for the future, and reply only 'thank you'. No critique of the past, no discussion, no ranking.",
"Why it works: no one can change the past, so no one defends it; ideas flow because givers aren't judging and receivers aren't being judged.",
"It scales in every direction — up, down, sideways — and it's fast: Goldsmith runs it as a whole-room exercise in minutes."],
["Wiseman's five Multiplier disciplines: the Talent Magnet, the Liberator, the Challenger, the Debate Maker, and the Investor — versus Diminisher counterparts like the Empire Builder, the Tyrant and the Micromanager.",
"Her research across 150+ executives: people report giving Multipliers about twice as much of their capability as Diminishers — same people, different leader, double the output.",
"The hinge behavior: Diminishers have the answers; Multipliers ask the questions and extend challenges slightly beyond what the team believes it can do."],
["The main accidental profiles: the Idea Guy (idea fountain drowns others' initiative), the Always-On (energy exhausts the room), the Rescuer (help teaches helplessness), the Pacesetter (speed demotivates), and the Rapid Responder (answers first, so nobody else bothers).",
"The gap is intentions versus impact: every profile is a strength on overdrive, experienced by the team as shrinkage.",
"Wiseman's remedies: ask the questions, give the work back, wait before responding — and periodically ask your team where you unintentionally shut their thinking down."],
["Graham's metaphor from scaling Facebook: growth means repeatedly handing your favorite lego sets — work you love and mastered — to newcomers, and the accompanying anxiety is normal, not a signal to stop.",
"The promise on the other side: there are always bigger, more interesting lego sets ahead — but only if your hands are free to pick them up.",
"The management version: your own growth depends on succession. A manager still doing their old job has capped two careers — theirs and their team's."],
["Covey's five elements of stewardship delegation: desired results, guidelines (the boundaries, including known failure paths), resources, accountability (how and when we'll review), and consequences.",
"Gofer delegation supervises methods; stewardship delegation transfers ownership of results — costlier up front, compounding forever after.",
"Inspect what you agreed, not how it's being done: checking methods reclaims the ownership you meant to give away."],
["Appelo's seven levels: Tell, Sell, Consult, Agree, Advise, Inquire, Delegate — a dial, not a switch, set per decision area and per person.",
"Management 3.0 practice makes it visible: 'delegation poker' and a delegation board record which level applies to which decisions, so nobody has to guess.",
"The failure mode is always ambiguity: the manager intended Consult, the person heard Delegate — and the correction afterward reads as betrayal on both sides."],
["The ladder of leadership: from 'tell me what to do' up through 'I intend to…' to 'I've been doing…' — Marquet's crew climbed it rung by rung as he pushed authority down.",
"Two pillars must support moved authority: technical competence (can they make the call?) and organizational clarity (do they know what we're trying to achieve?). Authority without both is abandonment.",
"His slogan compresses the philosophy: don't move information to authority; move authority to the information."],
["The 1974 HBR classic defines the monkey as the next move: every 'leave it with me' transfers the monkey — and its feeding schedule — to your back.",
"House rules: monkeys are fed by appointment (scheduled check-ins, not ambushes) and kept at the lowest capable level; conversations end with the next move explicitly assigned.",
"Stephen Covey's later commentary reframed it positively: monkey management done well is empowerment — building people who can feed their own monkeys."],
["Grove's variable: task-relevant maturity — experience and competence at this specific task, not general seniority. Style follows TRM: structured direction at low TRM, monitoring at medium, objectives-only at high.",
"TRM is dynamic: it rises with experience and falls when the task, technology or context changes — a reorganization can lower everyone's TRM overnight.",
"Grove's warning for the hands-off: delegation without monitoring is abdication. Even high-TRM delegation keeps a feedback loop."],
["The four laws of combat, translated to teams: cover and move (teamwork across silos), simple (plans everyone can repeat), prioritize and execute (one thing at a time under pressure), decentralized command (intent-driven autonomy).",
"Extreme ownership is total: the leader owns everything in their world, including their people's failures — 'whose fault' conversations end at the mirror.",
"Decentralized command's precondition: every level understands the mission's why one level up and one level down."],
["The arithmetic of the growth gap: the missing 30% is precisely where the other person's development happens — withholding the task withholds the growth.",
"Your redeployed hours compound at higher leverage: coaching, removing obstacles, and working the problems only you can work.",
"De-risk it with design, not supervision: define the outcome and checkpoints, accept a different method, and resist re-taking the task at the first wobble."],
["The research base is self-determination theory (Deci & Ryan) plus decades of experiments: contingent if-then rewards work for mechanical tasks and actively impair performance on creative, cognitive ones — the candle-problem studies made this famous.",
"The three drivers in practice: autonomy over task, time, technique and team; mastery through 'Goldilocks tasks' just beyond current ability; purpose through a visible line from the work to something that matters.",
"Pink's caution: pay must be fair and off the table first — money badly handled is a demotivator; money well handled just clears the stage for the real drivers."],
["The study: nearly 12,000 daily diary entries from 238 knowledge workers — the single best predictor of a great inner work life was making progress in meaningful work, however small.",
"Inner work life — the private stream of perceptions, emotions and motivations — drives creativity and productivity, and managers influence it daily whether they mean to or not.",
"The manager's levers come in pairs: catalysts (clear goals, resources, help) and nourishers (respect, encouragement) versus their evil twins — inhibitors and toxins. Setbacks hurt roughly twice as much as progress helps."],
["The neuroscience claim: the brain processes social threats with the same circuitry as physical ones — a status threat or an injustice produces a genuine 'away' response that narrows thinking.",
"The five domains: Status (relative importance), Certainty (predictability), Autonomy (control), Relatedness (belonging), Fairness. Every management act — feedback, reorganization, praise, exclusion — moves at least one.",
"Use it in both directions: pre-scan decisions for threats (announce early to protect certainty; involve people to protect autonomy) and engineer rewards (genuine recognition is a status reward that costs nothing)."],
["Gallup's Q12 — twelve questions that predict team performance — made the manager's role measurable: by their estimate, the manager accounts for about 70% of the variance in team engagement.",
"The meta-analysis link: engaged teams show meaningfully higher productivity and profitability and lower turnover, absenteeism and safety incidents.",
"The blunt implication: improving your own management is the single highest-leverage retention program available to your organization."],
["Q12's first and most fundamental item — 'I know what is expected of me at work' — is fully agreed with by only about half of employees; everything else in engagement builds on it.",
"Expectations decay silently: every priority shift, reorganization and new stakeholder erodes clarity that was never strongly confirmed in the first place.",
"Define excellence, not just tasks: people can meet a task list and still miss what great looks like — describe the standard, not only the activity."],
["The workplace languages: words of affirmation, quality time, acts of service, and tangible gifts (the original fifth, physical touch, is adapted to appropriate gestures like a handshake or high-five).",
"The core finding: people give appreciation in the language they like to receive — so sincere managers still miss, because the currency is wrong for the recipient.",
"Cheap diagnosis: watch how they appreciate others, or simply ask 'when have you felt most valued here?' — then deliver in that language."],
["Grant's field experiment: university fundraisers who spent five minutes with a single scholarship student they had helped fund subsequently multiplied their weekly call time and revenue — some studies showing gains above 400%.",
"The mechanism is task significance made vivid: an abstract mission statement informs; a face and a story transform.",
"His advice to leaders: outsource inspiration — the beneficiary's own words beat the manager's speech every time, because the messenger is the message."],
["Flow's entry conditions: clear goals, immediate feedback, and a challenge that slightly exceeds skill — the channel between anxiety (too hard) and boredom (too easy).",
"Its signatures: complete absorption, distorted sense of time, and intrinsic reward — the activity becomes its own motivation.",
"The managerial threat is interruption: refocusing after a switch takes many minutes, so a fragmented calendar can keep a skilled team permanently out of its most productive state."],
["Herzberg's two-factor finding: satisfaction and dissatisfaction are not opposite ends of one scale — they are separate scales with separate causes.",
"Hygiene factors — policy, supervision, salary, conditions, security — can only move you from miserable to neutral; they cannot create engagement.",
"Motivators — achievement, recognition, the work itself, responsibility, advancement, growth — are the only levers that create positive drive; his prescription was job enrichment, not perk enrichment."],
["Three crafting moves: task crafting (changing what you do or how), relational crafting (changing who you interact with and how), cognitive crafting (reframing what the work means).",
"The famous study: hospital cleaners who saw themselves as part of the healing team — timing work around patients, cheering families — experienced the same job as a calling.",
"The manager's role is sponsorship: invite the 10% redesign conversation, approve sensible swaps, and guard boundaries so crafting doesn't quietly overload your most willing people."],
["The five behaviors of a cohesive team, in order: build vulnerability-based trust, master ideological conflict, force clarity and commitment, embrace peer accountability, focus on collective results.",
"Lencioni's 'first team' rule: your primary team is your peer team — the leadership team you sit on — not the team you lead. Managers who invert this create silos.",
"Every layer starts with the leader: teams don't climb the pyramid faster than the person at the top demonstrates each behavior."],
["The conflict continuum runs from artificial harmony to mean-spirited personal attacks — and the ideal sits just left of center: passionate, unfiltered debate about ideas, never people.",
"The miner's job: surface buried disagreements by name ('Maria, you went quiet — I suspect you see this differently') and give real-time permission ('this is exactly the debate we need').",
"Pair it with agreed conflict norms: teams that decide in calm how they will disagree can afford much hotter, more productive arguments."],
["The practice comes from Grove's Intel and was canonized in Bezos's 2016 shareholder letter — his own example: greenlighting an Amazon Studios production he personally doubted, quickly and wholeheartedly.",
"It requires both halves enforced: hedged debate is disloyalty to decision quality; hallway relitigating is disloyalty to the team.",
"Leaders must model the commit side: visibly and energetically executing a decision that went against your view is what licenses everyone else to do the same."],
["Tuckman's 1965 synthesis added a fifth stage in 1977 — adjourning — the often-skipped work of closing well: capturing lessons, honoring the ending.",
"Storming is developmental, not dysfunctional: teams that suppress it get stuck in permanent politeness — 'pseudo-community' that never earns real norms.",
"Regression is normal: a new member, a new mandate or a crisis sends teams back a stage. Naming the stage out loud ('we're storming again — good') shortens the trip."],
["The study: 180+ Google teams, 250+ variables — who was on the team mattered far less than how the team worked together.",
"The five conditions in order: psychological safety, dependability, structure and clarity, meaning, impact — with safety the clear foundation.",
"Related research (Anita Woolley's collective intelligence): high-performing groups show conversational turn-taking and social sensitivity — everyone talks in roughly equal measure, and members read each other well."],
["Lencioni's four meeting types: the daily check-in (5 minutes, logistics), the weekly tactical (45–90 minutes, progress against goals), the monthly strategic (2–4 hours, one or two big topics), and the quarterly off-site review.",
"Mixing types is the killer: strategic topics ambushed inside tactical meetings get shallow treatment, and tactical noise crowds out real debate. Separate them ruthlessly.",
"His drama principle: like a film director, the leader hooks the meeting in the first ten minutes by naming the real conflict — boredom is a leadership failure, not a meeting-format problem."],
["Parker's distinction: a category is not a purpose. 'Weekly team meeting' is a category; 'decide the two priorities we'll protect this quarter' is a purpose — specific, disputable, and worth gathering for.",
"Ninety percent of a gathering's success happens before it starts: the purpose, the guest list (who the purpose needs — and doesn't), and how people are primed to arrive.",
"Practice generous authority: a good host protects guests (from interrupters, from tangents), equalizes them (juniors speak), and connects them — passivity is not politeness."],
["Cover the operating system explicitly: how we make decisions, how we disagree, expected response times by channel, meeting behaviors, and what quality means here.",
"Make them living: revisit quarterly, and agree the breach protocol in calm — 'what do we do when someone (including the manager) breaks an agreement?'",
"The alternative isn't norm-free work — it's unwritten norms learned by embarrassment, which is how newcomers currently learn them."],
["The floor principle: values statements set the ceiling, tolerated behavior sets the floor — and teams live on the floor.",
"The star exception is the most expensive: one brilliant jerk given a pass reprices every rule for everyone — the team concludes results buy exemption from values.",
"The repair is boring consistency: address it privately, promptly, every time. The team can't see the private conversation, but they can see whether the behavior continues."],
["Edmondson's taxonomy: basic failures (preventable slips in known territory — reduce them), complex failures (many small factors aligning — learn and add safeguards), intelligent failures (thoughtful experiments in new territory — welcome them).",
"An intelligent failure qualifies four ways: it happens in genuinely new territory, pursues a real opportunity, is informed by available knowledge, and is as small as it can be while still teaching.",
"Blameless is not consequence-free: a pattern of preventable failure is a performance conversation; a well-designed experiment that failed is tuition — confusing the two destroys either learning or standards."],
["The premise: you and your boss are mutually dependent — they need your honesty, reliability and early warnings; you need their resources, information and air cover. Neither side works on autopilot.",
"Study their world: current pressures, goals, strengths, blind spots — and their working style: readers want it in writing first; listeners want the conversation first.",
"Manage the flow: no surprises ever, dependable follow-through, selective use of their time — the currency of upward trust is predictability."],
["The currency families: inspiration (vision, excellence), task (resources, help, information), position (recognition, visibility, contacts), relationship (understanding, belonging), and personal (gratitude, ownership, comfort).",
"The law of reciprocity runs organizational life: build credit through genuine help before you need to draw on it — influence is a balance, not a transaction.",
"The prerequisite stance: assume the other party is a potential ally. Adversarial framing forecloses the exchange before it starts."],
["The six principles: reciprocity, commitment and consistency, social proof, liking, authority, scarcity — with unity (shared identity) added in his later work.",
"The ethical line: influence arranges true evidence effectively; manipulation fabricates it. The principles work identically for both, which is why the intent matters.",
"Most useful for managers: commitment and consistency — people who state a position or take a small step defend it; invite public micro-commitments before asking for big ones."],
["The grid's four strategies: manage closely (high power, high interest), keep satisfied (high power, low interest — no surprises, no spam), keep informed (low power, high interest — your allies and early-warning system), monitor (low/low).",
"Maps decay: positions shift with reorganizations and results — re-map at every major milestone.",
"The compounding rule: invest in high-power relationships before you need them; a first conversation that contains an ask starts at a deficit."],
["The eight steps: create urgency, build a guiding coalition, form a vision, communicate it, empower action, generate short-term wins, consolidate gains, anchor in culture — most failures happen in the first two.",
"Urgency is not fear: fear freezes; aspiration sustains. The true enemy Kotter names is complacency — especially the complacency of past success.",
"Coalition math: you need position power, expertise, credibility and leadership in the room — enough combined weight that skeptics can't dismiss the effort as one person's project."],
["The metaphor (from Jonathan Haidt): a rational rider atop an emotional elephant on a path. The rider plans, the elephant powers, the path shapes both — change efforts must address all three.",
"Find the bright spots: somewhere, the problem is already partly solved — find who's succeeding against the odds and clone their moves (the Sternin nutrition study in Vietnam is the Heaths' signature example).",
"Shrink the change: the elephant balks at big; break it until the first step is unrefusable — then let small wins build the momentum analysis never could."],
["Bridges' sequence starts with endings: every change asks people to lose something — competence, identity, relationships, routines. Mark the ending and honor the loss instead of cheerleading past it.",
"The neutral zone — old gone, new not yet natural — is both the danger zone (anxiety, dips, departures) and the most creative phase; over-managing or abandoning people there both fail.",
"New beginnings need the four P's: purpose (why), picture (what it will look and feel like), plan (the steps), and part (what role each person plays)."],
["The distinction: technical problems have known solutions expertise can apply; adaptive challenges require the people themselves to change values, habits or loyalties — and can't be solved by authority or expertise alone.",
"Resistance decoded: people don't resist change, they resist loss. Naming what's genuinely being lost is the beginning of adaptive work.",
"Two disciplines: give the work back (adaptive challenges can't be solved for people) and regulate the heat — enough pressure that people engage, not so much that they flee."],
["The oscillation: the dance floor is where you act; the balcony is where you finally see the pattern — who allies with whom, which topics die repeatedly, how your own behavior feeds the system.",
"Balcony questions: what's really at stake for each party? Where is the avoided issue? What is my part in maintaining what I complain about?",
"It must be scheduled: under fire, nobody drifts naturally to the balcony — book the half hour or it never happens."],
["The 90% rule: if a commitment isn't a clear yes when scored honestly, treat it as a clear no — the merely-good is what crowds out the essential.",
"Accept real trade-offs: the essentialist asks 'which problem do I want?' — the non-essentialist asks 'how can I do both?' and answers with their team's evenings.",
"The graceful no separates decision from relationship: honor the person warmly while refusing the request clearly — 'I'd love to, and to do this well I'd have to drop X; which would you prefer?'"],
["The anatomy: an Objective is significant, concrete and inspirational (the what); 3–5 Key Results are specific, time-bound and verifiable (the how you'll know) — you either hit the number or you don't.",
"Doerr's four superpowers: focus, alignment, tracking, stretch — with aspirational OKRs scored around 0.7 counting as success, because 1.0 every quarter means you aimed too low.",
"Keep OKRs divorced from compensation: the moment goals drive bonuses, people sandbag — and the stretch that makes OKRs valuable dies."],
["The output equation: a manager's output = the output of their team plus the output of the neighboring teams they influence. Your own task list is not your output.",
"High-leverage activities touch many people for a long time: training (Grove's highest-leverage act), timely decisions, information that unblocks. Negative leverage exists too: indecision, meddling, and a bad mood that cascades.",
"His discipline: audit each activity by asking how many people it affects and for how long — then deliberately shift hours up the leverage curve."],
["Discipline 1: one or two Wildly Important Goals framed 'from X to Y by when' — the whirlwind of daily urgency will devour any longer list.",
"Disciplines 2 and 3: act on lead measures (predictive and influenceable — the behaviors, not the outcomes) and keep a players' scoreboard so simple the team can tell in five seconds whether they're winning.",
"Discipline 4 is the one that makes the others work: a short weekly cadence where each person reports on last week's commitments and makes next week's — peer accountability, not manager surveillance."],
["Grove's ratio: ninety minutes of a manager's time can enhance the quality of two weeks of the employee's work — the highest-leverage meeting in the building.",
"It is the employee's meeting: their agenda, their issues, them talking 90% of the time. The manager's job is to listen, learn and coach — status updates belong in email.",
"Regularity beats duration: a reliable rhythm people can save topics for outperforms occasional marathons — and cancelling it teaches exactly one lesson about priorities."],
["The five conversations in sequence: the Mention (ten casual seconds, in the moment), the Invitation (connecting the pattern to their growth), the Conversation (the pattern now affects the team), the Boundary (explicit consequences), the Limit (the role may not be the fit).",
"Raymond's framing: accountability done early is a form of caring — the Mention is cheap for both sides; the ambush after months of silence is expensive for everyone.",
"Most managers skip stages one and two, then feel unjust at stage four — which is why they avoid accountability entirely. Start small, start today."],
["Graham's observation: managers run on hour-blocks and default to meetings; makers produce in half-day units, and one badly placed meeting destroys an afternoon of deep output that never appears on any report.",
"Newport's addition: cognitively demanding work simply cannot happen in fragments — and shallow work happily expands to fill whatever attention deep work doesn't defend.",
"Team-level defenses: shared no-meeting blocks, manager office hours (batching interruptions), async-first defaults, and the manager personally repelling encroachments on maker time."],
["Bezos's taxonomy from his shareholder letters: Type 1 decisions are one-way doors — consequential, irreversible, deserving slow deliberate process; Type 2 are two-way doors — reversible, and best made fast by the people closest to the work.",
"His warning: as organizations grow they apply heavyweight Type 1 process to everything — 'slowness, unthoughtful risk aversion, failure to experiment sufficiently, and consequently diminished invention.'",
"Pair with the 70% information rule and disagree-and-commit: decide fast, correct course cheaply, save the ceremony for genuine one-way doors."],
["The four questions: What did we expect? What actually happened? Why the difference? What will we sustain or change? Asked promptly, with rank left at the door.",
"The rules are the mechanism: everyone speaks, no blame, focus forward — the AAR grades the plan and the process, never the people.",
"Run them after successes too: unexamined success breeds superstition — you'll repeat what you did, without knowing which part worked."],
["Gawande's evidence: the WHO surgical checklist, tested across eight hospitals worldwide, cut major complications by roughly a third and deaths nearly in half — among experts who 'didn't need it'.",
"Two formats: DO-CONFIRM (work from memory, pause and verify) and READ-DO (execute item by item). Keep it to the killer items — five to nine — not everything.",
"The point isn't documentation, it's attention: the checklist handles what memory fumbles under pressure, freeing expertise for the judgment calls no checklist can make."],
["The five levels: Position (they must follow), Permission (they want to), Production (results earn credibility), People Development (you grow them), Pinnacle (your reputation grows leaders beyond your reach).",
"Levels stack — you never abandon the lower ones — and they're per-person: you can be Level 4 with a protégé and Level 1 with the new hire.",
"The turn that matters is Level 3 to 4: from producing results through people to producing people who produce results — the difference between being missed and leaving a legacy."],
["The pyramid's grammar: the governing thought (your answer) at the top, supported by a MECE set of key-line arguments, each supported by evidence — any idea at any level summarizes the group below it.",
"The SCQA opening earns attention in four sentences: Situation (what's agreed), Complication (what changed), Question (what it raises), Answer (your governing thought).",
"Order each grouping deliberately: deductively, chronologically, structurally, or by importance — randomness in ordering is what makes smart analysis read as confusion."],
["The two tests: no overlaps (mutually exclusive — nothing double-counted, no duplicated effort) and no gaps (collectively exhaustive — the buckets sum to the whole problem).",
"MECE powers hypothesis-driven work: decompose, then apply 80/20 to attack the branch most likely to matter — decomposition without prioritization is just prettier procrastination.",
"The delegation payoff: a MECE tree assigns cleanly — one owner per branch, no turf wars, no orphaned slices."],
["The seven: strategy, structure, systems (hard) and shared values, skills, style, staff (soft) — with shared values deliberately drawn at the center of the web.",
"The alignment thesis: effectiveness comes from fit among all seven; change any one and the others either move with it or pull it back.",
"The predictable failure: leaders redesign the hard three (visible, controllable) and ignore the soft four (where the change actually lives or dies)."],
["The value as stated: every consultant has an obligation — not permission — to dissent when they disagree, regardless of seniority.",
"The reframe's power: safety initiatives make speaking up allowed; obligation makes silence a professional failure — dissent becomes a duty owed to the outcome, not a personality trait.",
"The receiving condition: obligation only functions where dissent is met with gratitude — punish the first dissenter and the duty dissolves back into silence."],
["The five capabilities: meaning (anchoring in purpose and strengths), positive framing (reframing setbacks to sustain agency), connecting (reciprocal relationships and sponsors), engaging (stepping toward risk with presence), energizing (managing energy for the long haul).",
"Barsh's finding: meaning is the master capability — it amplifies the other four and correlates most with satisfaction and sustained performance.",
"Born from McKinsey's multi-year research on remarkable leaders (originating in their women's leadership work, applying broadly): each capability is trainable, and the recommended start is an energy audit plus a written meaning statement."],

function initGraph(){
  const cv=document.getElementById("gc"), tip=document.getElementById("gtip"), wrap=cv.parentElement;
  const small=window.innerWidth<=860;
  const W=wrap.clientWidth, H=small?Math.max(340,Math.min(520,window.innerHeight-190)):Math.max(520,Math.min(700,window.innerHeight-240));
  const dpr=window.devicePixelRatio||1;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+"px";
  const ctx=cv.getContext("2d");
  const nodes=[],edges=[],lmap={};
  CONCEPTS.forEach((c,ci)=>{
    const ang=ci/CONCEPTS.length*6.2832;
    nodes.push({t:"c",id:ci,label:c.n,x:W/2+Math.cos(ang)*H*0.3,y:H/2+Math.sin(ang)*H*0.3,vx:0,vy:0,r:9});
  });
  const used=new Set(); CONCEPTS.forEach(c=>c.l.forEach(i=>used.add(i)));
  [...used].sort((a,b)=>a-b).forEach(i=>{
    lmap[i]=nodes.length;
    nodes.push({t:"l",id:i,label:(i+1)+". "+D[i].t,x:W/2+(Math.random()-0.5)*W*0.85,y:H/2+(Math.random()-0.5)*H*0.85,vx:0,vy:0,r:5.5,c:MCOLORS[moduleOf(i)]});
  });
  CONCEPTS.forEach((c,ci)=>c.l.forEach(i=>edges.push([ci,lmap[i]])));
  let scale=1,tx=0,ty=0,alpha=1;
  let dragN=null,panning=false,lx=0,ly=0,moved=0,hoverN=null,selC=-1;
  function tick(){
    for(let a=0;a<nodes.length;a++){
      const na=nodes[a];
      na.vx+=(W/2-na.x)*0.0005; na.vy+=(H/2-na.y)*0.0005;
      for(let b=a+1;b<nodes.length;b++){
        const nb=nodes[b];
        let dx=na.x-nb.x,dy=na.y-nb.y,d2=dx*dx+dy*dy;
        if(d2<1)d2=1;
        if(d2<36000){
          const f=((na.t==="c"||nb.t==="c")?850:380)/d2, dd=Math.sqrt(d2);
          dx/=dd;dy/=dd;
          na.vx+=dx*f;na.vy+=dy*f;nb.vx-=dx*f;nb.vy-=dy*f;
        }
      }
    }
    edges.forEach(e=>{
      const a=nodes[e[0]],b=nodes[e[1]];
      let dx=b.x-a.x,dy=b.y-a.y;
      const d=Math.sqrt(dx*dx+dy*dy)||1, f=(d-68)*0.012;
      dx/=d;dy/=d;
      a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f;
    });
    nodes.forEach(n=>{
      if(n===dragN)return;
      n.x+=n.vx*alpha;n.y+=n.vy*alpha;n.vx*=0.85;n.vy*=0.85;
    });
  }
  function draw(){
    const ink=getComputedStyle(document.body).color;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    ctx.translate(tx,ty);ctx.scale(scale,scale);
    const dim=selC>=0;
    const selSet=dim?new Set(CONCEPTS[selC].l):null;
    edges.forEach(e=>{
      const a=nodes[e[0]],b=nodes[e[1]];
      const on=!dim||e[0]===selC;
      ctx.strokeStyle="rgba(128,128,128,"+(on?0.35:0.06)+")";
      ctx.lineWidth=(on?1:0.5)/scale;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    });
    ctx.font="600 11px Segoe UI, sans-serif";
    ctx.textAlign="center";
    nodes.forEach(n=>{
      const on=!dim||(n.t==="c"?n.id===selC:selSet.has(n.id));
      ctx.globalAlpha=on?1:0.13;
      ctx.beginPath();ctx.arc(n.x,n.y,n.r+(n===hoverN?2.5:0),0,6.2832);
      ctx.fillStyle=n.t==="c"?ink:n.c;
      ctx.fill();
      if(n.t==="c"){ctx.fillStyle=ink;ctx.fillText(n.label,n.x,n.y-n.r-6);}
      ctx.globalAlpha=1;
    });
  }
  function frame(){
    if(current!==-2||!document.getElementById("gc"))return;
    tick();draw();
    if(alpha>0.05)alpha*=0.996;
    requestAnimationFrame(frame);
  }
  function world(ev){const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left-tx)/scale,y:(ev.clientY-r.top-ty)/scale};}
  function pick(p){
    let best=null,bd=1e9;
    nodes.forEach(n=>{
      const dx=n.x-p.x,dy=n.y-p.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<Math.max(n.r+4,11/scale)&&d<bd){bd=d;best=n;}
    });
    return best;
  }
  cv.addEventListener("mousedown",ev=>{
    const p=world(ev); dragN=pick(p); panning=!dragN;
    lx=ev.clientX; ly=ev.clientY; moved=0;
  });
  cv.addEventListener("mousemove",ev=>{
    const dx=ev.clientX-lx, dy=ev.clientY-ly;
    if(dragN){const p=world(ev);dragN.x=p.x;dragN.y=p.y;dragN.vx=0;dragN.vy=0;alpha=Math.max(alpha,0.4);moved+=Math.abs(dx)+Math.abs(dy);}
    else if(panning){tx+=dx;ty+=dy;moved+=Math.abs(dx)+Math.abs(dy);}
    else{
      const n=pick(world(ev));
      hoverN=n;
      if(n){
        const r=cv.getBoundingClientRect(), wr=wrap.getBoundingClientRect();
        tip.style.display="block";
        tip.textContent=n.t==="c"?(n.label+" — "+CONCEPTS[n.id].l.length+" lessons"):(n.label+" · "+MODULES[moduleOf(n.id)].t);
        tip.style.left=Math.min(ev.clientX-wr.left+14,wrap.clientWidth-220)+"px";
        tip.style.top=(ev.clientY-wr.top+14)+"px";
        cv.style.cursor="pointer";
      }else{tip.style.display="none";cv.style.cursor="grab";}
    }
    lx=ev.clientX; ly=ev.clientY;
  });
  window.addEventListener("mouseup",()=>{
    if(current!==-2)return;
    if(moved<5){
      if(dragN&&dragN.t==="l"){show(dragN.id);return;}
      if(dragN&&dragN.t==="c"){selC=(selC===dragN.id?-1:dragN.id);}
    }
    dragN=null;panning=false;
  },{passive:true});
  cv.addEventListener("mouseleave",()=>{tip.style.display="none";hoverN=null;});
  cv.addEventListener("wheel",ev=>{
    ev.preventDefault();
    const r=cv.getBoundingClientRect(), mx=ev.clientX-r.left, my=ev.clientY-r.top;
    const f=ev.deltaY<0?1.12:1/1.12, ns=Math.min(4,Math.max(0.35,scale*f));
    tx=mx-(mx-tx)*(ns/scale); ty=my-(my-ty)*(ns/scale); scale=ns;
  },{passive:false});
  // ----- Touch support (mobile): drag / pan / tap + two-finger pinch-zoom -----
  let pinchDist=0;
  cv.addEventListener("touchstart",ev=>{
    if(ev.touches.length===1){
      const t=ev.touches[0]; dragN=pick(world(t)); panning=!dragN;
      lx=t.clientX; ly=t.clientY; moved=0;
    }else if(ev.touches.length===2){
      dragN=null; panning=false;
      const a=ev.touches[0], b=ev.touches[1];
      pinchDist=Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    }
  },{passive:false});
  cv.addEventListener("touchmove",ev=>{
    ev.preventDefault();
    if(ev.touches.length===1){
      const t=ev.touches[0], dx=t.clientX-lx, dy=t.clientY-ly;
      if(dragN){const p=world(t);dragN.x=p.x;dragN.y=p.y;dragN.vx=0;dragN.vy=0;alpha=Math.max(alpha,0.4);}
      else if(panning){tx+=dx;ty+=dy;}
      moved+=Math.abs(dx)+Math.abs(dy); lx=t.clientX; ly=t.clientY;
    }else if(ev.touches.length===2){
      const a=ev.touches[0], b=ev.touches[1];
      const nd=Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
      if(pinchDist>0){
        const r=cv.getBoundingClientRect();
        const mx=(a.clientX+b.clientX)/2-r.left, my=(a.clientY+b.clientY)/2-r.top;
        const ns=Math.min(4,Math.max(0.35,scale*(nd/pinchDist)));
        tx=mx-(mx-tx)*(ns/scale); ty=my-(my-ty)*(ns/scale); scale=ns;
      }
      pinchDist=nd; moved+=20;
    }
  },{passive:false});
  cv.addEventListener("touchend",ev=>{
    if(current!==-2)return;
    if(ev.touches.length===0){
      if(moved<8){
        if(dragN&&dragN.t==="l"){show(dragN.id);dragN=null;panning=false;pinchDist=0;return;}
        if(dragN&&dragN.t==="c"){selC=(selC===dragN.id?-1:dragN.id);}
      }
      dragN=null; panning=false; pinchDist=0;
    }
  },{passive:true});
  requestAnimationFrame(frame);
}

/* ===== State ===== */
const LS_KEY="leadership100";
let state={done:[],last:-1,open:[0]};
try{const s=JSON.parse(localStorage.getItem(LS_KEY)); if(s&&Array.isArray(s.done)) state=Object.assign(state,s);}catch(e){}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}
let current=-1; // -1 = home

/* ===== Sidebar ===== */
function toggleNav(){document.body.classList.toggle('nav-open');}
function closeNav(){document.body.classList.remove('nav-open');}
function buildNav(){
  const nav=document.getElementById("modnav");
  let h="";
  for(let m=0;m<MODULES.length;m++){
    const open=state.open.includes(m)?" open":"";
    const doneCount=D.slice(m*10,m*10+10).filter((_,i)=>state.done.includes(m*10+i)).length;
    h+='<div class="mod'+open+'" id="mod'+m+'">';
    h+='<button class="mod-head" onclick="toggleMod('+m+')"><span class="mod-num">'+(m+1)+'</span><span class="mod-title">'+MODULES[m].t+'</span><span class="mod-count" id="mc'+m+'">'+doneCount+'/'+modCount(m)+'</span><span class="chev">&#9654;</span></button>';
    h+='<div class="mod-list">';
    for(let i=m*10;i<m*10+10&&i<D.length;i++){
      const cls=(state.done.includes(i)?" done":"")+(i===current?" active":"");
      h+='<div class="lesson-link'+cls+'" id="ll'+i+'" onclick="show('+i+')"><span class="no">'+(i+1)+'</span><span>'+D[i].t+'</span><span class="tick">&#10003;</span></div>';
    }
    h+='</div></div>';
  }
  nav.innerHTML=h;
}
function toggleMod(m){
  const el=document.getElementById("mod"+m);
  el.classList.toggle("open");
  if(el.classList.contains("open")){if(!state.open.includes(m))state.open.push(m);}
  else{state.open=state.open.filter(x=>x!==m);}
  save();
}
function updateProgress(){
  const n=state.done.length;
  document.getElementById("pfill").style.width=(n/D.length*100)+"%";
  document.getElementById("plabel").textContent=n+" of "+D.length+" complete";
  for(let m=0;m<MODULES.length;m++){
    const dc=D.slice(m*10,m*10+10).filter((_,i)=>state.done.includes(m*10+i)).length;
    const el=document.getElementById("mc"+m); if(el)el.textContent=dc+"/"+modCount(m);
  }
}

/* ===== Views ===== */
function goHome(){
  current=-1; closeNav();
  const main=document.getElementById("main");
  let cards="";
  for(let m=0;m<MODULES.length;m++){
    const dc=D.slice(m*10,m*10+10).filter((_,i)=>state.done.includes(m*10+i)).length;
    cards+='<div class="mod-card" onclick="openModule('+m+')"><div class="mnum">MODULE '+(m+1)+'</div><h3>'+MODULES[m].t+'</h3><p>'+MODULES[m].d+'</p><div class="mini"><i style="width:'+(dc/modCount(m)*100)+'%"></i></div></div>';
  }
  cards+='<div class="mod-card" onclick="showGraph()"><div class="mnum">&#128376; EXPLORE</div><h3>Knowledge Graph</h3><p>An interactive map of how the ideas, coaches and concepts connect across modules.</p></div>';
  main.innerHTML=
   '<div class="hero"><div class="eyebrow">100 lessons &middot; 2 minutes each</div>'+
   '<h2>Build a team environment that delivers.</h2>'+
   '<p>One hundred bite-size lessons for managers — plus a bonus McKinsey toolkit — distilled from the world&rsquo;s most influential leadership coaches, researchers and practitioners. Each lesson gives you one core idea, one thing to try today, and two questions to sit with.</p></div>'+
   '<div class="mod-grid">'+cards+'</div>'+
   '<div class="howto"><h3>How to use this</h3><ul>'+
   '<li><b>One a day.</b> Read a lesson each morning — 100 working days to a stronger team.</li>'+
   '<li><b>Do the &ldquo;Try this today&rdquo;.</b> The action is the lesson; reading is just the trigger.</li>'+
   '<li><b>Mark lessons complete</b> to track progress (saved in your browser).</li>'+
   '<li><b>Navigate</b> with the sidebar, search, or <kbd>&larr;</kbd>/<kbd>&rarr;</kbd> arrow keys.</li>'+
   '<li><b>Explore the knowledge graph</b> to see how ideas connect across coaches and modules.</li>'+
   '</ul></div>'+
   '<p class="credit">Ideas are paraphrased summaries drawing on the published work of the named coaches, authors and researchers — including Marshall Goldsmith, Bren&eacute; Brown, Amy Edmondson, Patrick Lencioni, Kim Scott, Michael Bungay Stanier, Liz Wiseman, Andy Grove, Stephen Covey, Daniel Pink, Simon Sinek, John Doerr and many others, plus frameworks originating at McKinsey &amp; Company. For depth, read the original books cited in each lesson.</p>';
  buildNav(); updateProgress(); window.scrollTo(0,0);
}
function openModule(m){
  if(!state.open.includes(m)){state.open.push(m);save();}
  show(m*10);
}
function show(i){
  if(i<0||i>=D.length)return;
  current=i; state.last=i; save(); closeNav();
  const L=D[i], m=moduleOf(i);
  const isDone=state.done.includes(i);
  const main=document.getElementById("main");
  main.innerHTML=
   '<div class="crumb"><a onclick="goHome()" style="cursor:pointer">Home</a> &rsaquo; <b>Module '+(m+1)+': '+MODULES[m].t+'</b> &rsaquo; Lesson '+(i+1)+' of '+D.length+'</div>'+
   '<div class="card">'+
   '<div class="lesson-no">Lesson '+(i+1)+'</div>'+
   '<h2>'+L.t+'</h2>'+
   '<div class="source-chip">'+L.w+'</div>'+
   '<p class="idea">'+L.i+'</p>'+
   (X[i]?'<ul class="xp">'+X[i].map(b=>'<li>'+b+'</li>').join('')+'</ul>':'')+
   '<div class="block"><h4>Try this today</h4><p>'+L.a+'</p></div>'+
   '<div class="block reflect"><h4>Reflect</h4><p>'+L.r+'</p>'+(R2[i]?'<p style="margin-top:.5rem">'+R2[i]+'</p>':'')+'</div>'+
   (REFS[i]?'<div class="block refs"><h4>References &amp; going deeper</h4><p>'+REFS[i].map(r=>'<a class="rlink" href="'+r[1]+'" target="_blank" rel="noopener">'+r[0]+'</a>').join('')+'</p></div>':'')+
   '<div class="card-actions"><button class="btn '+(isDone?"done-state":"primary")+'" onclick="toggleDone('+i+')">'+(isDone?"&#10003; Completed":"Mark complete")+'</button></div>'+
   '</div>'+
   '<div class="nav-row">'+
   (i>0?'<button class="btn" onclick="show('+(i-1)+')">&larr; '+(i)+'. '+D[i-1].t+'</button>':'<span></span>')+
   (i<D.length-1?'<button class="btn" onclick="show('+(i+1)+')">'+(i+2)+'. '+D[i+1].t+' &rarr;</button>':'<button class="btn" onclick="goHome()">Finish &rarr; Overview</button>')+
   '</div>'+
   '<div class="kbd-hint">Tip: use <kbd>&larr;</kbd> and <kbd>&rarr;</kbd> to move between lessons</div>';
  buildNav(); updateProgress(); window.scrollTo(0,0);
  const ll=document.getElementById("ll"+i); if(ll)ll.scrollIntoView({block:"nearest"});
}
function toggleDone(i){
  if(state.done.includes(i)) state.done=state.done.filter(x=>x!==i);
  else state.done.push(i);
  save(); show(i);
}

/* ===== Search ===== */
function doSearch(q){
  q=q.trim().toLowerCase();
  if(!q){ if(current>=0)show(current); else goHome(); return; }
  const main=document.getElementById("main");
  const hits=[];
  D.forEach((L,i)=>{
    if((L.t+" "+L.w+" "+L.i).toLowerCase().includes(q)) hits.push(i);
  });
  let h='<div class="results"><h3>'+hits.length+' lesson'+(hits.length===1?"":"s")+' matching &ldquo;'+q.replace(/</g,"&lt;")+'&rdquo;</h3>';
  hits.forEach(i=>{
    h+='<div class="result-item" onclick="document.getElementById(\'search\').value=\'\';show('+i+')"><b>'+(i+1)+'. '+D[i].t+'</b><small>'+D[i].w+' &middot; Module '+(moduleOf(i)+1)+': '+MODULES[moduleOf(i)].t+'</small></div>';
  });
  h+='</div>';
  main.innerHTML=h;
}

/* ===== Keyboard ===== */
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(e.key==="ArrowRight"&&current<D.length-1)show(current<0?0:current+1);
  if(e.key==="ArrowLeft"&&current>0)show(current-1);
});

/* ===== Init ===== */
buildNav();
goHome();
const hm=location.hash.match(/^#l(\d+)$/);
if(hm){const hn=parseInt(hm[1],10)-1; if(hn>=0&&hn<D.length)show(hn);}
</script>
