i:"Kahneman, asked what single practice would most improve decisions, answered: a decision journal. At the moment of each significant call, record the situation, the options, what you expect to happen and with what probability, and how you feel. The entry does nothing today — its value matures: reviewed a year later, it defeats hindsight bias (you cannot rewrite what you actually predicted), separates decision quality from outcome luck, and reveals your personal patterns — the over-optimism, the pet weightings, the moods — that no amount of in-the-moment vigilance can see.",
a:"Start today with a simple template: date, decision, options considered, expected outcome with rough probability, feelings. Two minutes per significant decision. Calendar a six-month review of the entries.",
p:"Judging past decisions by outcomes alone. A good decision can lose and a reckless one can win — the journal exists precisely to keep those separate.",
L:[5,97]},
{t:"The Advice Process",w:"Frédéric Laloux — Reinventing Organizations",
i:"Neither top-down nor consensus: in the advice process, any person can make any decision — after seeking advice from everyone meaningfully affected and everyone with relevant expertise. The advice must be sought and genuinely considered; it doesn't have to be followed. Laloux documents organizations of thousands running on this rule. The effect is double: decisions land near the information (the decider is usually the person closest to the issue), while the consultation ring catches blind spots and builds commitment. Ownership stays singular; wisdom gets pooled.",
a:"Delegate one real decision this month under the explicit rule: 'It's your call, after you've sought advice from X, Y, and anyone it materially affects.' Then hold yourself to the hard part — not overriding the call.",
p:"Advice-washing: seeking input with the decision already made, or the manager 'advising' in a tone that is really deciding. Both teach people the process is theater.",
L:[55,58]},
/* Module 10 — Communicate & Execute Decisions */
{t:"Write the Decision Memo",w:"Amazon practice; Barbara Minto",
i:"Amazon famously banned slide decks from serious decisions: proposals arrive as a written narrative memo, read by everyone in silence for the meeting's first twenty minutes, then discussed. Writing forces what bullets hide — complete reasoning, explicit assumptions, honest handling of counterarguments — and silent reading puts fast and slow readers, extroverts and introverts, on equal footing. Structure it Minto-style: the recommendation first, then the reasoning, the alternatives considered, the risks, and what would change your mind.",
a:"For your next significant proposal, write two pages of prose instead of a deck: answer first, alternatives honestly weighed, risks named. Open the meeting with ten silent reading minutes. Watch the discussion quality change.",
p:"Narrative theater — beautiful prose around a predetermined conclusion. The 'alternatives considered' section is where readers check if you actually thought or just decorated.",
L:[75,100]},
{t:"Three Options, One Recommendation",w:"Staff-work practice",
i:"Bringing decision-makers a single option invites a binary trap — yes or no to your idea, with 'no' sending everyone back to the start. Bringing options without a view abdicates your expertise. The professional format is both: three genuinely distinct options (not one real one flanked by a strawman and a fantasy), each with honest costs and risks, plus your clear recommendation and reasoning. It respects the decision-maker's authority while doing the analytical labor that authority can't do — and it's how a middle manager teaches leadership to trust their judgment.",
a:"Next time you take a decision upward, structure the page as Options A/B/C with trade-offs, then 'I recommend B because…'. Make each option something a reasonable person could actually choose.",
p:"The strawman sandwich — two fake options escorting your favorite. Decision-makers detect it fast, and it converts your recommendation from judgment into manipulation.",
L:[32,100]},
{t:"Commander's Intent",w:"Military doctrine; popularized by the Heath brothers",
i:"No plan survives contact with reality — so the military pairs every plan with commander's intent: a crisp statement of the end state and its purpose that remains true when the plan's steps stop making sense. 'Secure the bridge by dawn so the division can cross' lets a sergeant improvise when the route is blocked; 'follow steps 1 through 9' does not. For managers, intent is what makes delegation robust: when the unexpected hits and you're unreachable, people aligned on intent adapt; people aligned on tasks freeze or escalate.",
a:"Add one sentence to every assignment this week: 'No matter what happens, achieve ___ because ___.' Test it: could the person make three good improvised calls from that sentence alone?",
p:"Intent so abstract it excuses anything ('deliver value'). Good intent names a concrete end state and its reason — specific enough to steer, short enough to remember under stress.",
L:[58,64]},
{t:"Decision Records",w:"Architecture Decision Records — Michael Nygard, generalized",
i:"Software teams write ADRs — short documents capturing each significant decision: the context at the time, the options considered, the choice, and its accepted consequences. The practice generalizes to any team. Six months later, when someone asks 'why on earth do we do it this way?', the record answers — preventing both blind inheritance (following a decision whose reasons died) and thrashing (relitigating settled questions every time membership changes). The record also disciplines the present: a decision you can't write down crisply usually isn't finished being made.",
a:"Start a simple decision log for your team: one short entry per significant call — date, context, options, decision, consequences accepted. Store it where newcomers onboard. Backfill the five decisions people most often question.",
p:"Records as advocacy — writing the winning case and omitting the road not taken. The rejected options and accepted downsides are the parts future readers need most.",
L:[27,97]},
{t:"The Stakeholder Communication Plan",w:"Change management practice",
i:"A decision nobody heard about correctly is a decision that didn't happen. The communication plan is a simple grid built from your stakeholder map: for each audience — team, peers, leadership, affected outsiders — what do they need to know, what do they care about (which is not the same thing), when should they hear it, through which channel, and from whose mouth? Sequence matters enormously: the people most affected should never learn from the general announcement, and your boss should never learn from their boss.",
a:"Before announcing your next significant decision, spend twenty minutes on the grid: audience × message × timing × channel × messenger. Walk the sequence once, checking who could be blindsided — then fix that row first.",
p:"One message for all audiences. The engineering team and the steering committee need different framings of the same truth — different emphasis, never different facts.",
L:[83,27]},
{t:"Ride the Change Curve",w:"Elisabeth Kübler-Ross, adapted for organizations",
i:"Announcements are events; acceptance is a process. The adapted change curve maps the emotional journey a significant decision triggers: shock, denial ('this won't really happen'), frustration and its politics, a dip of low mood and productivity, then experimentation, decision, and integration. The managerial errors are symmetrical: mistaking early silence for acceptance (it's usually shock), and punishing the frustration phase as disloyalty (it's usually processing). Different phases need different leadership — information early, listening in the dip, coaching and quick wins in the climb.",
a:"For a change your team is absorbing, honestly place each person on the curve — they will be at different points. Match your next conversation to their phase: facts for denial, ears for frustration, small wins for experiment.",
p:"Announcing once and managing as if everyone reached acceptance with you. You've had weeks to process what they've had minutes to hear — you are on different points of the same curve.",
L:[85,86]},
{t:"The 30-60-90 Plan",w:"Execution planning practice",
i:"Decisions die in the gap between 'we agreed' and 'nothing changed'. The 30-60-90 closes it with three horizons of explicit commitments: by day 30, the visible first moves and early wins (momentum and proof of seriousness); by day 60, the structural changes bedded in; by day 90, the measurable outcomes and the review. Its psychology matters as much as its planning: the 30-day column converts an abstract decision into next week's named actions, and the built-in day-90 review makes course correction a scheduled event instead of an admission of failure.",
a:"For the decision you just made, write the three columns with owners and dates — and put the day-90 review in calendars now, before execution begins. Publish the day-30 commitments to everyone affected.",
p:"Backloading everything to day 90. If day 30 contains nothing visible, the organization concludes — correctly — that nothing is actually happening.",
L:[61]},
{t:"Driver Trees",w:"KPI decomposition practice",
i:"A goal metric your team can't directly move is a wish; a driver tree turns it into levers. Decompose the outcome mathematically or logically — retention splits into new-user and mature-user retention; cost per case into volume, handling time, and rate — and keep splitting until you reach drivers your team actually influences this week. The tree does double duty: it focuses effort on the branches with the most headroom, and it explains to every team member exactly how their daily work connects to the number leadership watches.",
a:"Take your team's headline metric and draw its tree down to weekly-influenceable drivers. Mark which branch each current initiative targets — initiatives pointing at no branch are your first cut candidates.",
p:"Trees that decompose beautifully into drivers nobody owns. Every leaf needs a name next to it or the tree is just prettier confusion.",
L:[90,92]},
{t:"Leading vs Lagging Indicators",w:"Performance measurement practice",
i:"Lagging indicators — quarterly results, annual engagement, customer churn — score a game already played; by the time they move, the causes are months old. Leading indicators are the influenceable behaviors and conditions that predict them: proposals submitted, cycle time, one-on-ones actually held, early usage. The managerial discipline is running the week on leading indicators while validating the causal link with lagging ones — because a team managed only on lagging measures is driving by the rear-view mirror, and a team on unvalidated leading measures may be optimizing superstition.",
a:"For each lagging outcome you report upward, define one or two leading indicators your team can move this week — and review them weekly. Twice a year, check the correlation: do your leaders actually predict your laggers?",
p:"Leading indicators becoming targets and getting gamed (Goodhart's law). Watch the behavior, not just the number, and rotate measures that have stopped meaning anything.",
L:[92]},
{t:"Retrospectives That Actually Change Things",w:"Agile practice — Derby & Larsen",
i:"The retrospective is the team's PDCA on itself: at a regular cadence, examine how we worked — not just what we produced — and commit to one improvement. Formats keep it fresh (start/stop/continue; the 4 Ls — loved, learned, lacked, longed for; the sailboat's winds and anchors), but format is the least important part. What separates retros that compound from retros that decay: psychological safety to name the real issue, one improvement chosen (not seven), with an owner and a date, and — the acid test — last retro's action reviewed first. A retro whose actions evaporate teaches cynicism on a schedule.",
a:"Institute or repair a monthly team retro: 45 minutes, rotate formats, and open every session by reviewing what happened to the previous action. One committed change per retro, owned and dated.",
p:"Retro as complaint ritual. If the same issue appears three times without action, the problem is no longer the issue — it's the retro, and everyone knows it.",
L:[97,79]},

{t:"The Meta-Decision: Choosing Your Tool",w:"This toolkit's closing discipline",
i:"One hundred tools, and the quiet skill that governs them all: deciding how much deciding a decision deserves. Size it on three dimensions — stakes (what's truly at risk), reversibility (can we course-correct cheaply), and clarity (is this a Clear, Complicated, or Complex problem in Cynefin's terms). Low stakes and reversible: decide now, bare-handed — a framework would cost more than an error. High stakes, irreversible, complex: now the premortems, outside views, red teams and decision memos earn their keep. The tool serves the decision, never the reverse — a manager who runs a weighted matrix on lunch and gut-feel on a restructuring has the whole kit upside down. And when in doubt, remember what every tool here is ultimately for: not certainty — which is never on offer — but decisions your team can understand, challenge, commit to, and learn from.",
a:"Put three questions on a sticky note where you decide: What's at stake? Can we reverse it? Do we understand causes here? Let the answers pick the tool — including, often, no tool at all.",
p:"Toolkit maximalism. A fool with a tool is still a fool, and a manager who frameworks everything is hiding from judgment. The tools sharpen thinking; they don't replace it.",
L:[87,91,96]},

["Shewhart's control thinking: every process has natural variation within limits; points inside the band are 'common cause' (the system talking), points outside or in runs are 'special cause' (something changed).",
"Deming's red bead experiment made the management lesson vivid: workers produce defects at rates the system dictates — praising Tuesday's numbers and interrogating Thursday's is managing noise.",
"Two different responses, never confused: special cause → investigate the event; common cause → improve the system. Tampering (adjusting after every point) makes variation worse."],
["Log format that works: 15-minute blocks, activity, interruptions (source and duration), systems touched, waiting time — plus the person's own commentary on friction.",
"Typical findings: interruption every 6–12 minutes, three systems where one was assumed, an hour of daily work that exists because of a decision nobody remembers making.",
"Consent and framing are everything: shadow as a student ('teach me your day'), share the log with the person first, and act on the friction they most want gone."],
["The four steps sharpened: Plan includes a written prediction; Do means small-scale first; Check compares result against the prediction (not against hope); Act means adopt, adjust, or abandon — explicitly.",
"The prediction is the learning engine: without it, any result can be rationalized afterward — surprise is only measurable against a stated expectation.",
"Cycle speed beats cycle size: four two-week cycles teach more than one eight-week rollout, and each cycle's Act feeds the next cycle's Plan."],
["The quadrant actions: Q1 urgent-important — do now; Q2 important-not-urgent — schedule and defend; Q3 urgent-not-important — delegate or renegotiate; Q4 — delete without guilt.",
"Q3 is the deceptive quadrant: it feels productive because it's urgent and involves other people — but it's their priority wearing your calendar.",
"A crowded Q1 diagnoses upstream neglect: today's crises are mostly last quarter's unscheduled Q2 — the matrix is also a mirror."],
["The four quadrant names: Quick Wins (do first — momentum and credibility), Major Projects (plan properly), Fill-ins (slack-time only), Thankless Tasks (kill publicly).",
"Run it as a group exercise: the placement arguments surface hidden assumptions about both value and cost — that conversation is worth more than the final chart.",
"Re-estimate after the first quick win: effort estimates made from a distance are systematically optimistic; recalibrate the board with real data."],
["The definitions with teeth: Must = the delivery fails without it (test: would we cancel the release?); Should = painful to omit but survivable; Could = nice; Won't = explicitly not this time, in writing.",
"The 60% rule: Musts should consume no more than ~60% of capacity — the buffer is what makes the Musts actually safe.",
"Publish the Won't list with equal prominence: it's the tool's entire value — expectations managed before work starts instead of apologized for after."],
["The formula: Reach × Impact × Confidence ÷ Effort — with Impact on a simple scale (0.25 minimal to 3 massive) and Confidence as an honesty tax (100% / 80% / 50%).",
"Confidence is the anti-politics term: the pet project backed by anecdote scores 50% and sinks; the small bet backed by data scores 100% and rises.",
"Use scores to structure dissent, not end it: an override is fine — but the overrider must name which input they dispute, which converts lobbying into evidence discussion."],
["The sequence that protects honesty: agree criteria first, weight them second, score options last — weights set after seeing scores are just rationalization with arithmetic.",
"Score independently before comparing: group scoring anchors on the first voice; independent scores surface the disagreements worth discussing.",
"Read the gaps, not just the totals: two options one point apart are tied — but a criterion where scorers split 5-versus-1 is hiding information someone has and others don't."],
["The three factor types: Basic (expected — absence infuriates, presence is invisible), Performance (more is linearly better), Delighters (unexpected — absence costs nothing, presence charms).",
"The decay law: delighters migrate to basics over time — yesterday's wow (same-day response) becomes today's expectation. The map must be redrawn periodically.",
"Investment rules that follow: never fund delighters while a basic is broken; stop polishing basics past adequacy (no one applauds a login that works extra well)."],
["Reinertsen's provocation: most organizations can state a project's cost to the dollar and its cost of delay not at all — yet delay cost varies across projects by orders of magnitude.",
"WSJF in practice: score cost-of-delay (value + urgency + risk reduction) divided by duration — small urgent valuable items jump the queue; big vague ones wait until sliced smaller.",
"Watch for delay-cost cliffs: regulatory dates, event deadlines and contract windows aren't linear — flag cliff items separately from the smooth-cost queue."],
["The economist's definition: the cost of any choice is the value of the best forgone alternative — not the money spent, but the option killed.",
"The managerial failure mode: evaluating requests in isolation ('is this worthwhile?') — almost everything clears that bar; almost nothing clears 'better than what it displaces'.",
"Audit standing commitments annually: recurring meetings, reports and rituals passed the opportunity-cost test once, years ago, against a different alternative set."],
["The mechanism: goals 6 through 25 are the dangerous ones precisely because they're good — attractive enough to justify time, minor enough never to matter.",
"'Avoid at all costs' is literal: the twenty get no 'spare time', no keeping-warm effort, no 10% — because attention leaks compound.",
"Team version: list all current initiatives, circle five, and write the rest on a visible 'Not now, on purpose' list — revisit quarterly, not weekly."],
["Drucker's original discipline: record time as it's spent (not from memory — memory flatters), consolidate the record into categories, then act on what the record shows.",
"Categories that reveal: firefighting, meetings-by-habit, coaching, planning, deep work, upward reporting — percentage each, then compare against what your role is supposed to be for.",
"The structural fix beats the resolution: don't vow to 'spend more time coaching' — put a standing block on the calendar and delegate the meeting that displaced it."],
["The four domains and their methods: Clear — sense, categorize, respond (apply best practice); Complicated — sense, analyze, respond (experts); Complex — probe, sense, respond (experiments); Chaotic — act, sense, respond (stabilize first).",
"The diagnostic tell for Complex: plausible-sounding expert predictions keep being wrong, and every intervention produces surprises — cause and effect visible only in hindsight.",
"The domain border matters most: treating complex as complicated (analysis instead of probes) is the costliest routine error in management — you cannot interview your way to what only an experiment reveals."],
["Boyd's real emphasis was Orient: the filter of culture, experience and assumptions through which observation passes — two managers observe the same data and orient to different realities.",
"Tempo as strategy: cycling the loop faster than the situation changes keeps you acting on current reality; slow loops mean fighting the previous war.",
"Audit your orientation deliberately: list the assumptions your interpretation rests on and ask which observation would falsify each — orientation unexamined becomes dogma."],
["The grammar: squares for decisions (you choose), circles for chance (reality chooses), probabilities on branches, values on leaves — multiply back to compare options.",
"Its quiet gift is exposing dominated options: choices worse in every branch — surprisingly common once drawn, invisible in discussion.",
"Respect ruin: expected value assumes you survive to play again; for bets you can't afford to lose, the worst branch matters more than the average."],
["Marks's test of second-level thinking: 'what does everyone believe, and what do they miss?' — first-order conclusions are consensus; the edge is in the consequences of consequences.",
"Management's classic second-order traps: the metric that optimizes behavior into absurdity (Goodhart), the rescue that teaches helplessness, the freeze that saves cash and spends people.",
"The third column question — 'what does this teach people to expect from me?' — catches the precedent effects that first-order analysis never sees."],
["DACI's roles: Driver (runs the process, herds the inputs), Approver (one person, makes the call), Contributors (consulted for expertise), Informed (told after). RAPID adds a crucial split: Recommend and Decide are different jobs.",
"The single-Approver rule is load-bearing: 'joint approval' means the real decision happens in a hallway later, or never.",
"Publish the DACI before the debate: naming roles after positions form converts a process question into a power struggle."],
["Vroom and Yetton's five styles: decide alone; decide after individual input; decide after group input; facilitate group consensus; delegate entirely — chosen per decision, not per personality.",
"The choosing variables: quality stakes, your information versus theirs, commitment needed, time available, team alignment — high commitment-need plus low manager-information pushes toward the participative end.",
"The cardinal sin is fake participation: asking for input after deciding. People forgive 'I decided'; they don't forgive being polled as theater."],
["The six hats: White (facts and gaps), Red (feelings, stated without justification), Black (risks — the most valuable and most overused hat), Yellow (benefits), Green (alternatives), Blue (process control).",
"Parallel thinking is the mechanism: everyone wears the same hat simultaneously, so the skeptic and the optimist stop colliding and start taking turns — critique becomes a phase, not a person.",
"Sequence to fit the task: for evaluating a proposal, try Blue-White-Yellow-Black-Green-Red-Blue; for a stuck problem, lead with Green earlier."],
["Klein's framing: 'prospective hindsight' — assuming the failure has already happened — measurably increases the ability to identify causes, compared with asking 'what might go wrong?'",
"The silent-writing step is essential: independent written failure stories prevent anchoring on the first loud voice and give the pessimists cover to be specific.",
"Harvest into the plan visibly: cluster causes, pick the top three, assign mitigations with owners — a premortem whose findings vanish teaches the team it was theater."],
["The quadrant plays: low stakes + reversible — decide now, delegate permanently; high stakes + reversible — decide fast, instrument, be ready to reverse; low stakes + irreversible — brief pause; high stakes + irreversible — full process.",
"Reversibility is about more than money: decisions touching trust, reputation and careers are one-way more often than their price tags suggest.",
"The delegation dividend: the low-stakes/reversible box, delegated with the matrix as the rule, removes most of a manager's decision queue overnight."],
["Simon's insight (bounded rationality): perfect optimization is impossible in principle — information, time and cognition are all bounded, so the question is where to spend scarce deliberation.",
"Schwartz's psychology: maximizers achieve slightly better outcomes and feel considerably worse about them — regret, comparison and rumination eat the gains.",
"The practical craft: write 'good enough' criteria before looking at options, take the first clear pass, and reserve maximizing for the few genuinely irreversible calls."],
["The four villains and counters: narrow framing → Widen options; confirmation bias → Reality-test assumptions; short-term emotion → Attain distance; overconfidence → Prepare to be wrong.",
"Widening tricks: the vanishing-options test ('if these choices disappeared, what would we do?'), and-not-or thinking, and finding someone who's solved your problem before.",
"Preparing to be wrong is engineering, not pessimism: set tripwires (dates, thresholds) that force reconsideration — autopilot is how mediocre decisions become old ones."],
["Jacobi's maxim, Munger's application: many hard problems are easier solved backward — instead of engineering success, enumerate the guaranteed causes of failure and avoid them.",
"Why it works: the brain's optimism filters block failure-thinking in forward mode; the inverted question ('how would we destroy morale by June?') slips past them and gets specific fast.",
"The audit step is the payoff: half the failure-guarantee list is usually already happening — stopping two of them beats most improvement initiatives."],
["The three horizons pull apart what emotion fuses: 10 minutes (the current discomfort's vote), 10 months (consequences and relationships), 10 years (character and pattern).",
"Its highest-value moments: the angry email, the avoided conversation, the pressure to cave — anywhere the ten-minute self is about to outvote the other two.",
"It cuts both ways: distance sometimes counsels restraint, and sometimes reveals that the bold move you're avoiding is the one your ten-year self needs."],
["Kahneman's planning-fallacy mechanism: the inside view constructs a best-case story from your project's particulars; base rates from similar projects are the antidote your optimism resists.",
"Flyvbjerg's data: across thousands of projects, cost overruns and benefit shortfalls are the norm, not the exception — and 'we're different' is what every overrunning project believed.",
"The method: define the reference class, get its distribution (durations, overruns), anchor there, then adjust modestly — and only with evidence — for genuine differences."],
["The tasking is what distinguishes it from 'feedback welcome': red teamers are assigned to win — to find the break — with explicit permission to be ruthless and no penalty for success.",
"Keep advocates and attackers separate: the plan's authors listen silently during the attack; defending in real time converts scrutiny back into debate.",
"Present the attack upward with the plan: decision-makers trust proposals that show their own stress-test — surviving a red team is a credential."],
["Rapoport's rules (via Dennett): restate their position until they say 'exactly'; list points of agreement; name what you learned from them — only then criticize.",
"The double payoff: opponents become collaborators (people hear criticism only after being heard), and you're protected from confidently demolishing an argument nobody made.",
"The confirmation test is non-negotiable: your summary counts only when they endorse it — a summary they'd amend is still a strawman with better manners."],
["Kahneman and Tversky's finding: given a vivid individual story, people ignore the statistical background almost completely — representativeness beats frequency in intuition every time.",
"The discipline is sequencing: get the boring denominator ('how do these usually go?') before the exciting numerator (this candidate, this vendor, this plan) gets to vote.",
"Base rates guide, not veto: a 20% success rate doesn't forbid the attempt — it defines what evidence of being exceptional should look like before you commit."],
["Duke's core insight from poker: quitting on time usually feels too early — by the time quitting feels right, you've overpaid. Kill criteria correct the feel with pre-commitment.",
"Write them as signal + date: 'if adoption is below X by March 31, we hold a formal continue/kill review' — measurable trigger, named ritual, no ambush.",
"The identity trick: the criteria are instructions from a smarter, uninvested version of you — honoring them is self-trust, not defeat."],
["Bezos's version: project yourself to age eighty and ask which choice you'd regret — trying and failing, or never trying. He credits the frame for the decision to start Amazon.",
"Why distance works: close-up, the costs are vivid (awkwardness, risk, others' opinions) and the values are abstract; at eighty, the weights reverse.",
"Its jurisdiction is narrow: life-shaping doors — career moves, bold commitments, hard conversations that define relationships. Everyday calls deserve faster tools."],
["Kahneman's noise finding: the same professional, given the same case on different days, decides differently — and organizations are full of this scatter while everyone believes themselves consistent.",
"Hygiene practices: HALT (no consequential calls hungry, angry, lonely, tired), decompose judgments into dimensions scored separately, collect independent views before discussion, decide important things at your best hour.",
"Aggregate when it matters: averaging several independent judgments cancels noise almost mechanically — cheap wisdom most managers never collect."],
["Define the scales numerically before plotting: 'likely' spans 30–80% across people unless pinned; 'severe' needs an anchor ('threatens the quarter's objective').",
"The matrix's real product is the argument: two informed people disputing a cell are exchanging exactly the information the team needs — the color is just the receipt.",
"Beware the tidy-grid illusion: risks interact (two ambers can combine into a red), and the grid can't show it — close every session asking 'which of these amplify each other?'"],
["The entry grammar: cause → event → consequence ('because vendor X is single-source [cause], a delivery failure [event] would halt the release [consequence]') — vague entries make vague mitigations.",
"One owner per risk, no exceptions: shared risks are orphaned risks; the owner drives mitigation and reports movement.",
"Keep it to ten and keep it moving: a standing ten-minute agenda slot — what moved, what's new, what retires — is the difference between a register and a museum."],
["The method: vary each key assumption across its plausible range, hold others constant, and rank the outcome swings — the 'tornado' chart's widest bars are your diligence budget.",
"The usual discovery: two or three assumptions dominate everything; most of the model's precision is decoration around them.",
"Test combinations too: plans usually die from two mildly-wrong assumptions compounding, not one dramatically wrong one — check the plausible worst pair."],
["Powell's arithmetic: under 40% of the needed information is gambling; over 70% means the opportunity has usually moved — the zone between is where leaders earn their pay.",
"Information has a cost curve: each additional certainty percentage costs more time than the last, while its decision value shrinks — waiting is rarely neutral.",
"The honest self-question: is the remaining uncertainty actually resolvable by waiting — or am I just waiting for the anxiety to pass? Only the first justifies delay."],
["Design requirements per probe: bounded cost (cheap enough to kill without a meeting), a defined signal to watch, and failure that teaches rather than damages.",
"Run them in parallel, not sequence: a single pilot becomes a flagship that must succeed; a portfolio of three keeps everyone honest because some are expected to die.",
"The follow-through verbs: amplify what showed promise, dampen what didn't — resisting the urge to 'fix' every dying probe, which converts experiments back into commitments."],
["Gollwitzer's research: if-then plans ('implementation intentions') dramatically raise follow-through, because the response is pre-loaded and retrieved under stress instead of improvised.",
"A trigger must be inarguable: 'if churn exceeds 5% in any month' fires cleanly; 'if things deteriorate' fires never, or in the retrospective.",
"Pre-agreement removes the political cost: invoking a contingency everyone signed in calm is administration; proposing it mid-crisis is an accusation."],
["The allocation logic: 70% core (funds everything), 20% adjacent (extends the core), 10% transformational (replaces the core someday) — a survival portfolio, not a creativity quota.",
"The audit usually shocks: teams that 'innovate constantly' measure out at 95-5-0 — the whirlwind silently reclaims every unprotected hour.",
"Protect the 10% structurally: a named half-day, a named person, a thesis and a sunset date — bets need governance precisely because they can't show quarterly results."],
["The three points: optimistic, most likely, pessimistic — and PERT's weighted estimate (O + 4M + P) ÷ 6 if you need one number back.",
"The spread is the signal: 5–6–8 and 3–6–16 'average' the same and are utterly different risks — buffers and checkpoints belong where the ranges gape.",
"Interrogate the pessimistic tail respectfully: 'what makes 16 weeks possible?' surfaces the dependency or unknown that point estimates were hiding."],
["The real-options frame: an uncertain decision is worth splitting into a small information purchase now and the real commitment later — if the information genuinely changes the call.",
"The design question: what is the cheapest, fastest probe of the assumption I'm least sure of? A reference call, a mockup, a one-week trial — days, not quarters.",
"Respect the last responsible moment: delay buys information only until the option expires — decide before waiting itself becomes the choice."],
["The four quadrants' strategies: known knowns — verify anyway (assumed facts rot); known unknowns — close or hedge the named gaps; unknown knowns — ask your own organization; unknown unknowns — buy resilience, not predictions.",
"The cheapest quadrant is unknown knowns: someone in your organization has done this before, and nobody asked — one hour of asking veterans routinely saves months.",
"For true surprises, prediction is the wrong spend: buffers, reversibility, and early-warning tripwires protect against categories of shock you can't enumerate."],
["The mechanics: independent anonymous answers, facilitator summarizes the distribution with reasons, everyone revises in round two — repeat until stable, usually two or three rounds.",
"What the anonymity buys: the HiPPO effect dies, juniors' outlier views survive long enough to be evaluated, and position-defending becomes impossible.",
"The reasons are the engine: sharing only the number distribution converges the group to the middle; sharing the reasoning lets the best argument — not the loudest — move people."],
["The research verdict (Diehl & Stroebe and successors): interactive brainstorming produces fewer and less diverse ideas than the same people working silently first — production blocking and anchoring do the damage.",
"The format: crisp question, 5 minutes silent writing, everything posted verbatim, clustering together, then discussion — 6-3-5 brainwriting is a structured variant worth trying.",
"Who it rescues: introverts, juniors, and second-language speakers — exactly the voices whose ideas open brainstorming systematically loses."],
["The craft points: vote simultaneously (sequential voting cascades), give fewer dots than feels comfortable (three forces choice), and let the leader vote last or abstain.",
"What it is and isn't: a heat map of group energy for shortlisting — not a decision, not a mandate, not a substitute for the owner's judgment.",
"Watch the spread, not just the peak: votes scattered evenly mean the group lacks a shared evaluation frame — discuss criteria before voting again."],
["The scale's meaning: fist = I block, 1–2 = major reservations to hear, 3 = I can live with it, 4 = I like it, 5 = I'll champion it.",
"The threes are the finding: a room of threes passes any vote and under-delivers every time — 'can live with it' is absence of objection, not presence of commitment.",
"Protect the low fingers: the first steamrolled two teaches the team to hold up diplomatic fours forever — talk to every one and two before proceeding."],
["Kaner's eight gradients run from enthusiastic endorsement through agreement-with-reservations, abstention and stand-aside, to formal block — a vocabulary for the space between yes and no.",
"'Stand aside' is the crown jewel: it lets a dissenter be honest without forcing a veto — 'I disagree, I won't block, record my dissent' — preserving both integrity and momentum.",
"Record the distribution in the decision note: it is the most honest forecast of implementation energy you will get, and it honors the reservations if course-correction comes."],
["The consent question verbatim: 'do you have a paramount objection — a reason this is unsafe to try?' Objections must name a harm to the aim, not a preference for another option.",
"Every consent decision carries a review date: 'safe to try until we look again' is what makes the lower bar responsible rather than reckless.",
"Objections are gifts in this frame: each one names a risk the proposal now gets modified to survive — integration, not defeat."],
["The timing: 1 minute silent, 2 in pairs, 4 in foursomes, 5 for the room — twelve minutes, any group size, zero preparation.",
"The laundering effect: by the time an idea reaches the room it belongs to a table, not a title — status detaches from content automatically.",
"The prompt determines everything: 'what risks are we not discussing?' works; 'any thoughts?' returns the silence you started with."],
["Nemeth's research: even mild expressions of the majority or authority view measurably suppress dissent and narrow the range of information shared afterward.",
"The discipline has two halves: speak last, and don't telegraph first — the raised eyebrow, the 'interesting…', the leading question all vote before your voice does.",
"Measure your meetings' value: write your position down beforehand; how often the room changes it is exactly how much information your meetings are adding."],
["The entry template: date, decision, options considered, expected outcome with rough probability, how you feel, what would change your mind — two minutes at decision time.",
"What review reveals: hindsight bias dies (you can't rewrite the prediction), luck separates from skill, and your personal biases — optimism, pet weightings, mood effects — become visible as patterns.",
"Mauboussin's addition: note the decision's quality separately from its outcome at review time — the habit that finally stops you punishing good bets and rewarding lucky ones."],
["Laloux's rule: anyone may make any decision — after seeking advice from those meaningfully affected and those with expertise. Advice must be genuinely considered; it need not be followed.",
"Why it scales: decisions land where the information lives, the consultation ring catches blind spots, and commitment comes built-in because affected people shaped the call.",
"The manager's hard part is the override itch: one reversal of a properly-run advice-process decision converts the whole system back into approval-seeking with extra steps."],
["Amazon's format: six pages of narrative prose, no slides, read silently in the meeting's first twenty minutes — because bullets hide reasoning and narrative exposes it.",
"Structure it Minto-style: recommendation first, then reasoning, alternatives honestly weighed, risks named, and what evidence would change your mind.",
"Silent reading equalizes: fast and slow readers, extroverts and introverts, natives and non-natives all meet the same complete argument before anyone can anchor the room."],
["The trap it escapes: single-option proposals invite yes/no — and 'no' restarts everything. Paul Nutt's research: 'whether or not' decisions fail far more often than choices among real alternatives.",
"The integrity test: each option must be something a reasonable person could choose — one real option flanked by a strawman and a fantasy is manipulation with extra paperwork.",
"State your recommendation and its reasoning: options without a view abdicates your expertise; the format is analysis plus judgment, respecting the decider's authority."],
["The military formulation: task (what), purpose (why), end state (what done looks like) — with purpose the part that survives when the plan meets reality.",
"The test: could the person make three good improvised decisions from your intent sentence alone, without calling you?",
"It compounds with delegation: intent is what makes 'I intend to…' cultures possible — people can state intelligent intent only against a clear picture of the end state."],
["Nygard's ADR format, generalized: title, context (the forces at the time), options considered, decision, consequences accepted — one page, written when decided.",
"The two diseases it cures: blind inheritance (following rules whose reasons died) and thrashing (relitigating settled questions each time membership changes).",
"The honesty requirement: record the rejected options and accepted downsides — the road not taken is exactly what future readers need to reassess when context shifts."],
["The grid's five columns: audience, what they need to know, what they care about (not the same thing), when they hear it, through which channel and messenger.",
"Sequence is the minefield: the most affected must never learn from the general announcement, and your boss must never learn from theirs — walk the order checking for blindsides.",
"Same facts, different framings: engineers need the technical why, the steering committee the risk and cost story — emphasis may differ; facts never."],
["The adapted curve's stations: shock, denial, frustration, the dip, experimentation, decision, integration — a process, not an event, and different people travel at different speeds.",
"The two reading errors: mistaking early silence for acceptance (it's shock), and punishing frustration as disloyalty (it's processing).",
"Match leadership to phase: information and repetition early, listening and presence in the dip, coaching and quick wins on the climb."],
["The three columns' jobs: day 30 — visible first moves and early wins (momentum, proof of seriousness); day 60 — structural changes bedded in; day 90 — measurable outcomes and the scheduled review.",
"Calendar the day-90 review before execution starts: pre-scheduled course correction is learning; improvised course correction reads as failure.",
"An empty 30-column is a warning: if nothing visible happens in a month, the organization correctly concludes nothing is happening at all."],
["The decomposition logic: split the headline metric mathematically (rate × volume) or causally (drivers of each) until you reach levers your team can move this week.",
"Two reads of the tree: headroom (which branch has the most improvable room?) and coverage (which branches does no current initiative touch?).",
"Its communication power: every team member can point to their branch and trace the line to the number leadership watches — purpose and math in one diagram."],
["The definitions: lagging indicators score the finished game (results, churn, engagement scores); leading indicators are the influenceable behaviors that predict them (proposals sent, cycle time, one-on-ones held).",
"Run the week on leaders, validate with laggers: twice a year, check the correlation — unvalidated leading indicators may be well-measured superstition.",
"Goodhart's law patrols this ground: when a leading measure becomes a target, it gets gamed — watch the behavior behind the number, and rotate measures that have stopped meaning anything."],
["Format rotation keeps honesty fresh: start/stop/continue for speed, 4 Ls (loved, learned, lacked, longed for) for mood, the sailboat (winds, anchors, rocks) for blockers and risks.",
"The acid test is the opening: review last retro's action first — a retro whose actions evaporate is teaching cynicism on a monthly schedule.",
"One improvement, owned and dated: seven commitments produce zero changes; one commitment with a name on it compounds — the retro is PDCA applied to the team itself."],
["The three sizing questions: what's truly at stake? Can we reverse course cheaply? Do we understand cause and effect here (Clear, Complicated, or Complex)? The answers select the tool — often no tool.",

"The toolkit's actual purpose: not certainty — never on offer — but decisions your team can understand, challenge, commit to, and learn from afterward."],

function initGraph(){
  const cv=document.getElementById("gc"), tip=document.getElementById("gtip"), wrap=cv.parentElement;
  const small=window.innerWidth<=860;
  const W=wrap.clientWidth, H=small?Math.max(340,Math.min(520,window.innerHeight-190)):Math.max(520,Math.min(700,window.innerHeight-240));
  const dpr=window.devicePixelRatio||1;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+"px";
  const ctx=cv.getContext("2d");
  const nodes=[],edges=[],lmap={};
  CONCEPTS.forEach((c,ci)=>{
    const ang=ci/CONCEPTS.length*6.2832;
    nodes.push({t:"c",id:ci,label:c.n,x:W/2+Math.cos(ang)*H*0.3,y:H/2+Math.sin(ang)*H*0.3,vx:0,vy:0,r:9});
  });
  const used=new Set(); CONCEPTS.forEach(c=>c.l.forEach(i=>used.add(i)));
  [...used].sort((a,b)=>a-b).forEach(i=>{
    lmap[i]=nodes.length;
    nodes.push({t:"l",id:i,label:(i+1)+". "+D[i].t,x:W/2+(Math.random()-0.5)*W*0.85,y:H/2+(Math.random()-0.5)*H*0.85,vx:0,vy:0,r:5.5,c:MCOLORS[moduleOf(i)]});
  });
  CONCEPTS.forEach((c,ci)=>c.l.forEach(i=>edges.push([ci,lmap[i]])));
  let scale=1,tx=0,ty=0,alpha=1;
  let dragN=null,panning=false,lx=0,ly=0,moved=0,hoverN=null,selC=-1;
  function tick(){
    for(let a=0;a<nodes.length;a++){
      const na=nodes[a];
      na.vx+=(W/2-na.x)*0.0005; na.vy+=(H/2-na.y)*0.0005;
      for(let b=a+1;b<nodes.length;b++){
        const nb=nodes[b];
        let dx=na.x-nb.x,dy=na.y-nb.y,d2=dx*dx+dy*dy;
        if(d2<1)d2=1;
        if(d2<36000){
          const f=((na.t==="c"||nb.t==="c")?850:380)/d2, dd=Math.sqrt(d2);
          dx/=dd;dy/=dd;
          na.vx+=dx*f;na.vy+=dy*f;nb.vx-=dx*f;nb.vy-=dy*f;
        }
      }
    }
    edges.forEach(e=>{
      const a=nodes[e[0]],b=nodes[e[1]];
      let dx=b.x-a.x,dy=b.y-a.y;
      const d=Math.sqrt(dx*dx+dy*dy)||1, f=(d-68)*0.012;
      dx/=d;dy/=d;
      a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f;
    });
    nodes.forEach(n=>{
      if(n===dragN)return;
      n.x+=n.vx*alpha;n.y+=n.vy*alpha;n.vx*=0.85;n.vy*=0.85;
    });
  }
  function draw(){
    const ink=getComputedStyle(document.body).color;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    ctx.translate(tx,ty);ctx.scale(scale,scale);
    const dim=selC>=0;
    const selSet=dim?new Set(CONCEPTS[selC].l):null;
    edges.forEach(e=>{
      const a=nodes[e[0]],b=nodes[e[1]];
      const on=!dim||e[0]===selC;
      ctx.strokeStyle="rgba(128,128,128,"+(on?0.35:0.06)+")";
      ctx.lineWidth=(on?1:0.5)/scale;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    });
    ctx.font="600 11px Segoe UI, sans-serif";
    ctx.textAlign="center";
    nodes.forEach(n=>{
      const on=!dim||(n.t==="c"?n.id===selC:selSet.has(n.id));
      ctx.globalAlpha=on?1:0.13;
      ctx.beginPath();ctx.arc(n.x,n.y,n.r+(n===hoverN?2.5:0),0,6.2832);
      ctx.fillStyle=n.t==="c"?ink:n.c;
      ctx.fill();
      if(n.t==="c"){ctx.fillStyle=ink;ctx.fillText(n.label,n.x,n.y-n.r-6);}
      ctx.globalAlpha=1;
    });
  }
  function frame(){
    if(current!==-2||!document.getElementById("gc"))return;
    tick();draw();
    if(alpha>0.05)alpha*=0.996;
    requestAnimationFrame(frame);
  }
  function world(ev){const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left-tx)/scale,y:(ev.clientY-r.top-ty)/scale};}
  function pick(p){
    let best=null,bd=1e9;
    nodes.forEach(n=>{
      const dx=n.x-p.x,dy=n.y-p.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<Math.max(n.r+4,11/scale)&&d<bd){bd=d;best=n;}
    });
    return best;
  }
  cv.addEventListener("mousedown",ev=>{
    const p=world(ev); dragN=pick(p); panning=!dragN;
    lx=ev.clientX; ly=ev.clientY; moved=0;
  });
  cv.addEventListener("mousemove",ev=>{
    const dx=ev.clientX-lx, dy=ev.clientY-ly;
    if(dragN){const p=world(ev);dragN.x=p.x;dragN.y=p.y;dragN.vx=0;dragN.vy=0;alpha=Math.max(alpha,0.4);moved+=Math.abs(dx)+Math.abs(dy);}
    else if(panning){tx+=dx;ty+=dy;moved+=Math.abs(dx)+Math.abs(dy);}
    else{
      const n=pick(world(ev));
      hoverN=n;
      if(n){
        const wr=wrap.getBoundingClientRect();
        tip.style.display="block";
        tip.textContent=n.t==="c"?(n.label+" — "+CONCEPTS[n.id].l.length+" tools"):(n.label+" · "+MODULES[moduleOf(n.id)].t);
        tip.style.left=Math.min(ev.clientX-wr.left+14,wrap.clientWidth-220)+"px";
        tip.style.top=(ev.clientY-wr.top+14)+"px";
        cv.style.cursor="pointer";
      }else{tip.style.display="none";cv.style.cursor="grab";}
    }
    lx=ev.clientX; ly=ev.clientY;
  });
  window.addEventListener("mouseup",()=>{
    if(current!==-2)return;
    if(moved<5){
      if(dragN&&dragN.t==="l"){show(dragN.id);return;}
      if(dragN&&dragN.t==="c"){selC=(selC===dragN.id?-1:dragN.id);}
    }
    dragN=null;panning=false;
  },{passive:true});
  cv.addEventListener("mouseleave",()=>{tip.style.display="none";hoverN=null;});
  cv.addEventListener("wheel",ev=>{
    ev.preventDefault();
    const r=cv.getBoundingClientRect(), mx=ev.clientX-r.left, my=ev.clientY-r.top;
    const f=ev.deltaY<0?1.12:1/1.12, ns=Math.min(4,Math.max(0.35,scale*f));
    tx=mx-(mx-tx)*(ns/scale); ty=my-(my-ty)*(ns/scale); scale=ns;
  },{passive:false});
  // ----- Touch support (mobile): drag / pan / tap + two-finger pinch-zoom -----
  let pinchDist=0;
  cv.addEventListener("touchstart",ev=>{
    if(ev.touches.length===1){
      const t=ev.touches[0]; dragN=pick(world(t)); panning=!dragN;
      lx=t.clientX; ly=t.clientY; moved=0;
    }else if(ev.touches.length===2){
      dragN=null; panning=false;
      const a=ev.touches[0], b=ev.touches[1];
      pinchDist=Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    }
  },{passive:false});
  cv.addEventListener("touchmove",ev=>{
    ev.preventDefault();
    if(ev.touches.length===1){
      const t=ev.touches[0], dx=t.clientX-lx, dy=t.clientY-ly;
      if(dragN){const p=world(t);dragN.x=p.x;dragN.y=p.y;dragN.vx=0;dragN.vy=0;alpha=Math.max(alpha,0.4);}
      else if(panning){tx+=dx;ty+=dy;}
      moved+=Math.abs(dx)+Math.abs(dy); lx=t.clientX; ly=t.clientY;
    }else if(ev.touches.length===2){
      const a=ev.touches[0], b=ev.touches[1];
      const nd=Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
      if(pinchDist>0){
        const r=cv.getBoundingClientRect();
        const mx=(a.clientX+b.clientX)/2-r.left, my=(a.clientY+b.clientY)/2-r.top;
        const ns=Math.min(4,Math.max(0.35,scale*(nd/pinchDist)));
        tx=mx-(mx-tx)*(ns/scale); ty=my-(my-ty)*(ns/scale); scale=ns;
      }
      pinchDist=nd; moved+=20;
    }
  },{passive:false});
  cv.addEventListener("touchend",ev=>{
    if(current!==-2)return;
    if(ev.touches.length===0){
      if(moved<8){
        if(dragN&&dragN.t==="l"){show(dragN.id);dragN=null;panning=false;pinchDist=0;return;}
        if(dragN&&dragN.t==="c"){selC=(selC===dragN.id?-1:dragN.id);}
      }
      dragN=null; panning=false; pinchDist=0;
    }
  },{passive:true});
  requestAnimationFrame(frame);
}

/* ===== Keyboard ===== */
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(e.key==="ArrowRight"&&current<D.length-1)show(current<0?0:current+1);
  if(e.key==="ArrowLeft"&&current>0)show(current-1);
});

/* ===== Init ===== */
buildNav();
goHome();
const hm=location.hash.match(/^#t(\d+)$/);
if(hm){const n=parseInt(hm[1],10)-1; if(n>=0&&n<D.length)show(n);}
</script>
